<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>澜幕 · 区块评估 / 重写</title>
<style>
/* 每个创作区块右上角三枚图标：总节点 / 评估 / 重写；非全屏时 AI 助手自动收起，机器人图标呼出 */
:root{--bg:#EDF3F6;--surface:#fff;--s2:#F3F8FA;--ink:#0F2B36;--ink2:#476471;--mut:#7D95A1;--line:#D6E4EA;--teal:#17828A;--teal2:#1A6F9A;--tealbg:#E4F4F3;--red:#E5484D;--redbg:#FDECEC;--amber:#D98E04;--ambbg:#FFF4DC;--green:#1E9E6A;--grnbg:#E3F6EE;--shadow:0 14px 40px rgba(15,43,54,.18);--f:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--fs:"Noto Serif SC","Songti SC",serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.7 var(--f);overflow:hidden}
button,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}.mut{color:var(--mut)}
.app{display:grid;grid-template-columns:76px minmax(0,1fr);height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;font-size:12px;color:var(--mut)}
.rail .lg{width:44px;height:44px;border-radius:12px;background:linear-gradient(150deg,var(--teal),var(--teal2));display:grid;place-items:center;color:#fff;margin-bottom:14px}
.rail a{width:60px;padding:8px 0;border-radius:12px;display:grid;justify-items:center;gap:2px}.rail a.on{background:var(--tealbg);color:var(--teal);font-weight:700}
.col{overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0;white-space:nowrap}.top span,.steps *{white-space:nowrap}@media (max-width:1280px){.top>.mut,.steps>span:first-child,.steps>hr:nth-child(2){display:none}.steps{gap:5px;padding:6px 10px;font-size:12px}.steps hr{width:10px}.top{gap:10px;padding:12px 14px}}
.steps{display:flex;align-items:center;gap:8px;padding:6px 16px;border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--ink2)}
.steps button{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}.steps .n{width:22px;height:22px;border-radius:50%;background:#DCE6EB;color:var(--ink2);display:grid;place-items:center;font-size:11px}
.steps button.on{color:var(--teal);font-weight:700}.steps button.on .n{background:var(--teal);color:#fff}.steps hr{width:22px;border:0;border-top:1px solid var(--line);margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px}.chip i{width:8px;height:8px;border-radius:50%;background:var(--teal2)}
.robot{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--teal);background:var(--tealbg);border:1px solid color-mix(in srgb,var(--teal) 40%,var(--line))}
.robot:hover,.robot.on{background:var(--teal);color:#fff}.robot svg.i{width:24px;height:24px}
.robot::after{content:'';position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff;display:none}.robot.dot::after{display:block}
/* 自定义 tooltip：鼠标悬停显示文字 */
[data-tip]{position:relative}
[data-tip]::before{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#0F2B36;color:#fff;font-size:12px;line-height:1;padding:7px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:80;font-weight:500}
[data-tip]:hover::before{opacity:1}
.top [data-tip="AI助手"]::before{left:auto;right:0;transform:none}
.fab[data-tip]::before{top:auto;bottom:calc(100% + 10px);left:auto;right:0;transform:none}
.ws{display:grid;grid-template-columns:200px minmax(0,1fr) auto;min-height:0}
.tree{padding:18px 14px;border-right:1px solid var(--line);display:grid;gap:2px;align-content:start;font-size:14px;color:var(--ink2);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.tree a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;cursor:pointer}.tree a:hover{background:var(--s2)}.tree a.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 0 var(--line)}
.tree a .b{margin-left:auto;font-size:11px;font-weight:700;color:var(--red);background:var(--redbg);border-radius:9px;padding:0 7px}
.main{overflow:auto;scroll-behavior:smooth}
.doc{max-width:900px;margin:0 auto;padding:22px 30px 40vh;display:grid;gap:18px}
.dh{display:flex;align-items:center;gap:10px}.dh h2{font-size:26px;margin:0;font-weight:900}.badge{font-size:12px;color:var(--green);background:var(--grnbg);padding:0 8px;border-radius:6px;font-weight:700}
.hint{border:1.5px dashed #9CD3CF;background:var(--tealbg);color:var(--ink2);border-radius:14px;padding:9px 16px;font-size:13px}
/* 区块：标题 + 右上角三图标 */
.blk{display:grid;gap:8px}
.bh{display:flex;align-items:center;gap:10px;min-height:44px}.bh h3{margin:0;font-size:18px;font-weight:800}.bh .no{font-family:ui-monospace,Menlo,monospace;color:var(--teal);font-size:13px}.bh .sub{font-size:12px;color:var(--mut)}
.tools{margin-left:auto;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tb{position:relative;width:36px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink2)}.tb:hover{background:var(--s2);color:var(--teal)}
.tb.act{color:var(--teal)}.tb.act.has{background:var(--redbg);color:var(--red)}
.tb .c{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.tools .tb{width:auto;height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700}.tb.act.got{background:var(--tealbg)}.tb.act.has.open{background:var(--redbg)}.tools .tb .c{position:static;margin-left:0}
.rp{background:var(--surface);border:1.5px solid color-mix(in srgb,var(--teal) 45%,var(--line));border-radius:18px;padding:14px;display:grid;gap:12px}.rph{display:flex;align-items:center;gap:10px}.rph b{font-size:15px}.rpx{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}.rpx:hover{background:var(--s2)}
.rp .hero{grid-template-columns:auto auto minmax(0,1fr);gap:18px}.dims{display:grid;gap:8px}.isg{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.txt{background:#F2F6F8;border-radius:10px;padding:12px 14px;display:grid;gap:3px;font-size:14.5px;position:relative}
.p b{font-weight:700}.p.act::before{content:"△ ";color:var(--mut)}.p.hd{font-weight:700;margin-top:4px}.p.meta{font-size:12.5px;color:var(--mut)}.p.dg .par{color:var(--mut)}
.mk{cursor:pointer;background:var(--redbg);text-decoration:underline wavy var(--red);text-decoration-thickness:1px;text-underline-offset:4px;border-radius:3px}
.mk.warn{background:var(--ambbg);text-decoration-color:var(--amber)}
.mk .nm{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/1 var(--f);margin-left:3px;vertical-align:2px;text-decoration:none}.mk.warn .nm{background:var(--amber)}
.mk.focus{outline:2px solid var(--teal);outline-offset:1px;background:color-mix(in srgb,var(--teal) 18%,#fff)}
.p.new{background:color-mix(in srgb,var(--green) 16%,transparent);border-radius:5px}
.rwtag{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--green);padding:0 2px}.verbar{display:flex;align-items:center;gap:10px;font-size:12.5px;background:var(--grnbg);border:1px solid #BFE6D3;border-radius:12px;padding:6px 12px;flex-wrap:wrap}.verbar.back{background:var(--ambbg);border-color:#F1D28A}.verbar .vt{font-weight:700;color:var(--green)}.verbar.back .vt{color:var(--amber)}.verbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 10px;font-weight:600;color:var(--teal)}.verbar button:hover{border-color:var(--teal)}
del{background:#FDE3E3;color:#B3262B;text-decoration:line-through}ins{background:#D5F3E4;color:#116B45;text-decoration:none}.legend{display:flex;gap:14px;font-size:12px}.chead{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;font-weight:700;color:var(--ink2)}.cmp{display:grid;gap:8px}.crow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cc{border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.75}.cc.o{background:#FBF4F4}.cc.n{background:#F1FAF5}@media (max-width:900px){.crow,.chead{grid-template-columns:1fr}}
.rwtag.stale{color:var(--amber)}.rwtag button{color:var(--teal);text-decoration:underline}
/* 右侧栏 */
.side{width:0;overflow:hidden;background:var(--surface);border-left:0;display:flex;flex-direction:column;min-height:0;transition:width .22s}
.side{position:relative}.side.open{width:var(--sw,380px);border-left:1px solid var(--line)}.side.drag{transition:none}
.side>*:not(.grip){min-width:var(--sw,380px)}
.side>.compose:not(.grip){min-width:calc(var(--sw,380px) - 32px)}.narrow .side>.compose:not(.grip){min-width:0}.grip{position:absolute;left:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5;min-width:0}.grip::after{content:'';position:absolute;left:2px;top:50%;height:44px;width:4px;margin-top:-22px;border-radius:2px;background:var(--line);transition:background .15s}.grip:hover::after,.side.drag .grip::after{background:var(--teal)}
.sh{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line)}.sh b{font-size:15px}.sh .x{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}.sh .x:hover{background:var(--s2)}
.stabs{display:flex;gap:4px}.stabs button{padding:4px 12px;border-radius:999px;color:var(--ink2);font-size:13px}.stabs button.on{background:var(--tealbg);color:var(--teal);font-weight:700}
.warnbox{background:var(--ambbg);border:1px solid #F1D28A;border-radius:12px;padding:10px 12px;display:grid;gap:6px;font-size:13px}.aff{display:flex;gap:6px;flex-wrap:wrap}.aff span{background:#fff;border:1px solid #F1D28A;border-radius:999px;padding:0 10px;font-size:12px}
.sbody{flex:1;min-height:0;overflow:auto;padding:14px 16px;display:grid;gap:12px;align-content:start}
.msg{background:var(--s2);border-radius:14px;padding:10px 12px;font-size:13.5px}.msg.me{background:var(--tealbg);justify-self:end;max-width:85%}
.compose{margin:12px 16px 16px;border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;gap:8px}.compose textarea{border:0;outline:0;resize:none;height:56px;background:none;font-size:13.5px}
.compose .r{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.send{width:36px;height:34px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center}
/* 报告 */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:14px}
.ring{--p:80;--rc:var(--green);width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%),#E1EAEE 0);display:grid;place-items:center;position:relative}.ring::after{content:'';position:absolute;inset:8px;border-radius:50%;background:#fff}.ring b{position:relative;z-index:1;font:700 26px ui-monospace,Menlo,monospace}
.st{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:0 8px;border-radius:6px}.st.good{color:var(--green);background:var(--grnbg)}.st.warn{color:var(--amber);background:var(--ambbg)}.st.bad{color:var(--red);background:var(--redbg)}
.dim{display:grid;grid-template-columns:78px minmax(0,1fr) 84px;gap:8px;align-items:center;font-size:12.5px}.dim .tr{height:8px;border-radius:4px;background:#E1EAEE;overflow:hidden}.dim .tr i{display:block;height:100%;border-radius:4px}.dim .v{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-family:ui-monospace,Menlo,monospace}
.sec{font-size:12px;color:var(--mut);margin:2px 0 -4px}
.it{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:5px;cursor:pointer;background:#fff}.it:hover{border-color:#9CD3CF}.it.focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--tealbg)}
.it .t{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13.5px}
.it .n{display:grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700}.it.warn .n{background:var(--amber)}
.it q{display:block;quotes:none;font-size:12.5px;color:var(--ink2);border-left:3px solid var(--line);padding-left:8px}
.it .op{font-size:13px;color:var(--ink)}.it .go{font-size:11.5px;color:var(--teal)}
.note{font-size:12px;color:var(--mut);background:var(--s2);border-radius:10px;padding:8px 10px}
.scan{display:grid;gap:12px;place-items:center;text-align:center;padding:60px 10px;color:var(--ink2)}
.pulse{width:76px;height:76px;border-radius:50%;background:var(--tealbg);color:var(--teal);display:grid;place-items:center;animation:pl 1.3s ease-in-out infinite}.pulse svg.i{width:36px;height:36px}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(23,130,138,.35)}100%{box-shadow:0 0 0 16px rgba(23,130,138,0)}}
.prog{width:100%;height:8px;border-radius:4px;background:#E1EAEE;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal2));transition:width .2s}
/* 浮层 */
.pop{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;width:250px;display:grid;gap:2px}
.pop h5{margin:2px 6px 4px;font-size:12px;color:var(--mut);font-weight:500}
.pop .row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;color:var(--ink2)}.pop .row.cur{background:var(--tealbg);color:var(--teal);font-weight:700}.pop .row .tg{margin-left:auto;font-size:11px;color:var(--mut)}
.mask{position:fixed;inset:0;background:rgba(15,43,54,.35);z-index:75;display:grid;place-items:center}
.dlg{background:#fff;border-radius:18px;width:min(520px,92vw);padding:18px;display:grid;gap:10px;box-shadow:var(--shadow)}.dlg h4{margin:0;font-size:16px}.dlg textarea{border:1px solid var(--line);border-radius:12px;padding:10px;height:84px;resize:none;outline:0}.dlg textarea:focus{border-color:var(--teal)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--ink2)}.chips button:hover{border-color:var(--teal);color:var(--teal)}
.fr{display:flex;gap:8px;justify-content:flex-end}.btn{height:34px;padding:0 16px;border-radius:10px;border:1px solid var(--line);font-weight:600;background:#fff}.btn.pri{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-color:transparent}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#0F2B36;color:#fff;padding:9px 18px;border-radius:12px;z-index:99}
.fab{position:fixed;right:22px;bottom:24px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;display:none;place-items:center;box-shadow:var(--shadow);z-index:40}.fab svg.i{width:28px;height:28px}
.fab.show{display:grid}
/* 非全屏：AI 助手变浮层，默认收起 */
.narrow .side{position:fixed;right:0;top:65px;bottom:0;z-index:50;box-shadow:var(--shadow)}
.narrow .side.open{width:min(var(--sw,400px),92vw)}.narrow .side>*:not(.grip){min-width:0}
@media (max-width:900px){.ws{grid-template-columns:minmax(0,1fr)}.tree{display:none}.rail{display:none}.app{grid-template-columns:1fr}.steps{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
<nav class="rail"><div class="lg"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M2 14c2 0 3-2 5-2s3 2 5 2 3-2 5-2 3 2 5 2M2 19c2 0 3-2 5-2s3 2 5 2 3-2 5-2 3 2 5 2"/></svg></div><a>创作</a><a class="on">项目</a><a>剧本库</a><a>素材库</a><a>历史</a></nav>
<div class="col"><header class="top" id="top"></header>
<div class="ws" id="ws"><nav class="tree" id="tree"></nav><main class="main" id="main"></main><aside class="side" id="side"></aside></div></div></div>
<button class="fab" id="fab" data-tip="AI助手" data-act="side" aria-label="AI助手"></button>
<div id="ov"></div><div class="toast" id="toast" hidden></div>
<script>
(function(){'use strict';
const IC={bot:'<rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4.5M10.5 4.5h3"/><circle cx="9" cy="13.5" r="1.2"/><circle cx="15" cy="13.5" r="1.2"/><path d="M2 13v2M22 13v2M10 17h4"/>',layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',check:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 13l2.2 2.2L15.5 10.5"/>',redo:'<path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',send:'<path d="M4 12l16-8-6 16-3-7z"/>',pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>'};
const ic=k=>`<svg class="i" viewBox="0 0 24 24">${IC[k]}</svg>`;
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2200)}
// ---------- 演示数据（《她的第二张脸》） ----------
const P=(l,t)=>({k:'p',l,t}),A=t=>({k:'act',t}),D=(w,p,t)=>({k:'dlg',w,p,t}),H=t=>({k:'hd',t}),M=t=>({k:'meta',t});
const I=(q,sev,dim,title,op,fix)=>({q,sev,dim,title,op,fix});
const NODE={cre:'创意',plan:'策划案',ol:'集纲',sc:'剧本'};
const DIMS={cre:['设定新鲜度','人物动机','结构节奏','落地具体'],plan:['人物立体','关系张力','主线推进','风险把控'],ol:['冲突强度','期待点','转折','结尾钩子'],sc:['台词口语','动作可拍','对白交锋','结尾钩子']};
const B={};
B.cre={node:'cre',title:'核心创意',paras:[P('目标受众：','女频，主打才华碾压与身份反转的爽感'),P('故事类型：','现代豪门 × 艺术复仇'),P('一句话故事：','被豪门退婚的天才设计师，三年后以神秘大师身份归来，用一场场艺术展揭露仇家的丑恶，在名利场之巅完成复仇与自我价值的双重加冕。'),

function renderTop(){const v=S.view;const sn=[['cre','创意生成'],['plan','策划案'],['ol','集纲'],['sc','剧本']];
  $('#top').innerHTML=`<button class="tb" style="width:28px" data-act="noop">‹</button><h1>她的第二张脸</h1><div class="steps"><span>开始创作</span><hr>${sn.map((s,i)=>`<button data-view="${s[0]}" class="${v===s[0]?'on':''}"><span class="n">${i+1}</span>${s[1]}</button>${'<hr>'}`).join('')}<button><span class="n">5</span>导出</button></div><span class="sp"></span><span class="mut" style="font-size:13px">✓ 已自动保存</span><span class="chip"><i></i>DeepSeek-V4 Pro ⌄</span><button class="robot ${S.side?'on':''}" data-tip="AI助手" data-act="side" aria-label="AI助手">${ic('bot')}</button>`}
function renderTree(){$('#tree').innerHTML=VIEWS.map(([k,n,r])=>{const c=blocksOf(k).reduce((s,id)=>s+(S.rep[id]?S.rep[id].issues.length:0),0);return`<a data-view="${k}" class="${S.view===k?'on':''}">${n}${r?`<span class="mut" style="margin-left:auto;font-size:12px">${r}</span>`:''}${c?`<span class="b" ${r?'':''}>${c}</span>`:''}</a>`}).join('')}
function paraHtml(p,rep){let t=esc(p.t||'');const raw=p.t||'';
  if(rep){for(const i of rep.issues){const q=esc(i.q);if(raw.includes(i.q)){t=t.replace(q,`<span class="mk ${i.sev==='bad'?'':'warn'}" id="mk-${i.id}" data-mk="${i.id}">${q}<span class="nm">${i.n}</span></span>`)}}}
  if(p.k==='act')return`<div class="p act">${t}</div>`;if(p.k==='hd')return`<div class="p hd">${esc(p.t)}</div>`;if(p.k==='meta')return`<div class="p meta">${esc(p.t)}</div>`;
  if(p.k==='dlg')return`<div class="p dg"><b>${esc(p.w)}</b> <span class="par">（${esc(p.p)}）</span>：${t}</div>`;
  return`<div class="p">${p.l?`<b>${esc(p.l)}</b>`:''}${t}</div>`}
function toolsHtml(id){const r=S.rep[id];const n=r?r.issues.length:0;
  return`<div class="tools"><button class="tb act ${r?'got':''} ${n?'has':''} ${r&&S.open[id]?'open':''}" data-act="eval" data-id="${id}">${ic('check')}<span>${r?'评估报告':'评估'}</span>${n?`<span class="c">${n}</span>`:''}</button><button class="tb" data-act="rw" data-id="${id}">${ic('redo')}<span>重写</span></button></div>`}
function blockHtml(id){const b=B[id],r=S.rep[id];id=id;b.iss.forEach((i,k)=>i.id=i.id||id+'_'+k);
  const head=b.no?`<span class="no">${b.no}</span><h3>${esc(b.title)}</h3>`:`<h3>${esc(b.title)}</h3>`;
  return`<section class="blk" id="blk-${id}"><div class="bh">${head}${toolsHtml(id)}</div>${S.stale[id]?`<div class="rwtag stale">⚠ 上游内容已改动，本区块可能需要同步 <button data-act="rw" data-id="${id}">去重写</button></div>`:''}${verBar(id)}${S.cmp[id]&&S.ver[id]?cmpHtml(id):''}${S.scan[id]?scanHtml(id):(r&&S.open[id]?reportHtml(id):'')}<div class="card"><div class="txt">${b.paras.map(p=>paraHtml(p,S.open[id]?r:null)).join('')}</div></div></section>`}
function renderMain(keep){const m=$('#main');const st=m.scrollTop;const v=S.view;
  const title=v==='cre'?'创意生成':v==='plan'?'策划案':v==='ol'?'集纲 · 一卡':'短剧剧本';
  m.innerHTML=`<div class="doc"><div class="dh"><h2>她的第二张脸</h2><span class="badge">${v==='sc'?'已生成':'已编辑 · v2'}</span><span class="mut">身份博弈流 | 80 集</span></div><div class="hint">✎ 正文支持整块自由编辑，修改后会自动保存；按 Esc 可撤销当前正在编辑的一处。每个区块右上角可「评估」「重写」。</div>${blocksOf(v).map(blockHtml).join('')}</div>`;
  if(keep)m.scrollTop=st}
function renderSide(){const sd=$('#side');sd.classList.toggle('open',S.side);$('#fab').classList.toggle('show',!S.side);
  $('#fab').innerHTML=ic('bot');
  const body=`<div class="sbody" id="sb">${S.msgs.map(m=>`<div class="msg ${m[0]==='me'?'me':''}">${esc(m[1])}</div>`).join('')}</div><div class="compose"><textarea id="inp" placeholder="和 AI 助手对话，或补充后续创作要求"></textarea><div class="r"><span>作用于：${esc(scopeName())}</span><span class="sp"></span><button class="send" data-act="send">${ic('send')}</button></div></div>`;
  sd.innerHTML=`<div class="grip" data-grip title="拖动调整宽度，双击恢复默认"></div><div class="sh"><div class="stabs"><button class="on">AI 助手</button></div><button class="x" data-act="side" aria-label="关闭">${ic('x')}</button></div>${body}`}
function reportHtml(id){const r=S.rep[id];const b=band(r.score);const col={good:'var(--green)',warn:'var(--amber)',bad:'var(--red)'};
  return`<div class="rp"><div class="rph"><b>评估报告</b><span class="mut" style="font-size:12px">${esc(label(id))} · 只给意见，不改原文</span><button class="rpx" data-act="rpclose" data-id="${id}" aria-label="关闭报告">${ic('x')}</button></div>
  <div class="hero"><div class="ring" style="--p:${r.score};--rc:${col[b]}"><b>${r.score}</b></div><div style="display:grid;gap:4px;align-content:center"><div>${stt(r.score)} <span class="mut" style="font-size:12px;margin-left:6px">共 ${r.issues.length} 处意见 · ${r.issues.filter(i=>i.sev==='bad').length} 处需修改</span></div></div><div class="dims">${r.dims.map(d=>`<div class="dim"><span>${d[0]}</span><span class="tr"><i style="width:${d[1]}%;background:${col[band(d[1])]}"></i></span><span class="v">${d[1]} ${stt(d[1])}</span></div>`).join('')}</div></div>
  <div class="sec">修改意见（点击跳转到下方原文对应位置）</div><div class="isg">${r.issues.length?r.issues.map(i=>`<div class="it ${i.sev}" id="it-${i.id}" data-it="${i.id}"><div class="t"><span class="n">${i.n}</span>${esc(i.title)}<span class="st ${i.sev}" style="margin-left:auto">${i.sev==='bad'?'✕ 需修改':'! 建议'}</span></div><q>${esc(i.q.length>38?i.q.slice(0,38)+'…':i.q)}</q><div class="op">${esc(i.op)}</div><div class="go">↗ 定位到原文</div></div>`).join(''):`<div class="msg">✓ 没有发现需要修改的问题。</div>`}</div>
  <div class="note">评估只给意见，不改动、不重写原文。需要修改请点右上角的「重写」；关闭后再点「评估报告」可随时重新查看，不会重复评估。</div></div>`}
function scanHtml(id){return`<div class="rp"><div class="scan"><div class="pulse">${ic('pulse')}</div><b>正在评估「${esc(label(id))}」…</b><div class="prog"><i id="pg-${id}"></i></div></div></div>`}
const ALL=['plan1','plan2','ol1','ol2','ol3','ol4','sc1','sc2','sc3'];
function deps(id){const n=B[id].node;if(n==='cre')return ALL;if(n==='plan')return ALL.filter(x=>/^(ol|sc)/.test(x));if(n==='ol'){const k='sc'+id.slice(2);return B[k]?[k]:[]}return[]}
const label=id=>{const b=B[id];return b.no?`${NODE[b.node]} · ${b.no}`:b.title};
const scopeName=()=>({cre:'创意生成',plan:'策划案',ol:'集纲 · 一卡',sc:'短剧剧本'})[S.view];
function renderAll(){renderTop();renderTree();renderMain();renderSide()}
// ---------- 行为 ----------
function runEval(id){S.scan[id]=1;renderMain(true);let w=0;const t=setInterval(()=>{w+=12+Math.random()*14;const pg=document.getElementById('pg-'+id);if(pg)pg.style.width=Math.min(w,100)+'%';if(w>=100){clearInterval(t);delete S.scan[id];S.rep[id]=evaluate(id);S.open[id]=true;renderTop();renderTree();renderMain(true)}},180)}
function focusIssue(iid,fromMk){document.querySelectorAll('.mk.focus,.it.focus').forEach(e=>e.classList.remove('focus'));
  const el=document.getElementById('mk-'+iid),it=document.getElementById('it-'+iid);
  if(el){el.classList.add('focus');if(!fromMk)el.scrollIntoView({block:'center',behavior:'smooth'})}
  if(it){it.classList.add('focus');if(fromMk)it.scrollIntoView({block:'center',behavior:'smooth'})}}
const clone=o=>JSON.parse(JSON.stringify(o));
function rewriteParas(id,paras){const b=B[id];return paras.map((p,i)=>{if(!p.t)return p;let t=p.t;b.iss.forEach(x=>{if(t.includes(x.q))t=t.replace(x.q,x.fix)});if(RW[id]&&RW[id][i]!==undefined)t=RW[id][i];return{...p,t}})}
const nChg=v=>v.orig.filter((p,i)=>p.t!==v.nw[i].t).length;
function doRewrite(id,note,silent){delete S.stale[id];const b=B[id];const orig=S.ver[id]?S.ver[id].orig:clone(b.paras);const nw=rewriteParas(id,orig);
  S.ver[id]={orig,nw,note,cur:'nw',n:(S.ver[id]?S.ver[id].n:1)+1};b.paras=clone(nw);S.cmp[id]=true;
  delete S.rep[id];delete S.open[id];renderTop();renderTree();renderMain(true);if(!silent)toast('已重写「'+label(id)+'」，下方是前后对比')}
function useVer(id,w){const v=S.ver[id];v.cur=w;B[id].paras=clone(w==='nw'?v.nw:v.orig);delete S.rep[id];delete S.open[id];renderTop();renderTree();renderMain(true);toast(w==='nw'?'已恢复重写版':'已回退到原版本')}
// 字符级 diff（LCS），用于前后对比
function diff(a,b){const n=a.length,m=b.length,T=Array.from({length:n+1},()=>new Uint16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=a[i]===b[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  const ops=[];let i=0,j=0;const add=(t,c)=>{const l=ops[ops.length-1];if(l&&l.t===t)l.s+=c;else ops.push({t,s:c})};
  while(i<n&&j<m){if(a[i]===b[j]){add('=',a[i]);i++;j++}else if(T[i+1][j]>=T[i][j+1]){add('-',a[i++])}else{add('+',b[j++])}}
  while(i<n)add('-',a[i++]);while(j<m)add('+',b[j++]);
  // 短的相同片段（<4 字）并入前后改动，避免碎片化
  const g=[];ops.forEach((o,k)=>{if(o.t==='='&&o.s.length<4&&k>0&&k<ops.length-1){g.push({t:'-',s:o.s},{t:'+',s:o.s})}else g.push(o)});
  let L='',R='',dl='',ir='';const fl=()=>{if(dl)L+=`<del>${esc(dl)}</del>`;if(ir)R+=`<ins>${esc(ir)}</ins>`;dl=ir=''};
  g.forEach(o=>{if(o.t==='='){fl();L+=esc(o.s);R+=esc(o.s)}else if(o.t==='-')dl+=o.s;else ir+=o.s});fl();return[L,R]}
function verBar(id){const v=S.ver[id];if(!v)return'';const n=nChg(v);
  return v.cur==='nw'?`<div class="verbar"><span class="vt">✓ 已重写 · v${v.n}</span><span class="mut">改动 ${n} 处${v.note?' · 要求：'+esc(v.note):''}</span><span class="sp"></span><button data-act="cmp" data-id="${id}">${S.cmp[id]?'收起对比':'查看对比'}</button><button data-act="ver" data-id="${id}" data-v="orig">回退到原版本</button></div>`
  :`<div class="verbar back"><span class="vt">↩ 已回退到原版本</span><span class="mut">重写版仍保留</span><span class="sp"></span><button data-act="cmp" data-id="${id}">${S.cmp[id]?'收起对比':'查看对比'}</button><button data-act="ver" data-id="${id}" data-v="nw">恢复重写版</button></div>`}
function cmpHtml(id){const v=S.ver[id];const rows=[];let same=0;
  v.orig.forEach((p,i)=>{if(!p.t)return;if(p.t===v.nw[i].t){same++;return}const[l,r]=diff(p.t,v.nw[i].t);const lb=p.l||(p.k==='dlg'?p.w+'：':'');rows.push(`<div class="crow"><div class="cc o">${lb?`<b>${esc(lb)}</b>`:''}${l}</div><div class="cc n">${lb?`<b>${esc(lb)}</b>`:''}${r}</div></div>`)});
  return`<div class="rp"><div class="rph"><b>重写前后对比</b><span class="mut" style="font-size:12px">${esc(label(id))} · 改动 ${rows.length} 处，另有 ${same} 处未改动</span><button class="rpx" data-act="cmp" data-id="${id}" aria-label="收起对比">${ic('x')}</button></div>
  <div class="legend"><span><del>删除 / 被替换</del></span><span><ins>新增 / 替换为</ins></span></div>
  <div class="chead"><span>原版本</span><span>重写版 v${v.n}</span></div><div class="cmp">${rows.join('')||'<div class="msg">重写后没有文字变化。</div>'}</div>
  <div class="fr">${v.cur==='nw'?`<button class="btn" data-act="ver" data-id="${id}" data-v="orig">回退到原版本</button><button class="btn pri" data-act="cmp" data-id="${id}">保留重写版，收起</button>`:`<button class="btn pri" data-act="ver" data-id="${id}" data-v="nw">恢复重写版</button>`}</div></div>`}
function openRw(id){S.rw=id;const d=deps(id);
  const warn=d.length?`<div class="warnbox"><b>⚠ 可能会影响其他部分</b><div>改动「${esc(label(id))}」后，已生成的下游内容可能与之不一致：</div><div class="aff">${d.map(x=>`<span>${esc(label(x))}</span>`).join('')}</div><div class="mut" style="font-size:12px">共 ${d.length} 处。是否连同下游一起重写？</div></div>`:'';
  const btns=d.length?`<button class="btn" data-act="closepop">取消</button><button class="btn" data-act="rwgo" data-scope="self">只重写本区块</button><button class="btn pri" data-act="rwgo" data-scope="all">全部重写（共 ${d.length+1} 处）</button>`:`<button class="btn" data-act="closepop">取消</button><button class="btn pri" data-act="rwgo" data-scope="self">开始重写</button>`;
  $('#ov').innerHTML=`<div class="mask" data-act="closepop"><div class="dlg"><h4>重写 · ${esc(label(id))}</h4>${warn}<span class="mut" style="font-size:13px">补充要求（选填）：</span><textarea id="rwn" placeholder="例如：台词更口语、结尾钩子更狠"></textarea><div class="chips"><button data-chip="台词更口语">台词更口语</button><button data-chip="结尾钩子更狠">结尾钩子更狠</button><button data-chip="冲突再强一点">冲突再强一点</button></div><div class="fr">${btns}</div></div></div>`}
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){S.view=v.dataset.view;$('#main').scrollTop=0;renderTop();renderTree();renderMain();return}
  const mk=e.target.closest('[data-mk]');if(mk){focusIssue(mk.dataset.mk,true);return}
  const it=e.target.closest('[data-it]');if(it){focusIssue(it.dataset.it,false);return}
    const ch=e.target.closest('[data-chip]');if(ch){const t=$('#rwn');t.value=(t.value?t.value+'，':'')+ch.dataset.chip;return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
  if(act==='side'){S.side=!S.side;renderTop();renderSide()}
  else if(act==='eval'){if(S.scan[id])return;if(S.rep[id]){S.open[id]=!S.open[id];renderMain(true)}else runEval(id)}
  else if(act==='rpclose'){S.open[id]=false;renderMain(true)}
  else if(act==='rw')openRw(id);
  else if(act==='closepop'){if(a.classList.contains('mask')&&e.target!==a)return;$('#ov').innerHTML=''}
  else if(act==='rwgo'){const n=$('#rwn').value.trim();const id2=S.rw,all=a.dataset.scope==='all',d=deps(id2);$('#ov').innerHTML='';toast('正在重写…');
    if(!all){setTimeout(()=>{doRewrite(id2,n,d.length);if(d.length){d.forEach(x=>S.stale[x]=1);renderMain(true);toast('已只重写本区块；下游 '+d.length+' 处标记为「上游已改动」')}},900)}
    else{const q=[id2,...d];let k=0;const step=()=>{doRewrite(q[k],n,true);k++;if(k<q.length){toast('正在同步重写 '+k+'/'+q.length+'…');setTimeout(step,450)}else toast('已全部重写，共 '+q.length+' 处')};setTimeout(step,700)}}
  else if(act==='cmp'){S.cmp[id]=!S.cmp[id];renderMain(true)}
  else if(act==='ver')useVer(id,a.dataset.v)
  else if(act==='send'){const t=$('#inp');const x=t.value.trim();if(!x)return;S.msgs.push(['me',x]);S.msgs.push(['ai','收到。（演示：这里会按「'+scopeName()+'」处理你的要求）']);renderSide();const sb=$('#sb');sb.scrollTop=sb.scrollHeight}
});
let drag=false;
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-grip]')){drag=true;$('#side').classList.add('drag');e.preventDefault()}});
document.addEventListener('pointermove',e=>{if(!drag)return;setW(innerWidth-e.clientX)});
document.addEventListener('pointerup',()=>{if(drag){drag=false;$('#side').classList.remove('drag')}});
document.addEventListener('dblclick',e=>{if(e.target.closest('[data-grip]'))setW(380)});
function setW(w){S.w=Math.max(300,Math.min(680,Math.round(w)));document.documentElement.style.setProperty('--sw',S.w+'px');try{localStorage.setItem('wd-sw',S.w)}catch(_){}}
try{const w=+localStorage.getItem('wd-sw');if(w)setW(w)}catch(_){}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').innerHTML=''});
function applyMQ(){WIDE=mq.matches;$('#app').classList.toggle('narrow',!WIDE);S.side=WIDE;renderTop();renderSide()}
mq.addEventListener('change',applyMQ);$('#app').classList.toggle('narrow',!WIDE);
window.__S=S;renderAll();
})();
</script>
</body>
</html>
