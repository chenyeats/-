<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>澜幕 · 精细生成 · 停留推荐</title>
<style>
/* 精细生成工作台：目录 / 文档 / AI 助手。重点演示「用户停留时，AI 助手弹出技能推荐」的交互 */
:root{
  color-scheme:dark;
  --bg:#061320;--bg2:#0A1B2A;--surface:#0D2132;--surface2:#12293C;--hover:#183449;--line:#1B3346;--line2:#27465E;
  --fg:#E5F0F5;--fg2:#A6BFCC;--muted:#6C8899;
  --accent:#3FD6C9;--accent-dim:rgba(63,214,201,.14);--on-accent:#032220;--accent2:#4BA3FF;
  --coral:#FF8E6E;--coral-dim:rgba(255,142,110,.15);--red:#FF6B6B;--violet:#9D8CFF;--green:#6EDB9A;--amber:#F5C36B;
  --shadow:0 18px 50px rgba(0,0,0,.4);
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-serif:"Noto Serif SC","Songti SC","STSong",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1100px 520px at 50% -8%,rgba(63,214,201,.12),transparent 65%),var(--bg);background-attachment:fixed;color:var(--fg);font:14px/1.6 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}.muted{color:var(--muted)}.sm{font-size:12px}.mono{font-family:var(--f-mono)}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--fg);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2)}.btn.ghost:hover{color:var(--fg);background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.ok{border-color:color-mix(in srgb,var(--green) 60%,var(--line2));color:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--fg2)}
.iconbtn:hover{background:var(--hover);color:var(--fg)}

/* 顶栏 */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(150deg,var(--accent),var(--accent2));color:var(--on-accent)}
.logo svg{width:20px;height:20px;fill:currentColor;stroke:none}
.ptitle{font-weight:700;font-size:15px;padding:2px 6px;border-radius:6px;outline:none}
.ptitle:hover,.ptitle:focus{background:var(--surface2)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--accent-dim);color:var(--accent)}
.steps{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.steps b{color:var(--fg2);font-weight:500}.steps .on{color:var(--accent)}
.steps i{width:14px;height:1px;background:var(--line2)}
.asstbtn{position:relative;width:36px;height:36px;border:1px solid var(--line);border-radius:10px}
.asstbtn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--accent-dim)}
.asstbtn.dot::after{content:'';position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--bg);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.4)}}

/* 三栏 */
.ws{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;min-height:0}
.ws.noasst{grid-template-columns:200px minmax(0,1fr)}
.ws.noasst .asst{display:none}
.tree{border-right:1px solid var(--line);padding:12px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.tree h4{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.08em;margin:14px 10px 4px}
.tree a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--fg2);font-size:13px}
.tree a:hover{background:var(--hover);color:var(--fg)}
.tree a.on{background:var(--surface2);color:var(--fg);font-weight:500}
.tree a.dim{opacity:.45}
.tree a .r{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.tree .kind{font-size:10px;padding:0 5px;border-radius:4px;background:var(--surface2);color:var(--muted)}
.tree .tipdot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.main{overflow:auto;position:relative;scroll-behavior:smooth}
.doc{max-width:860px;margin:0 auto;padding:20px 32px 50vh;display:grid;gap:16px}
.dh{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dh h2{margin:0;font-size:24px;font-weight:900;display:flex;align-items:center;gap:10px}
.dh .meta{color:var(--muted);font-size:12px;margin-top:4px}
.dh .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.st{font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--green)}
.st.locked{color:var(--fg)}
.hint{font-size:12px;color:var(--fg2);border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;padding:10px 14px}
.ep{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 14px;padding:14px 10px;border-radius:12px;border:1px solid transparent;transition:background .3s,border-color .3s}
.ep+.ep{border-top-color:var(--line);border-radius:0}
.ep .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);grid-row:span 3}
.ep .no b{display:block;font-size:20px;color:var(--fg);font-weight:600}
.ep .t{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ep .s{color:var(--fg2);font-size:13px;outline:none;border-radius:6px}
.ep .s:focus{background:var(--surface)}
.ep .h{color:var(--muted);font-size:12px}
.ep.card .no b{color:var(--coral)}
.cardtag{font-size:11px;font-weight:700;color:var(--coral);border:1px solid var(--coral);padding:0 6px;border-radius:5px}
.revtag{font-size:11px;font-weight:700;color:var(--violet);border:1px solid color-mix(in srgb,var(--violet) 60%,transparent);background:color-mix(in srgb,var(--violet) 12%,transparent);padding:0 6px;border-radius:5px}
.ep.reading{background:color-mix(in srgb,var(--fg) 3%,transparent)}
.ep.tipfocus{background:color-mix(in srgb,var(--accent) 7%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)!important;border-radius:12px!important}
.ep .tippill{position:absolute;right:10px;top:12px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:2px 9px;box-shadow:0 4px 14px rgba(63,214,201,.35);animation:popin .3s cubic-bezier(.2,.9,.3,1.3)}
.ep .tippill svg.i{width:12px;height:12px}
@keyframes popin{from{opacity:0;transform:scale(.8)}}
.ep .old{grid-column:2;font-size:12px;color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--red) 60%,transparent)}
.ep.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--violet) 22%,transparent)}}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:4px;font-size:13.5px;margin-top:6px}
.scene .hd{font-family:var(--f-mono);font-size:12px;font-weight:600}
.ln{color:var(--fg2)}.ln.dlg b{color:var(--fg)}.ln .par{color:var(--muted)}.ln.hook{color:var(--coral);font-weight:600}
.ln.act::before{content:"△ ";color:var(--muted)}
.empty{display:grid;place-items:center;gap:12px;padding:70px 20px;color:var(--muted);border:1px dashed var(--line2);border-radius:16px;text-align:center}
.gen{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px 18px;display:grid;gap:10px}
.tank{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}.tank i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.plan p{color:var(--fg2);margin:4px 0 0;white-space:pre-wrap}
.plan h3{margin:14px 0 0;font-size:15px}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:8px}
.char{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--fg2)}
.char b{display:block;color:var(--fg);font-size:15px}.char span{font-size:11px;color:var(--accent)}

/* AI 助手 */
.asst{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--bg2) 60%,transparent)}
.asst header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.msgs{flex:1;min-height:0;overflow:auto;padding:14px;display:grid;gap:12px;align-content:start}
.msg{display:grid;gap:6px}
.msg .who{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.msg .bub{padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap}
.msg.ai .bub{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.msg.me{justify-items:end}.msg.me .bub{background:var(--accent-dim);border-top-right-radius:4px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap}
#tipslot{padding:0 14px}
.tip{border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line));border-radius:16px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));padding:12px;display:grid;gap:8px;margin-bottom:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tipin .32s cubic-bezier(.2,.9,.3,1.25)}
@keyframes tipin{from{opacity:0;transform:translateY(14px) scale(.98)}}
.tip .t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.tip .t svg.i{color:var(--accent)}
.tip .t .iconbtn{width:24px;height:24px}
.tip .why{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg2);flex-wrap:wrap}
.tip .meter{flex:1;min-width:90px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.tip .meter i{display:block;height:100%;background:var(--amber)}
.tip p{margin:0;font-size:12.5px;line-height:1.65;color:var(--fg2)}
.tip .sk{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--accent);background:var(--accent-dim);border-radius:6px;padding:1px 7px;font-size:12px}
.tip .acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tip .more{font-size:11px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.tip .diff{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12.5px}
.tip .diff .k{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.tip .diff .o{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--red) 60%,transparent)}
.tip .diff .n{color:var(--fg);background:color-mix(in srgb,var(--violet) 14%,transparent);border-radius:6px;padding:2px 6px}
.tip .opts{display:grid;gap:6px}
.tip .opts button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--fg2)}
.tip .opts button:hover,.tip .opts button.on{border-color:var(--accent);color:var(--fg);background:var(--accent-dim)}
.tipchip{display:flex;align-items:center;gap:8px;margin-bottom:10px;border:1px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:12px;padding:8px 10px;font-size:12px;color:var(--fg2);cursor:pointer}
.tipchip:hover{background:var(--accent-dim)}
.ask{margin:0 14px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:8px;display:grid;gap:6px}
.ask:focus-within{border-color:var(--accent)}
.ask textarea{border:0;background:transparent;resize:none;outline:none;min-height:54px;font:13px/1.6 var(--f-body);color:var(--fg)}
.ask .row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.floatpill{position:fixed;right:18px;top:68px;z-index:30;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--accent);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:12px;box-shadow:var(--shadow);animation:tipin .3s}
.floatpill svg.i{color:var(--accent);width:14px;height:14px}

/* 演示面板（只在 Demo 里有） */
.demo{position:fixed;left:14px;bottom:14px;z-index:40;width:300px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);font-size:12px;display:grid}
.demo.min .bd{display:none}
.demo .hd{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:700}
.demo .hd .lv{width:8px;height:8px;border-radius:50%;background:var(--green)}
.demo .bd{padding:8px 10px;display:grid;gap:6px}
.demo .row{display:flex;align-items:center;gap:6px;color:var(--fg2)}
.demo .row .k{width:64px;flex:none;color:var(--muted)}
.demo .bar{flex:1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}.demo .bar i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.demo .bar.cd i{background:var(--amber)}
.demo .log{max-height:110px;overflow:auto;display:grid;gap:2px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.demo .log div b{color:var(--fg2);font-weight:500}
.demo label{display:flex;align-items:center;gap:6px;color:var(--fg2);cursor:pointer}
.demo .btns{display:flex;gap:6px;flex-wrap:wrap}
.readline{position:fixed;left:200px;right:340px;height:0;border-top:1px dashed color-mix(in srgb,var(--coral) 70%,transparent);pointer-events:none;z-index:5}
.readline span{position:absolute;right:6px;top:-9px;font-size:10px;color:var(--coral);background:var(--bg);padding:0 4px}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:13px;z-index:90}
@media (max-width:1100px){.ws{grid-template-columns:160px minmax(0,1fr) 300px}.readline{left:160px;right:300px}.steps{display:none}}
@media (max-width:760px){body{overflow:auto}.ws,.ws.noasst{grid-template-columns:1fr}.tree{display:none}.asst{position:fixed;inset:56px 0 0 0;z-index:35;background:var(--bg)}.demo{width:calc(100% - 28px)}.readline{left:0;right:0}.doc{padding:16px 16px 50vh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <div class="ws" id="ws">
    <nav class="tree" id="tree" aria-label="目录"></nav>
    <main class="main" id="main"><div class="doc" id="doc"></div></main>
    <aside class="asst" id="asst" aria-label="AI 助手">
      <header><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg><b>AI 助手</b><span class="sm muted">· 自动选择</span><span class="sp"></span><button class="iconbtn" data-act="asst" aria-label="收起 AI 助手"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="msgs" id="msgs"></div>
      <div id="tipslot"></div>
      <div class="ask"><textarea id="ask" placeholder="告诉 AI 怎么改，输入 @ 调用技能。例如：第 5 集加一场打脸戏" aria-label="对 AI 说"></textarea><div class="row"><span>作用于：<b id="scope" style="font-weight:500;color:var(--fg2)"></b></span><span class="sp"></span><button class="btn pri sm" data-act="send">发送</button></div></div>
    </aside>
  </div>
</div>
<div id="float"></div>
<div class="readline" id="readline" hidden><span>阅读线</span></div>
<div class="demo" id="demo"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
// ================= 图标 =================
const IC={spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',chat:'<path d="M4 5h16v11H9l-5 4z"/>',check:'<path d="M5 12l5 5 9-10"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',back:'<path d="M15 6l-6 6 6 6"/>',lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0012 3z"/>'};
const ic=(k,c='i')=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const LOGO='<svg viewBox="0 0 24 24"><path d="M2 15.5c2.2 0 2.8-2.5 5-2.5s2.8 2.5 5 2.5 2.8-2.5 5-2.5 2.8 2.5 5 2.5V19c-2.2 0-2.8-2.5-5-2.5s-2.8 2.5-5 2.5-2.8-2.5-5-2.5S4.2 19 2 19z"/></svg>';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2200)}
const now=()=>Date.now();
const hm=()=>new Date().toTimeString().slice(0,8);

// ================= 示例项目（精细生成进行中） =================
const C={P:'林晚',L:'顾承砚',A:'苏婉柔',X:'林父'};
const fill=s=>s.replace(/\{(\w)\}/g,(_,k)=>C[k]);
const SEGS=[{k:'c1',label:'一卡',from:1,to:9},{k:'c2',label:'二卡',from:10,to:26},{k:'c3',label:'三卡',from:27,to:45},{k:'end',label:'结局段',from:46,to:60}];
const CARDS={9:'一卡',26:'二卡',45:'三卡'};
// 每集：标题、梗概、钩子。第 1 集开场慢、第 5–6 集没有爽点、卡点集钩子偏弱 —— 用来演示「检测到…」
const EP0={
 1:['订婚宴','林家筹备订婚宴，宾客陆续到场，{P}在后台换礼服，{A}端着酒杯走了进来，两人寒暄几句，{A}忽然当众指认{P}偷了传家玉佩。','{L}看着{P}，没有替她说话。'],
 2:['被逐出门','{X}当众宣布与{P}断绝关系，{P}被赶出林家，雨夜里只剩一只行李箱。','一辆黑色轿车停在了{P}面前。'],
 3:['神秘来电','{P}接到一个陌生号码：「大小姐，三年之约到了。」','电话那头报出了一个让她发抖的名字。'],

// ================= 检测：这一集有没有值得推荐的点 =================
const HOOK_STRONG=/(枪|血|死|倒|只有|最后|竟|DNA|亲生|名字|十分钟|消失)/;
const SLAP=/(打脸|拆穿|反击|反将|曝光|哗然|收购|揭开|摊牌|识破|倒戈)/;
function hookScore(h){return Math.min(95,38+(HOOK_STRONG.test(h)?34:0)+Math.min(16,h.length))}
// 返回 {sk, why, meter, body, preview} 或 null
function detect(kind,e,list){
  if(kind==='outline'){
    if(e.card){const s=hookScore(e.hook);if(s<75)return{sk:'sk3',why:`第 ${e.no} 集是${e.card}付费卡点`,meter:['钩子强度',s],body:`结尾「${e.hook}」悬念偏弱，观众不一定愿意付费看下一集。`}}
    if(e.no===1&&!/^[^，。]{0,12}(当众|陷害|指认|泼|打)/.test(e.summary))return{sk:'sk1',why:'第 1 集开场冲突来得慢',meter:['开场冲突',40],body:'前 3 秒还在交代背景（筹备、到场、换礼服），冲突在第 4 句才出现。'};
    const i=list.indexOf(e);const prev=list[i-1],next=list[i+1];
    const dry=x=>x&&!SLAP.test(x.summary)&&!x.card;
    if(dry(e)&&(dry(prev)||dry(next))){const pair=dry(prev)?[prev.no,e.no]:[e.no,next.no];return{sk:'sk2',why:`第 ${pair[0]}–${pair[1]} 集连续两集没有爽点`,meter:['爽点',0],body:'连续两集只有铺垫，短剧观众容易在这里划走。'}}
    return null}
  if(kind==='script'){const long=e.scenes.flatMap(s=>s.lines.filter(l=>l.t==='dlg'&&l.x.length>24));
    if(long.length)return{sk:'sk8',why:`第 ${e.no} 集有 ${long.length} 句台词偏长`,meter:['最长一句',Math.max(...long.map(l=>l.x.length))],unit:'字',body:`比如「${long[0].x.slice(0,22)}…」，演员不好念，也不好剪成切片。`};
    return null}
  return null}

function canShow(){
  if(T.off||T.muted)return'已关闭推荐';
  if(T.tip)return'已有一张推荐';
  if(S.gen)return'生成中，静默';
  if(isEditing())return'正在编辑，静默';
  const t=now();
  if(t-T.enterAt<CFG.entryQuiet*1000)return'刚进入页面，静默';
  if(t-T.lastType<CFG.typeQuiet*1000)return'刚在打字，静默';
  if(T.shown>=CFG.max)return`本次已推荐 ${T.shown} 次（上限）`;
  const cd=cooldownLeft();if(cd>0)return`冷却中，还剩 ${cd}s`;
  return''}
function cooldownLeft(){const base=CFG.cooldown*(T.dismissStreak>=2?2:1);return Math.max(0,Math.ceil((T.lastShown+base*1000-now())/1000))}
function isEditing(){const a=document.activeElement;return !!(a&&a.isContentEditable)}
function showTip(t,trigger){
  const why=canShow();if(why){log(`${trigger} → 不推荐（${why}）`);return false}
  if(T.mutedSkill.has(t.sk)){log(`${trigger} → 不推荐（「${SKILLS[t.sk][0]}」本次已拒绝）`);return false}
  T.tip={...t,trigger,stage:'ask',page:S.sel,at:now()};T.lastShown=now();T.shown++;
  log(`${trigger} → 推荐「${SKILLS[t.sk][0]}」`);
  drawTip();drawDoc();drawTop();drawTree();return true}
function closeTip(reason){if(!T.tip)return;const t=T.tip;T.tip=null;
  if(reason==='no'){T.dismissStreak++;T.mutedSkill.add(t.sk);if(T.dismissStreak>=3){T.muted=true;log('连续拒绝 3 次 → 本次不再推荐')}else if(T.dismissStreak>=2)log('连续拒绝 2 次 → 冷却时间加倍')}
  if(reason==='use')T.dismissStreak=0;
  log(`推荐关闭（${{no:'不用了',use:'已采用',away:'离开页面',off:'不再提示',undo:'放弃修改'}[reason]||reason}）`);
  drawTip();drawDoc();drawTop();drawTree()}
function collapseTip(){if(T.tip&&T.tip.stage==='ask'){T.tip.stage='chip';log('用户没理会 → 收起成小条');drawTip();drawDoc()}}
function tipTarget(){const t=T.tip;if(!t||t.page!==S.sel)return null;return t.ep}

  const el=$('#tipslot');const t=T.tip;
  $('#float').innerHTML=t&&!S.asstOpen&&t.page===S.sel?`<button class="floatpill" data-act="tipOpen">${ic('bulb')}AI 有一条写作建议</button>`:'';bindActs($('#float'));

  const head=`<div class="t">${ic('spark')}检测到 · ${esc(t.trigger==='停留'?`你在第 ${t.ep} 集停留了一会儿`:t.trigger==='反复阅读'?`你来回看了第 ${t.ep} 集`:t.trigger==='选中文字'?'你选中了一段文字':t.trigger==='打字'?`你在对话框里提到「${t.word}」`:`你在第 ${t.ep} 集`)}<span class="sp"></span><button class="iconbtn" data-act="tipNo" aria-label="不用了">${ic('x')}</button></div>`;
  const meter=t.meter?`<div class="why"><b style="color:var(--fg)">${esc(t.why)}</b></div><div class="why"><span>${esc(t.meter[0])}</span><span class="meter"><i style="width:${t.unit?Math.min(100,t.meter[1]*2):t.meter[1]}%;${t.meter[1]>=75&&!t.unit?'background:var(--green)':''}"></i></span><b class="mono">${t.meter[1]}${t.unit||(t.meter[0]==='爽点'?' 个':'/100')}</b></div>`:`<div class="why"><b style="color:var(--fg)">${esc(t.why)}</b></div>`;
  let body='',acts='';
  if(t.stage==='ask'){
    body=`<p>${esc(t.body)}</p><p>要不要用 <span class="sk">@${esc(sk[0])}</span> ${t.sk==='sk9'?'给你 3 个方向挑一个':'先改一版给你看看'}？不满意可以不采用。</p>`;
    acts=`<button class="btn pri sm" data-act="tipPreview">${ic('eye')}${t.sk==='sk9'?'给我 3 个方向':'先看看改成什么样'}</button><button class="btn ghost sm" data-act="tipNo">不用了</button><span class="sp"></span><button class="more" data-act="tipOff">不再提示</button>`}
  else if(t.stage==='loading'){body=`<div class="why"><span class="spin"></span>正在用「${esc(sk[0])}」改第 ${t.ep} 集…</div>`}
  else if(t.stage==='preview'){
    if(t.sk==='sk9')body=`<div class="opts">${t.opts.map((o,i)=>`<button class="${t.pick===i?'on':''}" data-pick="${i}">${'①②③'[i]} ${esc(o)}</button>`).join('')}</div>`;
    else body=`<div class="diff"><span class="k">${esc(t.field)} · 修改前</span><div class="o">${esc(t.before)}</div><span class="k">修改后</span><div class="n">${esc(t.after)}</div></div>`;
    acts=`<button class="btn pri sm" data-act="tipApply" ${t.sk==='sk9'&&t.pick==null?'disabled':''}>${ic('check')}采用到正文</button><button class="btn sm" data-act="tipAgain">换一版</button><button class="btn ghost sm" data-act="tipNo">放弃</button>`}
  el.innerHTML=`<div class="tip" role="status" aria-live="polite">${head}${meter}${body}<div class="acts">${acts}</div></div>`;
  el.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{t.pick=+b.dataset.pick;drawTip()});
  bindActs(el)}

    t.after=shorten(l.x)}

function findEp(no){const a=page();return a.eps.find(e=>e.no===no)}

// ================= 信号采集 =================
// 停留：阅读线（文档区 40% 高度）落在哪一集，就算在读哪一集；
// 页面可见、最近 30 秒有操作（鼠标 / 滚动 / 键盘）才累计，离开就暂停。
function readingEp(){const m=$('#main');const r=m.getBoundingClientRect();const y=r.top+r.height*.4;
  for(const el of document.querySelectorAll('#doc .ep')){const b=el.getBoundingClientRect();if(b.top<=y&&b.bottom>=y)return+el.dataset.no}return null}
function tick(){
  const t=now();const active=!document.hidden&&t-T.lastAct<CFG.idle*1000;const a=page();
  const no=a&&a.eps&&a.eps.length&&!S.gen?readingEp():null;
  if(no!==T.focus){
    if(T.focus!=null){T.passed[T.focus]=t}
    if(no!=null&&T.passed[no]&&t-T.passed[no]<CFG.rereadWin*1000){T.rereads[no]=(T.rereads[no]||0)+1;if(T.rereads[no]>=CFG.rereadN){log(`第 ${no} 集被来回看了 ${T.rereads[no]} 次`);T.rereads[no]=0;rereadTip(no)}}
    T.focus=no;T.dwell=0;markReading()}
  if(no!=null&&active&&!isEditing())T.dwell+=.25;
  if(no!=null&&T.dwell>=CFG.dwell){const key=S.sel+':'+no;
    if(!T.seenEp.has(key)){const ep=findEp(no);const d=a.status==='locked'?null:detect(a.kind,ep,a.eps);
      if(a.status==='locked'){T.seenEp.add(key);log(`停留 第 ${no} 集 ${CFG.dwell}s → 不推荐（已确认定稿）`)}
      else if(!d){T.seenEp.add(key);log(`停留 第 ${no} 集 ${CFG.dwell}s → 没检测到问题，不打扰`)}
      else{const why=canShow();
        // 被频率挡住时不记为「已推荐过」：冷却结束后用户还停在这一集，会再推荐
        if(why){if(T.blocked!==key+why.replace(/\d+/g,'')){T.blocked=key+why.replace(/\d+/g,'');log(`停留 第 ${no} 集 → 有建议但先不推荐（${why}）`)}}
        else{T.seenEp.add(key);showTip({...d,ep:no},'停留')}}}}
  // 推荐卡片：用户离开这一集太远或一直不理会 → 收成小条
  if(T.tip&&T.tip.stage==='ask'){const far=no!=null&&Math.abs(no-T.tip.ep)>=3;if(far||t-T.tip.at>CFG.collapse*1000)collapseTip()}
  drawDemo()}
function rereadTip(no){const a=page();if(a.status==='locked')return;showTip({sk:'sk9',ep:no,why:`第 ${no} 集你来回看了几遍`,body:'是不是觉得这里不够出彩？可以换个角度。'},'反复阅读')}

['mousemove','keydown','wheel','touchstart'].forEach(ev=>addEventListener(ev,()=>{T.lastAct=now()},{passive:true}));
document.addEventListener('visibilitychange',()=>log(document.hidden?'页面切到后台 → 停留暂停':'回到页面'));

let selT=null;
document.addEventListener('selectionchange',()=>{clearTimeout(selT);const sel=getSelection();const txt=String(sel||'').trim().replace(/^[：:，。\s]+/,'');if(txt.length<4)return;
  const node=sel.anchorNode&&sel.anchorNode.parentElement;const epEl=node&&node.closest('#doc .ep');if(!epEl)return;

  if(cmd==='tipPreview'||cmd==='tipAgain'){T.tip.stage='loading';drawTip();setTimeout(()=>{if(T.tip)preview()},700)}
  if(cmd==='tipApply')apply();
  if(cmd==='undo'){const u=S.undo;if(!u)return;go(u.page);const ep=findEp(u.no);Object.keys(ep).forEach(x=>delete ep[x]);Object.assign(ep,u.data);S.undo=null;say(`已撤销，第 ${u.no} 集恢复到修改前。`);drawDoc()}
  if(cmd==='cmp'){S.cmp=S.cmp===+arg?null:+arg;drawDoc();flash(+arg)}
  if(cmd==='view')go(arg);
  if(cmd==='gen')genSeg(arg);
  if(cmd==='lock'){page().status='locked';if(T.tip&&T.tip.page===S.sel)closeTip('away');say(`「${page().label}」已确认定稿。定稿后停留时不会再推荐修改。`);drawAll()}
  if(cmd==='unlock'){page().status='ready';drawAll()}
  if(cmd==='send'){const ta=$('#ask');const v=ta.value.trim();if(!v)return;S.P.chat.push({r:'me',t:v});ta.value='';drawMsgs();setTimeout(()=>say('好的，已按你的要求调整了当前页（演示）。'),500)}}
// 精细生成：逐段生成，写完停下来等用户
function genSeg(k){const g=SEGS.find(x=>x.k===k);const a=S.P.segs[k];if(S.gen)return;go(k);S.gen=k;a.eps=[];a.status='generating';
  if(T.tip&&T.tip.stage==='ask')collapseTip();log(`开始生成${g.label}集纲 → 推荐静默`);drawAll();
  let n=0;const total=g.to-g.from+1;const iv=setInterval(()=>{const no=g.from+n;const c=C3[n%C3.length];a.eps.push({no,title:c[0],summary:fill(c[1]),hook:fill(c[2]),card:CARDS[no]||''});n++;drawDoc();
    if(n>=total){clearInterval(iv);S.gen=null;a.status='ready';if(k==='c3')S.P.segs.end.status='empty';T.enterAt=now();
      say(`${g.label}集纲写好了（第 ${g.from}–${g.to} 集）。卡点落在第 ${g.to} 集「${a.eps[a.eps.length-1].title}」。`,[['gen:end','继续写结局段'],['view:'+k,'我先看看']]);log(`${g.label}集纲生成完成 → 开始检测停留`);drawAll()}},180)}

// ================= 启动 =================
$('#ask').oninput=onType;bindActs($('#asst header'));
$('#main').addEventListener('scroll',()=>{T.lastAct=now()},{passive:true});
addEventListener('resize',placeLine);
drawAll();log('打开「二卡集纲」');
setInterval(tick,250);
if(location.hash==='#c2')go('c2');
})();
</script>
