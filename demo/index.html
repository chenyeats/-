<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>澜幕 V2 · AI 短剧剧本工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：左侧全局导航栏 + 内容区；项目页 = 目录 / 文档 / AI 助手 三栏。主题：深海（默认）、晴空、护眼，用 data-skin 切换。海浪与气泡只出现在首页和生成进度里 */
:root{
  color-scheme:dark;
  --bg:#061320; --bg2:#0A1B2A; --surface:#0D2132; --surface2:#12293C; --hover:#183449; --line:#1B3346; --line2:#27465E;
  --fg:#E5F0F5; --fg2:#A6BFCC; --muted:#6C8899;
  --accent:#3FD6C9; --accent-dim:rgba(63,214,201,.14); --on-accent:#032220; --accent2:#4BA3FF;
  --coral:#FF8E6E; --coral-dim:rgba(255,142,110,.15); --red:#FF6B6B; --red-dim:rgba(255,107,107,.14);
  --violet:#9D8CFF; --green:#6EDB9A; --amber:#F5C36B;
  --wave1:rgba(63,214,201,.10); --wave2:rgba(75,163,255,.10); --wave3:rgba(63,214,201,.06);
  --glow:radial-gradient(1100px 520px at 50% -8%,rgba(63,214,201,.16),transparent 65%);
  --shadow:0 18px 50px rgba(0,0,0,.4);
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-serif:"Noto Serif SC","Songti SC","STSong",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-skin="light"]{
  color-scheme:light;
  --bg:#F2F7FA; --bg2:#E8F1F5; --surface:#FFFFFF; --surface2:#EEF5F8; --hover:#E1EEF3; --line:#D6E5EC; --line2:#BED3DD;
  --fg:#0C2231; --fg2:#38566A; --muted:#6B8698;
  --accent:#0A8A8A; --accent-dim:rgba(10,138,138,.10); --on-accent:#FFFFFF; --accent2:#2B7BD8;
  --coral:#E0623F; --coral-dim:rgba(224,98,63,.10); --red:#D64545; --red-dim:rgba(214,69,69,.10);
  --violet:#6B5BD6; --green:#2F9E5F; --amber:#B9851C;
  --wave1:rgba(10,138,138,.10); --wave2:rgba(43,123,216,.08); --wave3:rgba(10,138,138,.05);
  --glow:radial-gradient(1100px 520px at 50% -8%,rgba(10,138,138,.10),transparent 65%);
  --shadow:0 14px 40px rgba(20,60,80,.12);
}
:root[data-skin="eye"]{
  color-scheme:light;
  --bg:#EDEFDF; --bg2:#E4E7D3; --surface:#F6F7EC; --surface2:#E9ECDA; --hover:#DFE3CB; --line:#D2D7BC; --line2:#BCC4A2;
  --fg:#2E3426; --fg2:#4B553F; --muted:#7A8467;
  --accent:#3B7C66; --accent-dim:rgba(59,124,102,.12); --on-accent:#F6F7EC; --accent2:#4C7A99;
  --coral:#B8633C; --coral-dim:rgba(184,99,60,.12); --red:#B54A3F; --red-dim:rgba(181,74,63,.10);
  --violet:#6E6299; --green:#4E8A4B; --amber:#9A7A2C;
  --wave1:rgba(59,124,102,.10); --wave2:rgba(76,122,153,.08); --wave3:rgba(59,124,102,.05);
  --glow:radial-gradient(1100px 520px at 50% -8%,rgba(59,124,102,.10),transparent 65%);
  --shadow:0 12px 34px rgba(60,70,40,.12);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--glow),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;transition:background-color .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.sm{font-size:12px}.sp{flex:1}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* 外框：全局导航 */
.shell{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 70%,transparent);backdrop-filter:blur(10px);z-index:30}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(150deg,var(--accent),var(--accent2));color:var(--on-accent);margin-bottom:10px;box-shadow:0 6px 18px var(--accent-dim)}
.logo svg{width:24px;height:24px;fill:currentColor}
.rail a{width:60px;padding:8px 0;border-radius:12px;display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;text-decoration:none}
.rail a svg.i{width:20px;height:20px}
.rail a:hover{color:var(--fg);background:var(--hover)}
.rail a.on{color:var(--accent);background:var(--accent-dim)}
.rail .bottom{margin-top:auto;display:grid;gap:4px;justify-items:center}
.rail .cr{font-family:var(--f-mono);font-size:11px;color:var(--fg2);display:grid;justify-items:center;gap:2px;padding:6px 0}
.view{min-width:0;position:relative}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.topbar.solid{border-bottom-color:var(--line)}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--fg2);flex:none}
.iconbtn:hover{background:var(--hover);color:var(--fg)}
.ptitle{font-weight:700;font-size:15px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:6px;padding:2px 6px;outline:none}
.ptitle:focus{background:var(--surface2)}
.saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
.steps{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 8px;overflow-x:auto;scrollbar-width:none;min-width:0}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;font-size:13px}
.step .n{width:18px;height:18px;border-radius:50%;background:var(--line2);color:var(--fg2);display:grid;place-items:center;font-size:10px;font-family:var(--f-mono)}
.step .n svg.i{width:11px;height:11px}
.step.cur{color:var(--accent)}.step.cur .n{background:var(--accent);color:var(--on-accent)}
.step.done{color:var(--fg2)}.step.done .n{background:var(--accent-dim);color:var(--accent)}
.step[data-step]:hover{background:var(--hover)}
.steps .dash{width:16px;height:1px;background:var(--line2);flex:none}

/* 海洋氛围 */
.sea{position:fixed;left:76px;right:0;bottom:0;height:170px;pointer-events:none;z-index:0;overflow:hidden}
.wave{position:absolute;bottom:0;left:0;width:200%;height:100%;animation:drift 22s linear infinite}
.wave path{fill:var(--wave1)}
.wave.w2{height:80%;animation-duration:15s;animation-direction:reverse}.wave.w2 path{fill:var(--wave2)}
.wave.w3{height:60%;animation-duration:30s}.wave.w3 path{fill:var(--wave3)}
@keyframes drift{to{transform:translateX(-50%)}}
.bubble{position:absolute;bottom:-20px;border-radius:50%;border:1px solid var(--accent);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.35}90%{opacity:.15}100%{transform:translateY(-75vh) translateX(20px);opacity:0}}
.home,.page{position:relative;z-index:1}

/* 首页 */
.home{max-width:1000px;margin:0 auto;padding-inline:20px;padding-block:6vh 200px;display:grid;gap:28px}
.intro{text-align:center;display:grid;gap:12px;justify-items:center}
.intro .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);font-family:var(--f-mono)}
.intro h1{font-family:var(--f-serif);font-size:clamp(30px,4.6vw,44px);font-weight:700;letter-spacing:.04em}
.intro h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro p{margin:0;color:var(--fg2);font-size:clamp(14px,1.8vw,16px);line-height:1.8}
.composer{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px;box-shadow:var(--shadow);backdrop-filter:blur(6px);transition:border-color .2s}
.composer:focus-within{border-color:var(--line2)}
.ctop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modes{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.modes button{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;color:var(--fg2);font-weight:500;transition:background .15s,color .15s}
.modes button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.modes button:not(.on):hover{color:var(--fg)}
.badge{font-size:10px;padding:0 5px;border-radius:4px;background:var(--coral-dim);color:var(--coral);font-weight:600}
.switch{display:flex;align-items:center;gap:8px;color:var(--fg2);font-size:13px;cursor:pointer;user-select:none}
.switch .tr{width:32px;height:18px;border-radius:9px;background:var(--line2);position:relative;transition:background .15s}
.switch .tr::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .2s}
.switch.on .tr{background:var(--accent)}
.switch.on .tr::after{transform:translateX(14px)}
.cinput{display:grid;grid-template-columns:184px minmax(0,1fr);gap:16px;align-items:start}
.cinput .full{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.upbox{height:150px;border:1.5px dashed var(--line2);border-radius:16px;background:var(--surface2);display:grid;justify-items:center;align-content:center;gap:8px;color:var(--fg);transition:border-color .15s,background .15s;position:relative}
.upbox:hover,.upbox:focus-visible{border-color:var(--accent);background:var(--accent-dim)}
.upbox .pc{width:40px;height:40px;border-radius:50%;background:var(--hover);display:grid;place-items:center;color:var(--fg2)}
.upbox .pc svg.i{width:20px;height:20px}
.upbox:hover .pc{background:var(--accent);color:var(--on-accent)}
.upbox b{font-size:14px;font-weight:500}
.upbox .fmt{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;position:relative}
.upbox .fmt i{font-style:normal;width:14px;height:14px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:9px}
.upbox .tip{display:none;position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:240px;background:var(--fg);color:var(--bg);font-size:12px;line-height:1.6;padding:8px 12px;border-radius:10px;z-index:5;text-align:left}
.upbox .fmt:hover .tip{display:block}
@media (max-width:760px){.cinput{grid-template-columns:1fr}.upbox{height:auto;grid-auto-flow:column;padding:12px;justify-content:start}}
.cinput textarea{width:100%;min-height:140px;resize:none;border:0;background:transparent;padding:8px 2px;font-size:15px;line-height:1.7;outline:none;color:var(--fg)}
.cinput textarea::placeholder{color:var(--muted)}
.cinput textarea.tall{min-height:180px}
.filecard{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
.filecard button{color:var(--muted);display:grid}
.cbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--fg2);font-size:13px;white-space:nowrap;max-width:230px;cursor:pointer;transition:border-color .15s,color .15s}
.chip span.v{overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--line2);color:var(--fg)}
.chip.set{color:var(--fg);border-color:var(--line2)}
.chip.set .star{color:var(--accent)}
.chip .cnt{background:var(--accent-dim);color:var(--accent);border-radius:999px;font-size:11px;font-weight:700;padding:1px 6px;font-family:var(--f-mono);flex:none}
.chip.open{border-color:var(--accent)}
.chip.model{color:var(--fg)}
.chip.model .mdot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.chip .caret{opacity:.6}
.parsebtn{flex:none}
.edhint{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg2);background:color-mix(in srgb,var(--accent) 7%,transparent);border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;padding:8px 12px;margin-bottom:12px;line-height:1.6;flex-wrap:wrap}
.edhint svg.i{width:14px;height:14px;flex:none;color:var(--accent)}
.edhint.ok{background:transparent;border-style:solid;border-color:var(--line);color:var(--muted)}
.edhint.ok svg.i{color:var(--green)}
.send{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);display:grid;place-items:center;flex:none;transition:transform .15s,opacity .15s}
.send:hover:not(:disabled){transform:translateY(-1px) scale(1.04)}
.send:disabled{background:var(--line2);color:var(--muted);cursor:not-allowed}
.credits{display:flex;align-items:center;gap:6px;color:var(--fg2);font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.credits i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent),var(--accent2));display:inline-block}
.hint{font-size:12px;color:var(--muted);text-align:right;min-height:18px;margin-top:-6px}
.inspire{display:grid;gap:12px}
.inspire h3{font-size:14px;color:var(--fg2);font-weight:500;text-align:center}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.ideas button{text-align:left;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line);color:var(--fg2);display:flex;gap:10px;transition:transform .15s,border-color .15s}
.ideas button:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--fg)}
.ideas .k{font-family:var(--f-mono);color:var(--muted)}

/* 下拉面板 */
.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:10px;min-width:220px;max-width:min(420px,calc(100vw - 24px));max-height:min(460px,calc(100vh - 24px));overflow:auto;animation:popin .14s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}}
.pop h5{margin:2px 6px 8px;font-size:12px;color:var(--muted);font-weight:500;display:flex;gap:8px}
.opts{display:grid;gap:2px}
.opts button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-align:left;color:var(--fg2)}
.opts button:hover{background:var(--hover);color:var(--fg)}
.opts button.on{color:var(--fg)}
.opts button:disabled{opacity:.45;cursor:not-allowed}
.tags button:disabled{opacity:.42;cursor:not-allowed;text-decoration:line-through}
.tags button:disabled:hover{border-color:var(--line);color:var(--fg2)}
.opts .ck{width:16px;color:var(--accent);flex:none}
.opts small{margin-left:auto;padding-left:12px;color:var(--muted);font-size:11px;text-align:right}
.opts .two{display:grid;gap:0}.opts .two small{margin:0;padding:0;text-align:left}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:2px}
.tags button{padding:5px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);color:var(--fg2);font-size:13px}
.tags button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.pfield{display:grid;gap:4px;padding:4px 6px}
.pfield label{font-size:12px;color:var(--muted)}
.pfield input,.pfield select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
.pfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:8px 6px 2px;border-top:1px solid var(--line);margin-top:8px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--fg);font-size:13px;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--line2);background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent2)));border-color:transparent;color:var(--on-accent);font-weight:700}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.okb{background:var(--surface2);border-color:var(--green);color:var(--green)}.btn.okb:hover{border-color:var(--green);color:var(--green);filter:brightness(1.1)}
.btn.sq{width:34px;padding:0;justify-content:center}
.btn.sm{height:28px;padding:0 10px;font-size:12px}

/* 项目工作台 */
.ws{display:grid;grid-template-columns:210px minmax(0,1fr) 330px;min-height:calc(100vh - 59px)}
.ws.noasst{grid-template-columns:210px minmax(0,1fr)}
.tree{padding:10px 10px 40px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.tree h4{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.08em;margin:14px 10px 4px}
.tree a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--fg2);font-size:13px}
.tree a:hover{background:var(--hover);color:var(--fg)}
.tree a.on{background:var(--surface2);color:var(--fg);font-weight:500}
.tree a.dim{opacity:.45}
.tree a .r{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.tree a .kind{font-size:10px;padding:0 5px;border-radius:4px;background:var(--surface2);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.main{padding:18px 32px 120px;min-width:0;position:relative}
.doc{max-width:860px;margin:0 auto;display:grid;gap:20px}
.doc.full{max-width:none}
.dh{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dh h2{font-size:24px;font-weight:900;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh .meta{color:var(--muted);font-size:12px;margin-top:4px}
.dh .acts{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.stbadge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--fg2);font-family:var(--f-body);display:inline-flex;align-items:center;gap:4px}
.stbadge.ready{color:var(--green)}.stbadge.edited{color:var(--accent)}.stbadge.outdated{color:var(--amber)}.stbadge.locked{color:var(--fg)}.stbadge.error{color:var(--red)}
.note{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;font-size:13px;flex-wrap:wrap}
.note.amber{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber)}
.note.red{background:var(--red-dim);color:var(--red)}
.note.info{background:var(--accent-dim);color:var(--accent)}
.note .btn{height:28px;padding:0 10px}
.sec{display:grid;gap:8px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font-size:16px;display:flex;align-items:center;gap:8px}
.sec h3 .regen{opacity:0;transition:opacity .15s}
.sec:hover h3 .regen,.sec h3 .regen:focus-visible{opacity:1}
.sec p{margin:0;color:var(--fg2);white-space:pre-wrap}
[contenteditable]{outline:none;border-radius:6px;padding:2px 4px;margin:-2px -4px;transition:background .15s}
[contenteditable]:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
[contenteditable][data-dirty]{background:color-mix(in srgb,var(--amber) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--amber) 45%,transparent)}
[contenteditable]:focus{background:var(--surface);box-shadow:0 0 0 1px var(--line2)}
[contenteditable][data-dirty]:focus{background:var(--surface);box-shadow:0 0 0 1px var(--amber)}
.titles{display:flex;gap:8px;flex-wrap:wrap}
.titles button,.titles span{padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg2)}
.titles button.on{border-color:var(--accent);color:var(--fg);background:var(--accent-dim)}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.char{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.char b{font-size:16px}.char .role{font-size:11px;color:var(--accent)}.char div{font-size:13px;color:var(--fg2)}

/* 生成中 */
.gen{display:grid;gap:14px;padding:26px;border-radius:16px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.gen .row{display:flex;align-items:center;gap:10px;position:relative}
.gen .line{font-size:13px;color:var(--muted);font-family:var(--f-mono);min-height:20px;position:relative}
.tank{height:56px;border-radius:12px;background:var(--surface2);position:relative;overflow:hidden}
.tank .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent-dim),color-mix(in srgb,var(--accent) 35%,transparent));transition:width .25s}
.tank .fill::after{content:"";position:absolute;right:-14px;top:0;bottom:0;width:28px;background:radial-gradient(14px 18px at 0 50%,color-mix(in srgb,var(--accent) 35%,transparent) 98%,transparent 100%) 0 0/28px 18px repeat-y;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.tank .pct{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:13px;color:var(--fg2)}
.skel{display:grid;gap:8px}
.skel i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--surface2),var(--hover),var(--surface2));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{padding:56px 20px;text-align:center;border:1px dashed var(--line2);border-radius:16px;color:var(--muted);display:grid;gap:14px;justify-items:center}

/* 内嵌配置面板 */
.inline{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface));border-radius:16px;padding:16px 18px;display:grid;gap:14px;animation:slide .2s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
.inline h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.inline .row{display:flex;gap:16px;flex-wrap:wrap}
.inline .foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.lbl{font-size:12px;color:var(--muted);margin-bottom:6px;display:block}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;color:var(--fg2);font-size:13px;transition:background .15s}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.stepper button{width:28px;height:30px;color:var(--fg2)}
.stepper button:hover{background:var(--hover)}
.stepper button:disabled{opacity:.4}
.stepper input{width:44px;height:30px;text-align:center;border:0;background:transparent;outline:none;font-family:var(--f-mono);-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}

/* 集纲 */
.eps{display:grid}
.ep{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 14px;padding:14px 8px;border-bottom:1px solid var(--line);border-radius:10px}
.ep .no{font-family:var(--f-mono);color:var(--muted);font-size:12px;padding-top:2px;grid-row:span 3}
.ep .no b{display:block;font-size:20px;color:var(--fg);font-weight:600}
.ep .t{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ep .s{color:var(--fg2);font-size:13px}.ep .h{color:var(--muted);font-size:12px}
.ep.card{background:linear-gradient(90deg,var(--coral-dim),transparent 65%);border-bottom-color:transparent;margin:2px 0}
.ep.card .no b{color:var(--coral)}
.ep.ph{opacity:.55}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 28%,transparent)}100%{background:transparent}}
.cardtag{font-size:11px;font-weight:700;color:var(--coral);border:1px solid var(--coral);padding:0 6px;border-radius:5px}

/* 剧本 */
.scr{display:grid;gap:26px}
.scep{display:grid;gap:12px}
.scep>header{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;flex-wrap:wrap}
.scep>header b{font-family:var(--f-serif);font-size:19px}
.scep>header .no{font-family:var(--f-mono);color:var(--accent);font-size:13px}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:grid;gap:6px;font-size:14px}
.scene .head{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--fg);letter-spacing:.02em}
.scene .cast{font-size:12px;color:var(--muted)}
.ln{color:var(--fg2)}
.ln.act::before{content:"△ ";color:var(--muted)}
.ln.dlg b{color:var(--fg)}
.ln.dlg .par{color:var(--muted)}
.ln.shot{color:var(--accent2);font-size:13px}
.ln.hook{color:var(--coral);font-weight:600}
.cont{display:flex;gap:10px;align-items:center;justify-content:center;padding:18px;border:1px dashed var(--line2);border-radius:14px;flex-wrap:wrap}

/* 互动影游剧本 */
.iabar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;font-size:13px;border:1px solid var(--line)}
.check.ok{color:var(--green)}.check.warn{color:var(--amber)}.check.bad{color:var(--red);border-color:var(--red)}
.iawrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
.canvas{position:relative;height:640px;border:1px solid var(--line);border-radius:16px;background:var(--bg2);overflow:hidden;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
.canvas #cv{width:100%;height:100%;cursor:grab;display:block}
.canvas #cv.drag{cursor:grabbing}
.cvtools{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg2);background:var(--surface);padding:5px 10px;border-radius:8px;border:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.insp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;align-content:start}
.insp h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.f{display:grid;gap:4px}
.f label{font-size:11px;color:var(--muted)}
.f input,.f textarea,.f select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:none;min-width:0}
.f textarea{min-height:100px;resize:vertical}
.optrow{display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px}
.optrow .r1{display:flex;gap:4px}.optrow .r1 input{flex:1;min-width:0}
.optrow .r2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.optrow input[type=number]{width:52px;padding:2px 4px}
.optrow select{max-width:100%;font-size:12px;padding:3px 4px}
.issues{display:grid;gap:6px}
.issue{font-size:12px;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.issue.e{background:var(--red-dim);color:var(--red)}.issue.w{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber)}
.play{max-width:380px;margin:0 auto;width:100%}
.phone{aspect-ratio:9/16;max-height:620px;max-width:100%;border-radius:26px;border:1px solid var(--line2);background:linear-gradient(170deg,#1d3a45 0%,#071318 72%);color:#E8F2F5;padding:20px;display:flex;flex-direction:column;gap:12px;overflow:hidden;box-shadow:var(--shadow)}
.phone .vars{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px}
.phone .vars span{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:5px}
.phone .story{margin-top:auto;display:grid;gap:8px;font-size:15px;line-height:1.75}
.phone .ep{font-family:var(--f-mono);font-size:11px;opacity:.6}
.phone .chs{display:grid;gap:8px}
.phone .chs button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);color:#E8F2F5;padding:11px 14px;border-radius:12px;text-align:left}
.phone .chs button:hover{background:rgba(255,255,255,.15)}
.phone .end{font-size:22px;font-weight:900;text-align:center;color:#5FE3D6}
.timer{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;background:#FF8E6E;animation:tm 8s linear forwards}
@keyframes tm{from{width:100%}to{width:0}}
.sv{display:grid;gap:10px;max-width:760px}
.sv .sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:4px}
.sv .sc.b{margin-left:28px}
.sv .k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sv .x{white-space:pre-wrap;font-size:13px;color:var(--fg2)}
.sv .ch{border-left:2px solid var(--accent);padding-left:10px;display:grid;gap:3px;font-size:13px;margin-top:4px}

/* AI 助手 */
.asst{border-left:1px solid var(--line);display:flex;flex-direction:column;height:calc(100vh - var(--tbh,59px));position:sticky;top:var(--tbh,59px);background:color-mix(in srgb,var(--bg2) 60%,transparent)}
.asst header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.asst header b{font-size:14px}
.asstbtn{width:36px;height:36px;border:1px solid var(--line);border-radius:10px}
.asstbtn svg.i{width:18px;height:18px}
.asstbtn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--accent-dim)}
.msgs{flex:1;overflow:auto;padding:14px;display:grid;gap:12px;align-content:start}
.msg{display:grid;gap:6px;max-width:100%;animation:slide .2s ease-out}
.msg .bub{padding:10px 12px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap}
.msg.ai .bub{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.msg.me{justify-items:end}
.msg.me .bub{background:var(--accent-dim);color:var(--fg);border-top-right-radius:4px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap}
.msg .who{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.quick button{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--fg2);background:var(--surface)}
.quick button:hover{border-color:var(--accent);color:var(--fg)}
.quick .advice{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.6;color:var(--fg2);background:color-mix(in srgb,var(--accent) 7%,var(--surface));border:1px solid var(--line);border-radius:12px;padding:8px 10px;width:100%}
.quick .advice svg.i{width:14px;height:14px;flex:none;margin-top:2px;color:var(--accent)}
.quick .advice b{display:block;color:var(--fg);font-size:12px;margin-bottom:2px}
.quick .advice button{margin-left:auto;flex:none;border:0;background:transparent;color:var(--accent);font-size:12px;cursor:pointer;padding:0}
.quick .qrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%}
.quick .qrow .ql{font-size:11px;color:var(--muted);flex:none}
.quick button.sk{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--fg)}
.quick button.sk:hover{border-color:var(--accent);background:var(--accent-dim)}
.quick button.sk.on{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:var(--accent);font-weight:600}
.edtip{margin:0 14px 10px;border:1px solid var(--accent);border-radius:14px;background:color-mix(in srgb,var(--accent) 6%,var(--surface));padding:12px;display:grid;gap:8px;animation:up .25s ease-out}
.edtip .t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.edtip .t svg.i{width:14px;height:14px;color:var(--accent)}
.edtip p{margin:0;font-size:12px;line-height:1.6;color:var(--fg2)}
.edtip .sks{display:grid;gap:6px}
.edtip .sks button{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--fg)}
.edtip .sks button:hover{border-color:var(--accent)}
.edtip .sks button.on{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:var(--accent)}
.edtip .sks b{font-size:12px}
.edtip .sks small{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1;padding:4px 4px 4px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--fg)}
.chip button{border:0;background:transparent;color:var(--fg2);cursor:pointer;padding:0 2px;font-size:13px;line-height:1;border-radius:50%}
.chip button:hover{color:var(--fg)}
.fldbar{display:inline-flex;align-items:center;gap:6px;margin:6px 0 2px 6px;vertical-align:middle;background:var(--surface);border:1px solid color-mix(in srgb,var(--amber) 50%,var(--line2));border-radius:10px;padding:3px 5px 3px 9px;box-shadow:0 4px 14px rgba(0,0,0,.12);animation:up .2s ease-out;user-select:none;white-space:nowrap}
.fldbar .fh{font-size:11px;color:var(--amber)}
.fldbar .btn.sm{height:24px;padding:0 8px;font-size:11px;gap:4px}
.fldbar .btn.sm svg.i{width:12px;height:12px}
.ask{margin:0 14px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:8px;display:grid;gap:6px}
.ask:focus-within{border-color:var(--accent)}
.ask textarea{border:0;background:transparent;resize:none;outline:none;min-height:56px;font-size:13px;color:var(--fg)}
.ask .row{display:flex;align-items:center;gap:6px}
.ask .scope{font-size:11px;color:var(--muted)}
.docbtn{border-color:color-mix(in srgb,var(--accent) 45%,var(--line2));color:var(--fg);font-weight:600}
.docbtn svg.i{width:14px;height:14px;color:var(--accent)}
.docbtn:hover{border-color:var(--accent);background:var(--accent-dim)}
.docscore{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.docring{width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;background:conic-gradient(var(--dc) calc(var(--p)*1%),color-mix(in srgb,var(--line2) 60%,transparent) 0)}
.docring::after{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.docring div{position:relative;z-index:1;text-align:center;line-height:1.1}
.docring b{font-size:26px;display:block;color:var(--dc)}
.docring small{font-size:11px;color:var(--muted)}
.docsum{flex:1;min-width:200px;display:grid;gap:4px}
.docsum b{font-size:14px}
.docsum p{margin:0;font-size:12px;line-height:1.7;color:var(--fg2)}
.docdims{display:grid;gap:8px}
.docdim{display:grid;gap:5px}
.docdim .h{display:flex;align-items:center;gap:8px;font-size:12px}
.docdim .h b{font-weight:600}
.docdim .h .sp{flex:1}
.docdim .h i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--fg2)}
.docdim .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.docdim .bar span{display:block;height:100%;border-radius:3px;background:var(--dc)}
.docdim p{margin:0;font-size:12px;line-height:1.6;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.docdim{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.docdim .dck{display:flex;align-items:center;gap:8px;cursor:pointer}
.docdim .dk{flex:none;font-size:10px;padding:1px 6px;border-radius:4px;background:var(--surface2);color:var(--fg2)}
.docdim .dk.ok{background:var(--accent-dim);color:var(--accent)}
.doccmp{font-size:12px;color:var(--fg2);display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.doccmp span{font-family:var(--f-mono);color:var(--muted)}
.mh h3 svg.i{width:18px;height:18px;color:var(--accent);vertical-align:-3px;margin-right:6px}

/* 下一步卡片（人机协同） */
.nudge{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:45;width:min(520px,calc(100% - 32px));background:var(--surface);border:1px solid var(--accent);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:10px;animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{opacity:0;transform:translate(-50%,24px)}}
.nudge .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.nudge .t .ok{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.nudge .t .ok svg.i{width:13px;height:13px}
.nudge p{margin:0;color:var(--fg2);font-size:13px}
.nudge .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nudge label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(2,10,16,.55);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:20px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;display:grid;box-shadow:var(--shadow);animation:popin .2s ease-out}
.modal.wide{width:min(860px,100%)}
.mh{padding:20px 22px 4px;display:flex;align-items:flex-start;gap:8px}
.mh h3{font-size:18px}.mh p{margin:4px 0 0;color:var(--muted);font-size:13px}
.mb{padding:16px 22px;display:grid;gap:18px}
.mf{padding:14px 22px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choose button{text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);display:grid;gap:4px;transition:border-color .15s}
.choose button b{font-size:15px;display:flex;gap:6px;align-items:center}
.choose button span{font-size:12px;color:var(--muted)}
.choose button.on{border-color:var(--accent);background:var(--accent-dim)}
.slider{padding:34px 12px 8px;user-select:none;touch-action:none}
.track{position:relative;height:8px;border-radius:4px;background:var(--line)}
.track .seg-c{position:absolute;top:0;bottom:0;border-radius:4px}
.handle{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--surface);border:3px solid var(--coral);cursor:grab;touch-action:none;box-shadow:0 0 0 4px var(--coral-dim)}
.handle:active{cursor:grabbing}
.handle .hl{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;color:var(--coral);font-family:var(--f-mono)}
.handle.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:10px;font-family:var(--f-mono)}
.cardrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}

function skillNames(ids){return(ids||[]).map(id=>[...BUILTIN_SKILLS,...S.userSkills].find(s=>s.id===id)?.name).filter(Boolean)}
function defaultCards(n){return{c1:Math.max(2,Math.round(n*0.15)),c2:Math.round(n*0.44),c3:Math.round(n*0.75)}}
function genEpisode(no,ctx){
  const{total,cards,c,base}=ctx;const T=tpl(c);const cp=[cards.c1,cards.c2,cards.c3];const isCard=cp.includes(no);let t,s,h;
  if(no<=3)[t,s]=T.open[no-1];
  else if(no===total)[t,s]=T.final;
  else if(isCard)[t,s,h]=T.card[cp.indexOf(no)];
  else if(base&&no>base)[t,s]=T.extra[(no-base-1)%T.extra.length];
  else if(no>total*0.85)[t,s]=T.climax[no%T.climax.length];
  else[t,s]=T.rise[(no*7)%T.rise.length];
  return{no,title:t,summary:fill(s,c),hook:fill(h||T.hooks[no%T.hooks.length],c),card:isCard?['一卡','二卡','三卡'][cp.indexOf(no)]:''};
}
function genScriptEp(e,c,cfg,v=0){const T=tpl(c);
  const n=cfg.dur==='long'?3:2;const scenes=[];const pk=(a,i)=>a[(e.no*3+i+v*5)%a.length];
  for(let i=0;i<n;i++){
    const loc=pk(c.male?SCENES_M:SCENES,i*5);const time=(e.no+i)%3===0?'夜':'日';const io=loc.includes('街')||loc.includes('门口')||loc.includes('天台')?'外':'内';
    const lines=[];
    if(i===0)lines.push({t:'act',x:e.summary});
    lines.push({t:'act',x:fill(pk(T.acts,i),c)});
    if(cfg.shots)lines.push({t:'shot',x:fill(pk(T.shots,i),c)});
    const a=pk(T.aLines,i),l=pk(T.lLines,i+1),x=pk(T.xLines,i);
    if(i===0){lines.push({t:'dlg',w:c.A,p:a[0],x:fill(a[1],c)});lines.push({t:'dlg',w:c.P,p:'平静',x:fill(pk(T.lines,i),c)})}
    else{lines.push({t:'dlg',w:c.L,p:l[0],x:fill(l[1],c)});if(e.no%2)lines.push({t:'dlg',w:c.X,p:x[0],x:fill(x[1],c)});lines.push({t:'dlg',w:c.P,p:'抬眼',x:fill(pk(T.lines,i+2),c)})}
    if(i===n-1)lines.push({t:'hook',x:(e.card?`【${e.card}】`:'【钩子】')+e.hook});
    scenes.push({head:`${e.no}-${i+1}  ${time}  ${io}  ${loc}`,cast:[...new Set(lines.filter(l=>l.w).map(l=>l.w))].join('、'),lines});
  }
  return{no:e.no,title:e.title,card:e.card,scenes};
}

function newArt(key,label,kind,status='empty'){return{key,label,kind,status,data:null,versions:0,task:null,prev:null,notice:''}}
function segRanges(P){const{c1,c2,c3}=P.cards;const N=P.params.episodes;const r=[{k:'c1',label:'一卡',from:1,to:c1},{k:'c2',label:'二卡',from:c1+1,to:c2},{k:'c3',label:'三卡',from:c2+1,to:c3}];if(c3<N)r.push({k:'end',label:'结局段',from:c3+1,to:N});return r}
function outlineKeys(P){return P.outlineMode==='all'?['all']:P.outlineMode==='cards'?segRanges(P).map(r=>r.k):[]}
function rangeOf(P,k){if(k==='all'||k==='full')return{k,label:'全部',from:1,to:P.params.episodes};const m=/^r(\d+)_(\d+)$/.exec(k||'');if(m)return{k,label:`第 ${m[1]}–${m[2]} 集`,from:+m[1],to:+m[2]};return P.cards?segRanges(P).find(r=>r.k===k)||null:null}
function rangeKey(P,from,to){if(from===1&&to===P.params.episodes)return'full';if(P.outlineMode==='cards'){const s=segRanges(P).find(r=>r.from===from&&r.to===to);if(s)return s.k}return`r${from}_${to}`}
function epsInRange(P,k){const r=rangeOf(P,k);if(!r)return[];const seen=new Set();return outlineKeys(P).flatMap(x=>P.arts[x]?.data?.eps||[]).filter(e=>e.no>=r.from&&e.no<=r.to&&!e.placeholder&&!seen.has(e.no)&&seen.add(e.no)).sort((a,b)=>a.no-b.no)}
function missingSegs(P,from,to){if(P.outlineMode==='all')return has(P.arts.all)?[]:['all'];if(P.outlineMode!=='cards')return[];return segRanges(P).filter(r=>r.from<=to&&r.to>=from&&!has(P.arts[r.k])).map(r=>r.k)}
function overlaps(P,a,r){return[a.src,...(a.extra||[])].some(x=>{const q=rangeOf(P,x);return q&&q.from<=r.to&&q.to>=r.from})}
function nextSeg(P,k){if(P.outlineMode!=='cards')return null;const o=segRanges(P);const i=o.findIndex(r=>r.k===k);return i<0?null:o[i+1]||null}
function getArt(k,P=S.project){if(!P||!k)return null;if(k.startsWith('ia:'))return P.ia[k.slice(3)];if(k.startsWith('sc:'))return P.sc[k.slice(3)];if(k.startsWith('gm:'))return(P.gm||{})[k.slice(3)];return P.arts[k]}
function cost(n){if(S.credits<n){toast(`积分不足：需要 ${n}，剩余 ${S.credits}`);return false}return true}
function newProject(f,mode,gen){return{id:'p'+Date.now()+Math.random().toString(36).slice(2,5),mode,gen,params:f,stage:'draft',title:'',arts:{plan:newArt('plan','策划案','plan')},cards:null,outlineMode:null,parsed:null,benchDir:null,ia:{},sc:{},gm:{},chat:[],versions:{},created:Date.now(),updated:Date.now(),cover:COVERS[S.projects.length%COVERS.length]}}
function say(P,t,acts){P.chat.push({r:'ai',t,acts:acts||[],at:Date.now()});if(S.curId===P.id)renderAsstMsgs()}
function pushVer(P,art,label,model){(P.versions[art.key]=P.versions[art.key]||[]).push({v:art.versions,at:Date.now(),label,model,data:clone(art.data)});P.updated=Date.now()}
function addHist(P,what,key,v,c,kind='gen'){S.history.unshift({at:Date.now(),pid:P.id,title:P.title||'新项目',what,key,v,cost:c,model:modelOf(S.model).name,kind});S.history=S.history.slice(0,200)}

function createProject(){
  const f=eff(S.form);
  if(S.mode==='game'){const g=S.form;f.game={src:g.gsrc,cfg:{form:g.gform||'value',pov:g.gpov||'first',converge:g.gend==='1'?'merge':'multi',endings:+(g.gend||3)>1?+(g.gend||3):3}}}
  if(S.mode==='benchmark'){f.conv=S.form.conv||'cn';if(f.conv==='global'){if(!S.form.market||S.form.market==='cn')f.market='na'}else{f.market='cn';if(!S.form.genres.length)f.genres=['重生','复仇']}}const P=newProject(f,S.mode,S.fine?'fine':'quick');
  S.projects.unshift(P);S.curId=P.id;S.view='project';S.inline=null;S.nudge=null;S.edTip=null;P.autoRun=!S.fine;S.asstOpen=innerWidth>760;
  const outName='互动影游剧本';
  P.chat.push({r:'me',t:S.mode==='game'?(f.game.src==='idea'?f.idea:`把这份剧本转成${outName}`):S.mode==='original'?f.idea:S.mode==='novel'?`改编《${f.novelName||'粘贴的小说'}》`:(S.form.conv==='global'?`把这部爆款本土化成${MARKETS.find(m=>m.k===(S.form.market&&S.form.market!=='cn'?S.form.market:'na')).name}版`:'把这部爆款迭代成国内其他爆款题材'),at:Date.now()});
  if(S.mode==='game'&&f.game.src==='idea'){say(P,P.autoRun?`收到。一句话模式会一站直出：策划案 → 集纲 → 短剧剧本 → ${outName}，中间不用你操作。`:`收到。精细模式下每一步写完都会停下来，最后再按你选的玩法转成${outName}。`);nodeStart(P);return}
  if(S.mode==='original'){say(P,P.autoRun?`收到。一句话模式会一站直出：策划案 → 全部 ${f.episodes} 集集纲 → 全文短剧剧本，中间不用你操作。想改哪里，写完后随时改。`:`收到。我会用${S.model==='auto'?'最合适的模型':' '+modelOf(S.model).name+' '}先写一份策划案。精细模式下每一步写完都会停下来，等你确认或调整。`);nodeStart(P);return}
  const o={status:'draft'};go('project',o,'parsing');P.stage='parsing';P.parseState='parsing';S.sel='parse';
  say(P,P.mode==='game'?'正在解析剧本：识别分集、人物和台词。':P.mode==='novel'?'正在解析小说：识别章节、人物和主线。':'正在拆解这部爆款：节奏曲线、卡点位置和钩子手法，然后给出转换方案。');render();
  setTimeout(()=>doParse(P),1200);
}
function doParse(P){
  const text=P.mode==='game'?(P.params.gameText||''):P.mode==='novel'?(P.params.novelText||''):(P.params.benchText||'');
  if(S.failNext||text.trim().length<20){S.failNext=false;const o={status:'parsing'};go('project',o,'parse_failed');P.stage='parse_failed';P.parseState='parse_failed';P.parseErr=text.trim().length<20?'文本太短，识别不出章节或剧情':'文件编码无法识别';save();render();return}
  if(P.mode==='game'){parseGameScript(P,text);return}
  if(P.mode==='novel'){const chs=text.match(/第[一二三四五六七八九十百千0-9]+[章回节][^\n]*/g)||[];
    P.parsed={chapters:chs.length?chs:['全文（未识别到章节标记）'],words:text.replace(/\s/g,'').length,chars:Object.values(cast(P.params)).slice(0,4),mainline:'女主被退婚、三年后携新身份归来，揭开当年真相并完成复仇',range:[1,chs.length||1],strength:'适度改编'}}
  else{const eps=[...text.matchAll(/第\s*(\d+)\s*集/g)].map(x=>+x[1]);const cm=[...text.matchAll(/第\s*(\d+)\s*集[^\n]*【[一二三]卡】/g)].map(x=>+x[1]);
    P.parsed={beats:[3,5,4,6,8,5,6,7,9,6,7,8,6,9,10,7,8,9,10,10],cards:cm.length===3?cm:[8,30,55],epCount:eps.length?Math.max(...eps):0,lines:text.split('\n').filter(l=>l.trim()).length,hooks:['身份反差：残疾大佬当场站起','双重身份层层掉马','契约婚姻转向真心','反派在三卡集现身']}}
  P.parseState='done';
  if(P.gen==='quick')startPlan(P);else{const nd=nodesOf(P);say(P,(P.mode==='novel'?'解析完成。确认一下改编范围和力度，':'拆解完成。看一下转换方案，可以改转换方向和目标，')+(nd?`没问题就按自定义节点生成：${nd.map(nodeName).join(' → ')}。`:'没问题就生成策划案。'),[['toPlan',nd?'按自定义节点生成':P.mode==='novel'?'生成策划案':'生成转换后的策划案']]);save();render()}
}
// 上传剧本 → 解析分集、人物和台词，直接作为集纲使用
function parseGameScript(P,text){
  const eps=[];let cur=null;const names={};const tline=(text.match(/《([^》]+)》/)||[])[1];
  text.split('\n').forEach(l=>{const m=/^\s*第\s*(\d+)\s*集\s*(.*)$/.exec(l);
    if(m){const cm=/【([一二三])卡】/.exec(m[2]);cur={title:m[2].replace(/【[一二三]卡】/,'').trim()||`第${m[1]}集`,mark:cm?cm[1]+'卡':'',body:[]};eps.push(cur);return}
    if(cur&&l.trim()){cur.body.push(l.trim());const d=/^([^\s△（(：:]{2,4})[：:]/.exec(l.trim());if(d)names[d[1]]=(names[d[1]]||0)+1}});
  if(!eps.length){const o={status:'parsing'};go('project',o,'parse_failed');P.stage='parse_failed';P.parseState='parse_failed';P.parseErr='没有识别到「第 N 集」这样的分集标题';save();render();return}
  const top=Object.entries(names).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const c={P:'你',L:top[0]||'沈慕白',A:top.find(n=>/柔|浩|婉/.test(n))||top[2]||'苏婉柔',X:top[1]||'林父',city:'江城'};
  const N=eps.length;P.params.episodes=N;
  const marks={};eps.forEach((e,i)=>{if(e.mark)marks[e.mark]=i+1});
  P.cards=marks['一卡']&&marks['二卡']&&marks['三卡']?{c1:marks['一卡'],c2:marks['二卡'],c3:marks['三卡']}:{c1:Math.max(1,Math.round(N*.3)),c2:Math.max(2,Math.round(N*.6)),c3:N};
  const scm={};const oeps=eps.map((e,i)=>{const no=i+1;const act=e.body.find(b=>b.startsWith('△'))||e.body[0]||e.title;
    const lines=e.body.map(b=>{const d=/^([^\s△（(：:]{2,4})[：:]\s*(?:[（(]([^）)]*)[）)])?(.*)$/.exec(b);return d?{t:'dlg',w:d[1],p:d[2]||'平静',x:d[3].trim()}:{t:'act',x:b.replace(/^△\s*/,'')}});
    scm[no]={no,title:e.title,scenes:[{head:'',cast:'',lines}]};
    const card=no===P.cards.c1?'一卡':no===P.cards.c2?'二卡':no===P.cards.c3?'三卡':'';
    return{no,title:e.title,summary:act.replace(/^△\s*/,''),hook:e.body[e.body.length-1]||'',card}});
  const pl=genPlan(P.params,P);pl.cast=c;pl.title=tline||'上传的剧本';pl.titles=[pl.title];pl.logline=`上传剧本，共 ${N} 集，转成互动影游剧本。`;
  pl.chars=[{n:c.L,r:'主要角色',d:'剧本中台词最多的角色。'},{n:c.X,r:'主要角色',d:'剧本中的重要配角。'},{n:c.A,r:'对立角色',d:'和主角站在对立面的人。'}];
  P.arts.plan.data=pl;P.arts.plan.status='ready';P.arts.plan.versions=1;P.title=pl.title;
  P.outlineMode='all';P.arts.all=Object.assign(newArt('all','全部集纲','outline','ready'),{data:{from:1,to:N,eps:oeps},versions:1});
  P.parsed={epCount:N,names:top.slice(0,4),scm,words:text.replace(/\s/g,'').length};P.parseState='done';
  const o={status:P.stage};if(go('project',o,'planning'))P.stage='planning';advanceStage(P,'outlining');
  if(P.gen==='quick'){say(P,`识别出 ${N} 集、${top.length} 个主要角色，直接转成互动影游剧本。`);convertToInteractive(P,'full',{...DEF_IA,...P.params.game.cfg});return}
  S.sel='parse';openGameInline(P,'full');
  say(P,`识别出 ${N} 集、主要角色：${top.slice(0,4).join('、')||'未识别'}。确认玩法和游戏系统后就可以转换。`);save();render();
}
function openGameInline(P,src){openInline('ia',src,'full');if(P.params.game)Object.assign(S.inline.cfg,P.params.game.cfg,{range:'full'})}
function startPlan(P){
  const c=costOf(10);if(!cost(c))return;advanceStage(P,'planning');if(S.curId===P.id)S.sel='plan';
  runTask(P,P.arts.plan,{steps:8,cost:c,label:'策划案',lines:['理解创意…','确定题材与卖点…','设计主角与反派…','搭建人物关系…','规划主线冲突…','设计名场面…','规划付费节奏…','整理策划案…'],
    produce:()=>genPlan(P.params,P),onDone:a=>{P.title=a.data.title;P.cards=a.data.cards;
      if(P.nodeQueue){nodeNext(P);return}
      if(P.autoRun){say(P,`策划案写好了：《${a.data.title}》。接着按卡点分段写全部集纲（一卡第 ${P.cards.c1} 集、二卡第 ${P.cards.c2} 集、三卡第 ${P.cards.c3} 集），写完直接出全文剧本。`);setTimeout(()=>startOutline(P,'cards'),400);return}
      say(P,`策划案写好了：《${a.data.title}》。建议按付费卡点分段写集纲：一卡第 ${P.cards.c1} 集、二卡第 ${P.cards.c2} 集、三卡第 ${P.cards.c3} 集。`,[['outlineModal','生成集纲']]);
      if(S.curId===P.id&&S.view==='project')setTimeout(()=>openOutlineModal(true),350)}});
}

// ============ 自定义节点 ============
function nodesOf(P){const n=P&&P.params.nodes;return P&&P.gen==='fine'&&Array.isArray(n)&&n.length&&n.length<NODE_ALL.length?n:null}
function setupSegs(P){if(P.outlineMode)return;advanceStage(P,'outlining');P.outlineMode='cards';segRanges(P).forEach((r,i)=>{if(!P.arts[r.k])P.arts[r.k]=newArt(r.k,r.label+'集纲','segment',i===0?'empty':'blocked')})}
function nodeStart(P){
  const n=nodesOf(P);if(!n){startPlan(P);return}
  P.nodeQueue=n.filter(k=>k!=='plan');P.nodeDone=[];
  say(P,`按你的自定义节点执行：${n.map(nodeName).join(' → ')}。没勾选的步骤会跳过，全部完成后停下来等你。`);
  if(n.includes('plan')){startPlan(P);return}
  const a=P.arts.plan;a.data=genPlan(P.params,P);a.status='ready';a.versions=1;P.title=a.data.title;P.cards=a.data.cards;pushVer(P,a,'基础设定（自动）','—');advanceStage(P,'planning');if(S.curId===P.id)S.sel='plan';
  say(P,'你没勾选策划案，我先按创意自动搭了一份基础人设和卡点（不扣积分），后面的集纲和正文以它为基础。需要的话可以在「策划案」里查看或修改。');
  save();render();setTimeout(()=>nodeNext(P),300);
}
function nodeNext(P){
  const q=P.nodeQueue;if(!q)return;
  if(!q.length){nodeFinish(P);return}
  const k=q.shift();
  if(NODE_SEGS.includes(k)){setupSegs(P);const a=P.arts[k];
    if(!a){say(P,`这部剧第 ${P.cards.c3} 集就是大结局，没有单独的结局段，已跳过。`);return nodeNext(P)}
    if(has(a))return nodeNext(P);
    if(a.status==='blocked')a.status='empty';
    if(S.curId===P.id)S.sel=k;P.nodeDone.push(a.label);setTimeout(()=>genOutline(P,k),300);return}
  if(k==='script'){setupSegs(P);const all=segRanges(P).map(r=>r.k);const sel=(P.params.nodes||[]).filter(x=>all.includes(x));
    const keys=!sel.length||sel.length===all.length?['full']:sel;q.unshift(...keys.map(x=>'@sc:'+x));return nodeNext(P)}
  if(k.startsWith('@sc:')){const key=k.slice(4);P.nodeDone.push('短剧剧本 · '+(rangeOf(P,key)?.label||''));setTimeout(()=>startScript(P,key,{...DEF_SC}),300);return}
  nodeNext(P);
}
function nodeFinish(P){
  P.nodeQueue=null;const n=P.params.nodes||[];
  const list=[...(n.includes('plan')?['策划案']:[]),...(P.nodeDone||[])];
  const sc=Object.values(P.sc).filter(has).pop();const ol=outlineKeys(P).filter(k=>has(P.arts[k]));
  const acts=sc?[['view:'+sc.key,'查看剧本'],['cont:'+sc.src,'续写'],['export:'+sc.key,'导出']]:ol.length?[['view:'+ol[ol.length-1],'查看集纲'],['script:'+ol[ol.length-1],'接着写剧本']]:[['view:plan','查看策划案'],['outlineModal','接着生成集纲']];
  say(P,`自定义节点都完成了：${list.join('、')}。没勾选的步骤没有执行，随时可以在左侧目录或这里接着生成。所有内容都可以直接点文字修改，改好后点「确认」。`,acts);
  showNudge(P,'自定义节点完成',`已生成：${list.join('、')}。`,acts);save();render();
}

const timers={};
function runTask(P,art,opt){
  if(art.task&&['queued','running'].includes(art.task.status)){toast('正在生成中');return}
  const hadData=!!art.data;art.prev=art.status;
  if(!go('artifact',art,'generating'))return;
  const tk=P.id+art.key;art.task={id:'T'+Math.random().toString(36).slice(2,7),status:'queued',progress:0,line:''};render();
  const willFail=S.failNext;S.failNext=false;const model=modelOf(S.model).name;
  setTimeout(()=>{
    go('task',art.task,'running');render();let i=0;
    timers[tk]=setInterval(()=>{
      i++;art.task.progress=Math.round(i/opt.steps*100);
      art.task.line=opt.lines?opt.lines[Math.min(i-1,opt.lines.length-1)]:opt.stream?opt.stream(i):'';
      if(willFail&&i>=Math.ceil(opt.steps*0.6)){P.autoRun=false;
        clearInterval(timers[tk]);go('task',art.task,'failed');art.task.err='生成超时';
        if(hadData){art.status=art.prev;toast('生成失败，已保留上一版本，积分未扣除')}else go('artifact',art,'error');
        say(P,`「${art.label}」没生成完（生成超时），积分没有扣。`,[['retry:'+art.key,'重试']]);save();render();return}
      if(i>=opt.steps){
        clearInterval(timers[tk]);art.data=opt.produce();art.versions++;
        go('task',art.task,'succeeded');go('artifact',art,'ready');art.notice='';
        S.credits-=opt.cost||0;pushVer(P,art,'AI 生成',model);addHist(P,`生成了${opt.label||art.label}`,art.key,art.versions,opt.cost);
        afterReady(P,art);opt.onDone&&opt.onDone(art);save();render();return}
      updateGen(P,art);
    },opt.speed||200);
  },400);
}
function cancelTask(P,art){
  const tk=P.id+art.key;if(!art.task||!['queued','running'].includes(art.task.status))return;
  clearInterval(timers[tk]);go('task',art.task,'cancelled');
  if(art.data)art.status=art.prev;else go('artifact',art,'empty');
  toast('已取消，积分未扣除');save();render();
}
function afterReady(P,art){
  if(P.outlineMode==='cards'&&['c1','c2','c3'].includes(art.key)){const nx=nextSeg(P,art.key);if(nx&&P.arts[nx.k]&&P.arts[nx.k].status==='blocked')go('artifact',P.arts[nx.k],'empty')}
}
function markEdited(P,art){if(['ready','outdated','edited'].includes(art.status)){go('artifact',art,'edited');propagate(P,art.key)}P.updated=Date.now();save()}
function downstream(P,key){if(key==='plan')return['all','c1','c2','c3','end'].filter(k=>P.arts[k]);const r=rangeOf(P,key);if(!r)return[];return[...Object.values(P.ia),...Object.values(P.sc),...Object.values(P.gm||{})].filter(a=>overlaps(P,a,r)).map(a=>a.key)}
function propagate(P,key){
  for(const k of downstream(P,key)){const a=getArt(k,P);if(!a||!a.data)continue;
    if(a.status==='locked')a.notice=key==='plan'?'策划案有改动':'对应的集纲有改动';
    else if(['ready','edited'].includes(a.status)){go('artifact',a,'outdated');a.notice=key==='plan'?'策划案有改动，这部分集纲可能需要更新':'对应的集纲有改动，这部分剧本可能需要更新'}}
}

// ============ 集纲 ============
function outlineCtx(P){return{total:P.params.episodes,cards:P.cards,c:P.arts.plan.data.cast,base:P.baseEps}}
function startOutline(P,mode){
  advanceStage(P,'outlining');
  if(mode==='all'){P.outlineMode='all';P.arts.all=P.arts.all||newArt('all','全部集纲','outline');S.sel='all';genOutline(P,'all')}
  else{P.outlineMode='cards';segRanges(P).forEach((r,i)=>{if(!P.arts[r.k])P.arts[r.k]=newArt(r.k,r.label+'集纲','segment',i===0?'empty':'blocked')});S.sel='c1';genOutline(P,'c1')}
}
function genOutline(P,k){
  const art=P.arts[k];const r=rangeOf(P,k);const ctx=outlineCtx(P);const n=r.to-r.from+1;const c=costOf(Math.max(4,Math.ceil(n/4)));if(!cost(c))return;
  const steps=Math.min(n,30);
  runTask(P,art,{steps,speed:Math.max(60,1800/n),cost:c,label:art.label,
    stream:i=>{const no=r.from+Math.floor((i-1)*n/steps);return`正在写第 ${no} 集 · ${genEpisode(no,ctx).title}`},
    produce:()=>{const eps=[];for(let x=r.from;x<=r.to;x++)eps.push(genEpisode(x,ctx));return{from:r.from,to:r.to,eps}},
    onDone:()=>outlineDone(P,k)});
}
function outlineDone(P,k){
  if(P.nodeQueue){nodeNext(P);return}
  const r=rangeOf(P,k);const nx=nextSeg(P,k);const last=P.arts[k].data.eps.find(e=>e.no===r.to);
  if(P.autoRun&&!nx){say(P,'全部集纲写好了，接着写全文短剧剧本。');setTimeout(()=>startScript(P,'full',{...DEF_SC}),400);return}
  if(nx&&(S.auto||P.autoRun)&&P.arts[nx.k].status==='empty'){if(P.autoRun){setTimeout(()=>{if(S.curId===P.id)S.sel=nx.k;genOutline(P,nx.k)},400);return}say(P,`${r.label}集纲写好了，按你的设置自动接着写${nx.label}。`);setTimeout(()=>{if(S.curId===P.id)S.sel=nx.k;genOutline(P,nx.k)},400);return}
  if(nx){const acts=[['outline:'+nx.k,`继续写${nx.label}集纲`],['scriptcur:'+k,`先写${r.label}剧本`],['view:'+k,'我先看看']];
    say(P,`${r.label}集纲写好了（第 ${r.from}–${r.to} 集）。卡点落在第 ${r.to} 集「${last?.title||''}」。`,acts);
    showNudge(P,`${r.label}集纲写好了`,`第 ${r.from}–${r.to} 集，第 ${r.to} 集「${last?.title||''}」是付费卡点。接下来写${nx.label}（第 ${nx.from}–${nx.to} 集）？`,acts,true)}
  else{const acts=[['script:'+k,'生成全文短剧剧本'],['ia:'+k,'转互动影游剧本'],['view:'+k,'我先看看']];
    say(P,P.outlineMode==='all'?'全部集纲写好了。接下来可以写成短剧剧本，也可以转成互动影游剧本。':'所有段的集纲都写好了。接下来可以写成短剧剧本，也可以转成互动影游剧本。',acts);
    showNudge(P,'集纲全部写好了','可以直接写成分场剧本，也可以转成带选项和多结局的互动影游剧本。',acts)}
}

function buildGame(eps,cfg,P,scm){

function edgesOf(n){if(n.type==='choice')return n.options.map(o=>o.to);if(n.type==='condition')return[...n.rules.map(r=>r.to),n.else];if(n.type==='ending')return[];return[n.to]}
function validateIA(a,silent){
  const d=a.data;if(!d)return;
  if(a.validate.status!=='unchecked')go('validate',a.validate,'unchecked');go('validate',a.validate,'checking');
  const by=Object.fromEntries(d.nodes.map(n=>[n.id,n]));const is=[];d.nodes.forEach(n=>n.flag='');
  const seen=new Set([d.start]);const q=[d.start];
  while(q.length){const n=by[q.shift()];if(!n)continue;for(const t of edgesOf(n))if(t&&by[t]&&!seen.has(t)){seen.add(t);q.push(t)}}
  d.nodes.forEach(n=>{if(!seen.has(n.id)){is.push({l:'e',id:n.id,m:`「${n.title}」从开头走不到这里`});n.flag='orphan'}});
  d.nodes.forEach(n=>{if(n.type==='ending')return;const es=edgesOf(n);if(!es.length||es.some(t=>!t||!by[t])){is.push({l:'e',id:n.id,m:`「${n.title}」${!es.length?'没有下一步':'有出口没指定目标'}`});n.flag='error'}});
  d.nodes.forEach(n=>{if(n.type==='choice'&&n.options.length<2){is.push({l:'w',id:n.id,m:`「${n.title}」只有 ${n.options.length} 个选项，算不上选择`});n.flag=n.flag||'warning'}});
  const maxv={};d.vars.forEach(v=>maxv[v]=0);const flags=new Set();
  d.nodes.forEach(n=>{if(n.type==='choice'&&seen.has(n.id)){d.vars.forEach(v=>maxv[v]+=Math.max(0,...n.options.map(o=>(o.effects||{})[v]||0)));n.options.forEach(o=>o.flag&&flags.add(o.flag))}});
  d.nodes.forEach(n=>{if(n.type!=='condition')return;n.rules.forEach(r=>{const en=by[r.to];
    if(r.var&&r.val>maxv[r.var]){is.push({l:'e',id:r.to,m:`「${en?.title}」要求${r.var}≥${r.val}，但全剧最多只能到 ${maxv[r.var]}`});if(en)en.flag='error'}
    if(r.flag&&!flags.has(r.flag)){is.push({l:'e',id:r.to,m:`「${en?.title}」需要的条件没有任何选项能触发`});if(en)en.flag='error'}})});
  const can=new Set(d.nodes.filter(n=>n.type==='ending').map(n=>n.id));let ch=true;
  while(ch){ch=false;d.nodes.forEach(n=>{if(!can.has(n.id)&&edgesOf(n).some(t=>can.has(t))){can.add(n.id);ch=true}})}
  d.nodes.forEach(n=>{if(seen.has(n.id)&&!can.has(n.id)&&!is.some(i=>i.id===n.id&&i.l==='e')){is.push({l:'e',id:n.id,m:`「${n.title}」之后怎么选都到不了结局`});n.flag='error'}});
  if(!d.nodes.some(n=>n.type==='ending'))is.push({l:'e',id:d.start,m:'剧本没有结局'});
  a.issues=is;a.maxv=maxv;const to=is.some(i=>i.l==='e')?'invalid':is.length?'warning':'valid';go('validate',a.validate,to);
  if(!silent)toast(to==='valid'?'结构检查通过':to==='warning'?`有 ${is.length} 条提醒`:`有 ${is.filter(i=>i.l==='e').length} 处需要修复`);save();
}

  });

  d.nodes.forEach((n,i)=>{if(rank[n.id]==null)return;edgesOf(n).forEach(t=>{if(t==null||idx[t]==null||idx[t]<=i)return;rank[t]=Math.max(rank[t]??0,rank[n.id]+1)})});

  d.nodes.forEach(n=>{if(rank[n.id]==null)rank[n.id]=++max});
  const rows={};d.nodes.forEach(n=>(rows[rank[n.id]]=rows[rank[n.id]]||[]).push(n));

// 按勾选的意见重写这一页；旧版本保留在版本记录里，可以撤销
function docRewrite(picked){

        DOC_STORE[a.key]={rep:nr,sug:docRec(nr.s,nr)};(DOC_HIST[a.key]=DOC_HIST[a.key]||[]).push({s:nr.s,v:a.versions,at:Date.now()});

      else say(P,'剧本医生重写好了。',[['undo','撤销这次重写']])}});

function regen(P,k){
  const a=getArt(k,P);if(!a)return;
  if(k==='plan'){const c=costOf(10);if(!cost(c))return;runTask(P,a,{steps:8,cost:c,label:'策划案',lines:['重新理解创意…','调整人物…','重排冲突…','整理策划案…'],produce:()=>genPlan(P.params,P),onDone:x=>{P.title=x.data.title;propagate(P,'plan')}});return}
  if(k.startsWith('ia:')){convertToInteractive(P,a.src,a.cfg);return}
  if(k.startsWith('sc:')){startScript(P,a.src,a.cfg);return}
  const old=a.data;genOutline(P,k);
  const iv=setInterval(()=>{if(a.status!=='generating'){clearInterval(iv);if(a.data!==old){propagate(P,k);save();render()}}},200);
}
function act(x){
  const P=S.project;
  switch(x){
    case'home':S.view='home';render();break;
    case'toLib':S.view='library';S.nudge=null;render();break;
    case'fine':S.fine=!S.fine;render();break;
    case'sampleNovel':S.form.novelText=SAMPLE_NOVEL;S.form.novelName='重生之千金归来';render();break;
    case'sampleBench':S.form.benchText=SAMPLE_BENCH;render();break;
    case'sampleGame':S.form.gameText=SAMPLE_GAME;render();break;
    case'gameOpen':openGameInline(P,'full');render();break;
    case'clearNovel':S.form.novelText='';S.form.novelName='';S.mode='original';render();break;
    case'clearBench':S.form.benchText='';S.mode='original';render();break;
    case'clearGame':S.form.gameText='';S.form.gsrc='idea';render();break;
    case'create':if(!canSend())return;PL=null;VIEW.key=null;createProject();break;
    case'reparse':{const o={status:'parse_failed'};go('project',o,'parsing');P.stage='parsing';P.parseState='parsing';render();setTimeout(()=>doParse(P),900);break}
    case'toPlan':nodeStart(P);break;
    case'outlineNext':if(P.outlineMode){S.sel=outlineKeys(P)[0];render()}else openOutlineModal(false);break;
    case'openSC':openInline('script',S.sel,'full');renderMain();break;
    case'viewAll':if(P.outlineMode==='cards')mergeToAll(P);break;
    case'viewCards':if(P.outlineMode==='all'){MC={total:P.params.episodes,...(P.cards||defaultCards(P.params.episodes)),mode:'cards',adjust:false};drawOutlineModal()}break;
    case'openIA':openInline('ia',S.sel,'full');renderMain();break;
    case'scToIA':{const a=getArt(S.sel);openInline('ia',a.src,a.src==='full'||a.src==='all'?'full':'cur');renderMain();break}
    case'scGoIA':S.sel='ia:'+getArt(S.sel).src;S.iaTab='canvas';render();break;
    case'goSC':case'goIA':{const r=rangeOf(P,S.sel);const g=x==='goSC'?P.sc:P.ia;const hit=Object.values(g).find(a=>a.src==='full')||Object.values(g).find(a=>overlaps(P,a,r));if(hit){S.sel=hit.key;render()}break}
    case'inlineClose':S.inline=null;renderMain();break;
    case'inlineGo':{const i=S.inline;const[f,t]=inlineRange(P,i);if(f>t){toast('起始集不能大于结束集');return}const key=rangeKey(P,f,t);const{range,from,to,...cfg}=i.cfg;
      if(i.type==='script')startScript(P,key,cfg);else if(i.type==='game')startGame(P,key,cfg);else{if(P.ia[key])P.ia[key].extra=[];convertToInteractive(P,key,cfg)}break}
    case'showIssues':S.iaTab='canvas';S.selNode=null;renderMain();break;
    case'export':openExport(P,getArt(S.sel));break;
    case'fit':fit();break;
    case'deselect':S.selNode=null;renderMain();break;
    case'addOpt':{const a=getArt(S.sel);const n=a.data.nodes.find(x=>x.id===S.selNode);n.options.push({label:'新选项',to:null,effects:{}});iaChanged(P,a,n);renderMain();break}
    case'delNode':{const a=getArt(S.sel);a.data.nodes=a.data.nodes.filter(x=>x.id!==S.selNode);S.selNode=null;iaChanged(P,a);renderMain();toast('已删除节点');break}
    case'asst':S.asstOpen=!S.asstOpen;render();break;
    case'asstClose':S.asstOpen=false;render();break;
    case'doctor':{const a=getArt(S.sel);if(!a||!has(a)){toast('这一页还没有内容，先生成再来体检');break}if(a.status==='generating'){toast('还在生成中，等写完再体检');break}if(!['plan','outline','segment','script','interactive','game'].includes(a.kind)){toast('这一页还不支持剧本医生');break}openDoctor();break}
    case'ask':sendAsk();break;
  }
}
