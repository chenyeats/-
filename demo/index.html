<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>互动短剧剧本工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：首页=顶部步骤条 + 居中嵌入式输入框（参数是可下拉的胶囊）；项目页=步骤条 + 左侧目录 + 文档区。单一深色主题，青色做主色，琥珀色只用于付费卡点 */
:root{
  color-scheme:dark;
  --bg:#0F1012; --bg2:#16171A; --surface:#1A1B1F; --surface2:#222328; --hover:#2A2C31; --line:#2C2E34; --line2:#3A3D44;
  --fg:#ECEDEF; --fg2:#B9BCC3; --muted:#7E828C;
  --accent:#4FD8C8; --accent-dim:rgba(79,216,200,.14); --on-accent:#06201D;
  --amber:#F2B550; --amber-dim:rgba(242,181,80,.14); --red:#F07167; --red-dim:rgba(240,113,103,.14);
  --violet:#A99BFF; --blue:#7FB2FF; --green:#7DD892;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 15% -10%,#24211d 0%,transparent 60%),radial-gradient(900px 500px at 100% 0%,#1a2120 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:12px}
.sp{flex:1}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 顶部步骤条 */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px}
.iconbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--fg2);flex:none}
.iconbtn:hover{background:var(--hover);color:var(--fg)}
.steps{display:flex;align-items:center;gap:4px;background:rgba(40,42,47,.7);backdrop-filter:blur(8px);border-radius:12px;padding:6px 10px;overflow-x:auto;scrollbar-width:none;max-width:100%;min-width:0}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap}
.step .n{width:20px;height:20px;border-radius:50%;background:var(--line2);color:var(--fg2);display:grid;place-items:center;font-size:11px;font-family:var(--f-mono)}
.step .n svg.i{width:12px;height:12px}
.step.cur{color:var(--accent)}
.step.cur .n{background:var(--accent);color:var(--on-accent)}
.step.done{color:var(--fg2)}
.step.done .n{background:var(--accent-dim);color:var(--accent)}
.step[data-step]:hover{background:var(--hover)}
.steps .dash{width:22px;height:1px;background:var(--line2);flex:none}
.credits{display:flex;align-items:center;gap:6px;color:var(--fg2);font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.credits i{width:14px;height:14px;border-radius:50%;background:var(--fg2);display:inline-block;box-shadow:inset 0 0 0 3px var(--bg2)}

/* 首页 */
.home{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:7vh 64px;display:grid;gap:28px}
.intro{text-align:center;display:grid;gap:12px}
.intro h1{font-size:clamp(28px,4.4vw,40px);font-weight:900;letter-spacing:.02em}
.intro p{margin:0;color:var(--fg2);font-size:clamp(14px,1.8vw,17px);line-height:1.8}
.composer{background:rgba(20,21,24,.92);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.ctop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modes{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.modes button{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;color:var(--fg2);font-weight:500}
.modes button.on{background:#34363C;color:var(--fg)}
.modes button:not(.on):hover{color:var(--fg)}
.badge{font-size:10px;padding:0 5px;border-radius:4px;background:var(--amber-dim);color:var(--amber);font-weight:600}
.switch{display:flex;align-items:center;gap:8px;color:var(--fg2);font-size:13px;cursor:pointer;user-select:none}
.switch .tr{width:32px;height:18px;border-radius:9px;background:var(--line2);position:relative;transition:background .15s}
.switch .tr::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch.on .tr{background:var(--accent)}
.switch.on .tr::after{transform:translateX(14px);background:var(--on-accent)}
.cinput textarea{width:100%;min-height:150px;resize:none;border:0;background:transparent;padding:8px 2px;font-size:15px;line-height:1.7;outline:none;color:var(--fg)}
.cinput textarea::placeholder{color:var(--muted)}
.cinput textarea.tall{min-height:200px}
.filecard{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;margin-top:4px}
.filecard button{color:var(--muted);display:grid}
.cbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);color:var(--fg2);font-size:13px;white-space:nowrap;max-width:220px;cursor:pointer}
.chip span.v{overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--line2);color:var(--fg)}
.chip.set{color:var(--fg);border-color:#3f4249;background:#2a2c31}
.chip.set .star{color:var(--accent)}
.chip.open{border-color:var(--accent)}
.chip .caret{opacity:.6}
.send{width:40px;height:40px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.send:disabled{background:var(--line2);color:var(--muted);cursor:not-allowed}
.hint{font-size:12px;color:var(--muted);text-align:right;min-height:18px;margin-top:-4px}
.inspire{display:grid;gap:12px}
.inspire h3{font-size:14px;color:var(--fg2);font-weight:500;text-align:center}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ideas button{text-align:left;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--fg2);display:flex;gap:10px}
.ideas button:hover{background:var(--surface2);color:var(--fg)}
.ideas .k{font-family:var(--f-mono);color:var(--muted)}
.recent{display:grid;gap:10px}
.recent h3{font-size:15px}
.projcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.projcard:hover{border-color:var(--line2)}
.projcard .cov{width:40px;height:52px;border-radius:6px;background:linear-gradient(160deg,#3a3f3d,#1b1f1e);display:grid;place-items:center;font-weight:900;color:var(--accent);flex:none}

/* 下拉面板 */
.pop{position:fixed;z-index:70;background:#1E1F23;border:1px solid var(--line2);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:10px;min-width:220px;max-width:min(420px,calc(100vw - 24px));max-height:min(440px,calc(100vh - 24px));overflow:auto}
.pop h5{margin:2px 6px 8px;font-size:12px;color:var(--muted);font-weight:500;display:flex;gap:8px}
.opts{display:grid;gap:2px}
.opts button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-align:left;color:var(--fg2)}
.opts button:hover{background:var(--hover);color:var(--fg)}
.opts button.on{color:var(--fg)}
.opts button:disabled{opacity:.45;cursor:not-allowed}
.opts button .ck{width:16px;color:var(--accent);flex:none}
.opts button small{margin-left:auto;padding-left:12px;color:var(--muted);font-size:11px}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:2px}
.tags button{padding:5px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);color:var(--fg2);font-size:13px}
.tags button.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.pfield{display:grid;gap:4px;padding:4px 6px}
.pfield label{font-size:12px;color:var(--muted)}
.pfield input,.pfield select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
.pfield input:focus{border-color:var(--accent)}
.pfoot{display:flex;gap:8px;justify-content:flex-end;padding:8px 6px 2px;border-top:1px solid var(--line);margin-top:8px}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);color:var(--fg);font-size:13px;white-space:nowrap;cursor:pointer}
.btn:hover{border-color:var(--line2);background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sq{width:34px;padding:0;justify-content:center}

/* 项目工作台 */
.ws{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100% - 58px)}
.side{padding:8px 10px 40px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.side h4{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.08em;margin:14px 10px 4px}
.side a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--fg2);font-size:13px}
.side a:hover{background:var(--hover);color:var(--fg)}
.side a.on{background:var(--surface2);color:var(--fg);font-weight:500}
.side a.dim{opacity:.45}
.side a .r{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.main{padding:16px 32px 80px;min-width:0}
.doc{max-width:860px;margin:0 auto;display:grid;gap:20px}
.doc.full{max-width:none}
.dh{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dh h2{font-size:24px;font-weight:900}
.dh .meta{color:var(--muted);font-size:12px;margin-top:4px}
.dh .acts{display:flex;gap:8px;align-items:center;margin-left:auto}
.lockmark{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--fg2);background:var(--surface2);padding:2px 8px;border-radius:6px;vertical-align:middle;margin-left:8px;font-weight:400}
.note{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:13px;flex-wrap:wrap}
.note.amber{background:var(--amber-dim);color:var(--amber)}
.note.red{background:var(--red-dim);color:var(--red)}
.note.info{background:var(--accent-dim);color:var(--accent)}
.note .btn{height:28px;padding:0 10px}

.sec{display:grid;gap:8px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font-size:16px;display:flex;align-items:center;gap:8px}
.sec h3 .regen{opacity:0;transition:opacity .15s}
.sec:hover h3 .regen,.sec h3 .regen:focus-visible{opacity:1}
.sec p{margin:0;color:var(--fg2);white-space:pre-wrap}
[contenteditable]{outline:none;border-radius:6px;padding:2px 4px;margin:-2px -4px}
[contenteditable]:hover{background:rgba(255,255,255,.03)}
[contenteditable]:focus{background:var(--surface);box-shadow:0 0 0 1px var(--line2)}
.titles{display:flex;gap:8px;flex-wrap:wrap}
.titles button,.titles span{padding:6px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg2)}
.titles button.on{border-color:var(--accent);color:var(--fg);background:var(--accent-dim)}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.char{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.char b{font-size:16px}
.char .role{font-size:11px;color:var(--accent)}
.char div{font-size:13px;color:var(--fg2)}

.gen{display:grid;gap:14px;padding:28px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.gen .row{display:flex;align-items:center;gap:10px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.skel{display:grid;gap:8px}
.skel i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--surface2),var(--hover),var(--surface2));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.gen .line{font-size:13px;color:var(--muted);font-family:var(--f-mono);min-height:20px}
.empty{padding:56px 20px;text-align:center;border:1px dashed var(--line2);border-radius:14px;color:var(--muted);display:grid;gap:14px;justify-items:center}

/* 集纲 */
.eps{display:grid}
.ep{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 14px;padding:14px 8px;border-bottom:1px solid var(--line)}
.ep .no{font-family:var(--f-mono);color:var(--muted);font-size:12px;padding-top:2px;grid-row:span 3}
.ep .no b{display:block;font-size:20px;color:var(--fg);font-weight:600}
.ep .t{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ep .s{color:var(--fg2);font-size:13px}
.ep .h{color:var(--muted);font-size:12px}
.ep.card{background:linear-gradient(90deg,var(--amber-dim),transparent 60%);border-radius:10px;border-bottom-color:transparent;margin:2px 0}
.ep.card .no b{color:var(--amber)}
.ep.ph{opacity:.55}
.cardtag{font-size:11px;font-weight:700;color:var(--amber);border:1px solid var(--amber);padding:0 6px;border-radius:5px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:#18191C;border:1px solid var(--line2);border-radius:18px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;display:grid;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{width:min(860px,100%)}
.mh{padding:20px 22px 4px;display:flex;align-items:flex-start;gap:8px}
.mh h3{font-size:18px}
.mh p{margin:4px 0 0;color:var(--muted);font-size:13px}
.mb{padding:16px 22px;display:grid;gap:18px}
.mf{padding:14px 22px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choose button{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;gap:4px}
.choose button b{font-size:15px;display:flex;gap:6px;align-items:center}
.choose button span{font-size:12px;color:var(--muted)}
.choose button.on{border-color:var(--accent);background:var(--accent-dim)}
.lbl{font-size:12px;color:var(--muted);margin-bottom:8px;display:block}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;color:var(--fg2);font-size:13px}
.seg button.on{background:#3A3C42;color:var(--fg)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.stepper button{width:28px;height:30px;color:var(--fg2)}
.stepper button:hover{background:var(--hover)}
.stepper input{width:44px;height:30px;text-align:center;border:0;background:transparent;outline:none;font-family:var(--f-mono);-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}

/* 卡点滑轨 */
.slider{padding:34px 12px 8px;user-select:none;touch-action:none}
.track{position:relative;height:8px;border-radius:4px;background:var(--line)}
.track .seg-c{position:absolute;top:0;bottom:0}
.handle{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--bg);border:3px solid var(--amber);cursor:grab;touch-action:none;box-shadow:0 0 0 4px rgba(242,181,80,.15)}
.handle:active{cursor:grabbing}
.handle .hl{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;color:var(--amber);font-family:var(--f-mono)}
.handle.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:10px;font-family:var(--f-mono)}
.cardrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.cardrow>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.cardrow .t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.cardrow .r{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.sw{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.err{color:var(--red);font-size:12px;min-height:18px}

/* 互动剧本 */
.iabar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;font-size:13px;border:1px solid var(--line)}
.check.ok{color:var(--green)}.check.warn{color:var(--amber);border-color:rgba(242,181,80,.4)}.check.bad{color:var(--red);border-color:rgba(240,113,103,.45)}
.iawrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.canvas{position:relative;height:600px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);overflow:hidden;background-image:radial-gradient(#2a2c31 1px,transparent 1px);background-size:22px 22px}
.canvas #cv{width:100%;height:100%;cursor:grab;display:block}
.canvas #cv.drag{cursor:grabbing}
.cvtools{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg2);background:rgba(22,23,26,.9);padding:5px 10px;border-radius:8px;border:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.insp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start}
.insp h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.f{display:grid;gap:4px}
.f label{font-size:11px;color:var(--muted)}
.f input,.f textarea,.f select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;outline:none;min-width:0}
.f textarea{min-height:110px;resize:vertical}
.optrow{display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:8px}
.optrow .r1{display:flex;gap:4px}
.optrow .r1 input{flex:1;min-width:0}
.optrow .r2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.optrow input[type=number]{width:52px;padding:2px 4px}
.optrow select{max-width:100%;font-size:12px;padding:3px 4px}
.issues{display:grid;gap:6px}
.issue{font-size:12px;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.issue.e{background:var(--red-dim);color:var(--red)}
.issue.w{background:var(--amber-dim);color:var(--amber)}
.script{display:grid;gap:10px;max-width:760px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:4px}
.sc.b{margin-left:28px}

.play{max-width:400px;margin:0 auto;width:100%}
.phone{aspect-ratio:9/16;max-height:640px;max-width:100%;border-radius:24px;border:1px solid var(--line2);background:linear-gradient(170deg,#2b3331 0%,#121615 70%);padding:20px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.phone .vars{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px}
.phone .vars span{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:5px}
.phone .story{margin-top:auto;display:grid;gap:8px;font-size:15px;line-height:1.75}
.phone .ep{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.phone .chs{display:grid;gap:8px}
.phone .chs button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);padding:11px 14px;border-radius:12px;text-align:left}
.phone .chs button:hover{background:rgba(255,255,255,.15)}
.phone .end{font-size:22px;font-weight:900;text-align:center;color:var(--accent)}
.timer{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--amber);animation:tm 8s linear forwards}
@keyframes tm{from{width:100%}to{width:0}}

/* 调试面板（仅内部评审） */
.dbg{position:fixed;right:12px;top:64px;bottom:12px;width:min(340px,calc(100% - 24px));z-index:60;background:#121315;border:1px solid var(--line2);border-radius:14px;padding:14px;overflow:auto;display:grid;gap:12px;align-content:start;font-size:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dbg h4{margin:0;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.dbg table{width:100%;border-collapse:collapse}
.dbg td{padding:4px 2px;border-bottom:1px solid var(--line)}
.st{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface2);color:var(--fg2);white-space:nowrap}
.st.cur{background:var(--accent);color:var(--on-accent)}
.stl{display:flex;flex-wrap:wrap;gap:4px}
.log{display:grid;gap:3px;font-family:var(--f-mono);font-size:11px}
.log div{padding:3px 6px;border-radius:4px;background:var(--surface);overflow-wrap:anywhere;color:var(--fg2)}
.log div.bad{background:var(--red-dim);color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#ECEDEF;color:#111;padding:9px 18px;border-radius:10px;z-index:90;font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:1000px){.iawrap{grid-template-columns:1fr}}
@media (max-width:760px){
  .ws{grid-template-columns:1fr}

  .choose{grid-template-columns:1fr}
  .canvas{height:440px}
  .topbar .credits{display:none}
  .dh .acts{margin-left:0}
}

    conflict:fill('主线：{P}复仇并找回身份，对抗{A}的伪装与幕后势力。\n爽点：当众打脸 · 马甲掉落 · 反派自食其果 · 男主追妻。\n名场面：订婚宴退婚 / 私人飞机降落 / 峰会主讲人揭晓 / 雨夜对峙。',c),
    pacing:`总集数 ${f.episodes}。建议卡点：一卡第 ${cards.c1} 集（身份悬念），二卡第 ${cards.c2} 集（情感两难），三卡第 ${cards.c3} 集（幕后黑手反转）。`,
    cards,ending:fill('{A}伏法，{P}与{L}和解。互动版可延伸出好结局、坏结局和隐藏结局（{X}的秘密）。',c),

function skillNames(ids){return(ids||[]).map(id=>[...BUILTIN_SKILLS,...S.userSkills].find(s=>s.id===id)?.name).filter(Boolean)}
function defaultCards(n){return{c1:Math.max(2,Math.round(n*0.15)),c2:Math.round(n*0.44),c3:Math.round(n*0.75)}}
function genEpisode(no,ctx){
  const{total,cards,c}=ctx;const cp=[cards.c1,cards.c2,cards.c3];const isCard=cp.includes(no);let t,s,h;
  if(no<=3)[t,s]=T.open[no-1];
  else if(no===total)[t,s]=T.final;
  else if(isCard)[t,s,h]=T.card[cp.indexOf(no)];
  else if(no>total*0.85)[t,s]=T.climax[no%T.climax.length];
  else[t,s]=T.rise[(no*7)%T.rise.length];
  return{no,title:t,summary:fill(s,c),hook:fill(h||T.hooks[no%T.hooks.length],c),card:isCard?['一卡','二卡','三卡'][cp.indexOf(no)]:''};
}

function newArt(key,label,kind,status='empty'){return{key,label,kind,status,data:null,versions:0,task:null,prev:null,notice:''}}
function segRanges(P){const{c1,c2,c3}=P.cards;const N=P.params.episodes;const r=[{k:'c1',label:'一卡',from:1,to:c1},{k:'c2',label:'二卡',from:c1+1,to:c2},{k:'c3',label:'三卡',from:c2+1,to:c3}];if(c3<N)r.push({k:'end',label:'结局段',from:c3+1,to:N});return r}
function getArt(k){const P=S.project;if(!P||!k)return null;return k.startsWith('ia:')?P.ia[k.slice(3)]:P.arts[k]}
function cost(n){if(S.credits<n){toast(`积分不足：需要 ${n}，剩余 ${S.credits}`);return false}return true}

function createProject(){

  else P.parsed={beats:[3,5,4,6,8,5,6,7,9,6,7,8,6,9,10,7,8,9,10,10],cards:[8,30,55],hooks:['身份反差：残疾大佬当场站起','双重身份层层掉马','契约婚姻转向真心','反派在三卡集现身']};

function startPlan(){

  runTask(P.arts.plan,{steps:8,cost:10,lines:['理解创意…','确定题材与卖点…','设计主角与反派…','搭建人物关系…','规划主线冲突…','设计名场面…','规划付费节奏…','整理策划案…'],
    produce:()=>genPlan(P.params,P),onDone:a=>{P.title=a.data.title;P.cards=a.data.cards;setTimeout(()=>openOutlineModal(true),350)}});
}

const timers={};
function runTask(art,opt){
  if(art.task&&['queued','running'].includes(art.task.status)){toast('正在生成中');return}
  const hadData=!!art.data;art.prev=art.status;
  if(!go('artifact',art,'generating',art.label))return;
  art.task={id:'T'+Math.random().toString(36).slice(2,7),status:'queued',progress:0,line:''};
  log(`[生成任务] ${art.label}: 新建 → 排队中`);render();
  const willFail=S.failNext;S.failNext=false;
  setTimeout(()=>{
    go('task',art.task,'running',art.label);render();let i=0;
    timers[art.key]=setInterval(()=>{
      i++;art.task.progress=Math.round(i/opt.steps*100);
      art.task.line=opt.lines?opt.lines[Math.min(i-1,opt.lines.length-1)]:opt.stream?opt.stream(i):'';
      if(willFail&&i>=Math.ceil(opt.steps*0.6)){
        clearInterval(timers[art.key]);go('task',art.task,'failed',art.label);art.task.err='生成超时';
        if(hadData){art.status=art.prev;log(`[产物] ${art.label}: 失败，保留上一版本`);toast('生成失败，已保留上一版本，积分未扣除')}
        else go('artifact',art,'error',art.label);
        save();render();return}
      if(i>=opt.steps){
        clearInterval(timers[art.key]);art.data=opt.produce();art.versions++;
        go('task',art.task,'succeeded',art.label);go('artifact',art,'ready',art.label);art.notice='';
        S.credits-=opt.cost||0;
        opt.onDone&&opt.onDone(art);afterReady(art);save();render();return}
      updateGen(art);
    },opt.speed||200);
  },400);
}
function cancelTask(art){
  if(!art.task||!['queued','running'].includes(art.task.status))return;
  clearInterval(timers[art.key]);go('task',art.task,'cancelled',art.label);
  if(art.data)art.status=art.prev;else go('artifact',art,'empty',art.label);
  toast('已取消，积分未扣除');save();render();
}
function afterReady(art){
  const P=S.project;
  if(P.outlineMode==='cards'&&['c1','c2','c3'].includes(art.key)){const ord=segRanges(P).map(r=>r.k);const nx=P.arts[ord[ord.indexOf(art.key)+1]];if(nx&&nx.status==='blocked')go('artifact',nx,'empty',nx.label)}
}
function markEdited(art){if(['ready','outdated','edited'].includes(art.status)){go('artifact',art,'edited',art.label);propagate(art.key)}save();if(S.debug)renderDbg()}
function downstream(key){const P=S.project;if(key==='plan')return['all','c1','c2','c3','end'].filter(k=>P.arts[k]);return Object.keys(P.ia).filter(k=>P.ia[k].src===key).map(k=>'ia:'+k)}
function propagate(key){
  for(const k of downstream(key)){const a=getArt(k);if(!a||!a.data)continue;
    if(a.status==='locked')a.notice=key==='plan'?'策划案有改动':'集纲有改动';
    else if(['ready','edited'].includes(a.status)){go('artifact',a,'outdated',a.label);a.notice=key==='plan'?'策划案有改动，这部分集纲可能需要更新':'对应的集纲有改动，互动剧本可能需要更新'}}
}

function outlineCtx(){const P=S.project;return{total:P.params.episodes,cards:P.cards,c:P.arts.plan.data.cast}}
function startOutline(mode){
  const P=S.project;advanceStage('outlining');
  if(mode==='all'){P.outlineMode='all';P.arts.all=P.arts.all||newArt('all','全部集纲','outline');S.sel='all';genOutline(P.arts.all,1,P.params.episodes)}
  else{P.outlineMode='cards';segRanges(P).forEach((r,i)=>{if(!P.arts[r.k])P.arts[r.k]=newArt(r.k,r.label+'集纲','segment',i===0?'empty':'blocked')});S.sel='c1';genOutline(P.arts.c1,1,P.cards.c1)}
}
function genOutline(art,from,to,chain){
  const ctx=outlineCtx();const n=to-from+1;const c=Math.max(4,Math.ceil(n/4));if(!cost(c))return;
  const steps=Math.min(n,30);
  runTask(art,{steps,speed:Math.max(60,1800/n),cost:c,
    stream:i=>{const no=from+Math.floor((i-1)*n/steps);return`正在写第 ${no} 集 · ${genEpisode(no,ctx).title}`},
    produce:()=>{const eps=[];for(let k=from;k<=to;k++)eps.push(genEpisode(k,ctx));return{from,to,eps}},
    onDone:()=>{if(!chain)return;const P=S.project;const ord=segRanges(P);const nx=ord[ord.findIndex(r=>r.k===art.key)+1];
      if(nx)setTimeout(()=>{const a=P.arts[nx.k];if(a.status==='empty'){S.sel=nx.k;genOutline(a,nx.from,nx.to,true)}},300)}});
}

function buildInteractive(eps,cfg,P){
  const c=P.arts.plan.data.cast;const nodes=[];let nid=0;const id=()=>'n'+(++nid);
  const cardEps=[P.cards.c1,P.cards.c2,P.cards.c3];const pov=cfg.pov==='first';
  const nm=s=>pov?s.replace(new RegExp(c.P,'g'),'你'):s;
  const every=cfg.density==='low'?3:1;const nopt=cfg.density==='high'?3:2;
  let col=0,rowY=0,rowH=0;let prev=[];
  const place=(n,dy=0)=>{n.x=col*190;n.y=rowY+dy;rowH=Math.max(rowH,dy+56)};
  const link=(ex,to)=>ex.forEach(e=>{e.node.to=to});
  eps.forEach((e,i)=>{
    if(i>0){rowY+=rowH+44;rowH=0}col=0;
    const sc={id:id(),type:'scene',ep:e.no,title:`第${e.no}集 · ${e.title}`,text:nm(`△ ${e.summary}\n${c.P}：${T.lines[e.no%T.lines.length]}\n△ ${e.hook}`),to:null,status:'ready'};place(sc);
    nodes.push(sc);link(prev,sc.id);prev=[{node:sc}];col++;
    if(cfg.paywall&&cardEps.includes(e.no)){const pw={id:id(),type:'paywall',ep:e.no,title:`${e.card||'卡点'} · 付费解锁`,text:'解锁后续剧情与隐藏分支',to:null,status:'ready'};place(pw);nodes.push(pw);link(prev,pw.id);prev=[{node:pw}];col++}
    if(i<eps.length-1&&i%every===0){
      const ch=T.choices[e.no%T.choices.length];
      const cn={id:id(),type:'choice',ep:e.no,title:nm(fill(ch.q,c)),text:pov?'你会怎么做？':`${c.P}会怎么做？`,options:[],timed:cfg.form==='qte'?8:0,status:'ready'};place(cn);
      nodes.push(cn);link(prev,cn.id);col++;prev=[];
      ch.o.slice(0,nopt).forEach((o,k)=>{const label=nm(fill(o[0],c));const ef=cfg.form==='branch'?{好感:o[1].好感||0}:o[1];
        const br={id:id(),type:'scene',ep:e.no,title:`分支 · ${label}`,text:nm(`△ ${c.P}选择${label}。`)+'\n'+(Object.entries(o[1]).map(([k2,v])=>`${k2}${v>0?'+':''}${v}`).join('，')||'局势暂时平静'),to:null,status:'ready'};place(br,k*70);
        cn.options.push({label,to:br.id,effects:ef,flag:o[2]||''});nodes.push(br);prev.push({node:br})});col++;
    }
  });
  rowY+=rowH+44;rowH=0;col=0;
  const E=cfg.converge==='merge'?1:clamp(cfg.endings,2,5);
  const defs=[['好结局',fill('{P}与{L}携手，{A}伏法。',c)],['坏结局',fill('{P}赢了复仇，却失去了{L}。',c)],['隐藏结局',fill('{X}的秘密揭开：一切早有安排。',c)],['事业结局',fill('{P}选择独自登顶。',c)],['真结局',fill('所有误会解开，{P}原谅了过去。',c)]].slice(0,E);
  const last=eps[eps.length-1].no;
  if(E===1){const en={id:id(),type:'ending',ep:last,title:'结局 · '+defs[0][0],text:nm(defs[0][1]),status:'ready'};place(en);nodes.push(en);link(prev,en.id)}
  else{const cd={id:id(),type:'condition',ep:last,title:'结局判定',text:'按数值与标记分流',rules:[],else:null,status:'ready'};place(cd);nodes.push(cd);link(prev,cd.id);col++;
    const ends=defs.map((d,k)=>{const en={id:id(),type:'ending',ep:last,title:'结局 · '+d[0],text:nm(d[1]),status:'ready'};place(en,k*70);nodes.push(en);return en});
    const rd=[{var:'好感',op:'>=',val:30},null,{flag:'trust'},{var:'实力',op:'>=',val:30},{var:'好感',op:'>=',val:50}];
    ends.forEach((en,k)=>{if(k!==1)cd.rules.push({...rd[k],to:en.id})});cd.rules.sort((a,b)=>(b.flag?1:0)-(a.flag?1:0));cd.else=ends[1].id}
  return{nodes,vars:cfg.form==='branch'?['好感']:['好感','实力'],start:nodes[0].id,cfg};
}
function convertToInteractive(srcKey,cfg){
  const P=S.project;const src=P.arts[srcKey];if(!cost(20))return;advanceStage('interactive');
  const label=`互动剧本 · ${src.label.replace('集纲','')}`;
  if(!P.ia[srcKey])P.ia[srcKey]=Object.assign(newArt('ia:'+srcKey,label,'interactive'),{src:srcKey,validate:{status:'unchecked'}});
  const a=P.ia[srcKey];a.cfg=cfg;S.sel='ia:'+srcKey;S.selNode=null;S.iaTab='canvas';VIEW.key=null;PL=null;
  const eps=src.data.eps.filter(e=>!e.placeholder);
  runTask(a,{steps:10,speed:160,cost:20,lines:['读取集纲…','找出关键冲突点…','设计选择点…','分配数值…','写分支剧情…','收束支线…','写结局…','排布节点…','打磨台词…','完成'],
    produce:()=>buildInteractive(eps,cfg,P),onDone:()=>validateIA(a,true)});
}
function edgesOf(n){if(n.type==='choice')return n.options.map(o=>o.to);if(n.type==='condition')return[...n.rules.map(r=>r.to),n.else];if(n.type==='ending')return[];return[n.to]}
function validateIA(a,silent){
  const d=a.data;if(!d)return;
  if(a.validate.status!=='unchecked')go('validate',a.validate,'unchecked',a.label);
  go('validate',a.validate,'checking',a.label);
  const by=Object.fromEntries(d.nodes.map(n=>[n.id,n]));const is=[];d.nodes.forEach(n=>n.flag='');
  const seen=new Set([d.start]);const q=[d.start];
  while(q.length){const n=by[q.shift()];if(!n)continue;for(const t of edgesOf(n))if(t&&by[t]&&!seen.has(t)){seen.add(t);q.push(t)}}
  d.nodes.forEach(n=>{if(!seen.has(n.id)){is.push({l:'e',id:n.id,m:`「${n.title}」从开头走不到这里`});n.flag='orphan'}});
  d.nodes.forEach(n=>{if(n.type==='ending')return;const es=edgesOf(n);if(!es.length||es.some(t=>!t||!by[t])){is.push({l:'e',id:n.id,m:`「${n.title}」${!es.length?'没有下一步':'有出口没指定目标'}`});n.flag='error'}});
  d.nodes.forEach(n=>{if(n.type==='choice'&&n.options.length<2){is.push({l:'w',id:n.id,m:`「${n.title}」只有 ${n.options.length} 个选项，算不上选择`});n.flag=n.flag||'warning'}});
  const maxv={};d.vars.forEach(v=>maxv[v]=0);const flags=new Set();
  d.nodes.forEach(n=>{if(n.type==='choice'&&seen.has(n.id)){d.vars.forEach(v=>maxv[v]+=Math.max(0,...n.options.map(o=>(o.effects||{})[v]||0)));n.options.forEach(o=>o.flag&&flags.add(o.flag))}});
  d.nodes.forEach(n=>{if(n.type!=='condition')return;n.rules.forEach(r=>{const en=by[r.to];
    if(r.var&&r.val>maxv[r.var]){is.push({l:'e',id:r.to,m:`「${en?.title}」要求${r.var}≥${r.val}，但全剧最多只能到 ${maxv[r.var]}`});if(en)en.flag='error'}
    if(r.flag&&!flags.has(r.flag)){is.push({l:'e',id:r.to,m:`「${en?.title}」需要的条件没有任何选项能触发`});if(en)en.flag='error'}})});
  const can=new Set(d.nodes.filter(n=>n.type==='ending').map(n=>n.id));let ch=true;
  while(ch){ch=false;d.nodes.forEach(n=>{if(!can.has(n.id)&&edgesOf(n).some(t=>can.has(t))){can.add(n.id);ch=true}})}
  d.nodes.forEach(n=>{if(seen.has(n.id)&&!can.has(n.id)&&!is.some(i=>i.id===n.id&&i.l==='e')){is.push({l:'e',id:n.id,m:`「${n.title}」之后怎么选都到不了结局`});n.flag='error'}});
  if(!d.nodes.some(n=>n.type==='ending'))is.push({l:'e',id:d.start,m:'剧本没有结局'});
  a.issues=is;a.maxv=maxv;
  const to=is.some(i=>i.l==='e')?'invalid':is.length?'warning':'valid';go('validate',a.validate,to,a.label);
  if(!silent)toast(to==='valid'?'结构检查通过':to==='warning'?`有 ${is.length} 条提醒`:`有 ${is.filter(i=>i.l==='e').length} 处需要修复`);
  save();
}
function iaChanged(a,node){if(node)node.status='edited';if(['ready','outdated'].includes(a.status))go('artifact',a,'edited',a.label);validateIA(a,true)}

function chipVal(k){
  const f=S.form;
  switch(k){
    case'eps':return{v:`${f.episodes}集`,set:true,plain:true};
    case'market':return f.market?{v:MARKETS.find(x=>x.k===f.market).name,set:true}:{v:'目标市场'};
    case'audience':return f.audience?{v:f.audience,set:true}:{v:'目标受众'};
    case'genre':return f.genres.length?{v:f.genres.join(' · '),set:true}:{v:'题材类型'};
    case'style':return f.styles.length?{v:f.styles.join(' · '),set:true}:{v:'风格元素'};
    case'setting':{const s=f.setting;const n=[s.role,s.cheat,s.world].filter(Boolean).length;return n?{v:`核心设定 · ${n}`,set:true}:{v:'核心设定'}}
    case'skill':return f.skills.length?{v:`Skill · ${f.skills.length}`,set:true}:{v:'Skill'};
  }
}
function chip(k){const c=chipVal(k);return`<button class="chip ${c.set&&!c.plain?'set':''}" data-pop="${k}" aria-haspopup="true">${c.plain?'':'<span class="star">✦</span>'}<span class="v">${esc(c.v)}</span>${c.plain?ic('down','i caret'):''}</button>`}
function canSend(){const f=S.form;if(S.mode==='original')return f.idea.trim().length>=15;if(S.mode==='novel')return f.novelText.trim().length>=20;return f.benchText.trim().length>=20}
function sendHint(){const f=S.form;if(S.mode==='original'){const n=f.idea.trim().length;return n&&n<15?`还差 ${15-n} 字`:''}return''}
function renderHome(){

  const P=S.project;
  return`<main class="home">
    <section class="intro"><h1>AI 互动短剧创作</h1><p>懂短剧节奏，懂付费卡点，懂互动分支<br>从一个想法，写到一部可以拍的互动影视剧本</p></section>
    <section class="composer">
      <div class="ctop">
        <div class="modes" role="tablist">
          <button class="${m==='original'?'on':''}" data-mode="original" role="tab" aria-selected="${m==='original'}">${ic('doc')}原创剧本</button>
          <button class="${m==='novel'?'on':''}" data-mode="novel" role="tab" aria-selected="${m==='novel'}">${ic('book')}小说改编</button>
          <button class="${m==='benchmark'?'on':''}" data-mode="benchmark" role="tab" aria-selected="${m==='benchmark'}">${ic('fire')}爆款对标<span class="badge">暂定</span></button>
        </div><span class="sp"></span>
        <button class="switch ${S.fine?'on':''}" data-act="fine" role="switch" aria-checked="${S.fine}"><span>精细生成</span><span class="tr"></span></button>
      </div>
      <div class="cinput">${file}<textarea id="mainInput" class="${S.fine?'':'tall'}" placeholder="${ph}" aria-label="输入">${esc(val)}</textarea></div>
      <div class="cbar">
        ${m==='novel'?`<label class="chip" for="novelFile">${ic('clip')}上传小说</label><input type="file" id="novelFile" accept=".txt,.md,text/plain" hidden><button class="chip" data-act="sampleNovel">示例小说</button>`:''}
        ${m==='benchmark'?`<label class="chip" for="benchFile">${ic('clip')}上传剧本</label><input type="file" id="benchFile" accept=".txt,.md,text/plain" hidden><button class="chip" data-act="sampleBench">示例爆款</button>`:''}
        ${chip('eps')}${chip('market')}${chip('genre')}${chip('style')}
        ${S.fine?chip('audience')+chip('setting')+chip('skill'):''}
        <span class="sp"></span><span class="credits"><i></i>${S.credits}</span>
        <button class="send" data-act="create" ${canSend()?'':'disabled'} aria-label="开始生成">${ic('up')}</button>
      </div>
      <div class="hint" id="hint">${sendHint()}</div>
    </section>
    ${m==='original'?`<section class="inspire"><h3>从爆款题材开始</h3><div class="ideas">${IDEAS.map((x,i)=>`<button data-idea="${i}"><span class="k">#${i+1}</span>${x[0]}</button>`).join('')}</div></section>`:''}
    ${P?`<section class="recent"><h3>我的剧本</h3><button class="projcard" data-act="open"><span class="cov">${esc((P.title||'新')[0])}</span><div><b>${esc(P.title||'未命名项目')}</b><div class="sm muted">${{original:'原创',novel:'小说改编',benchmark:'爆款对标'}[P.mode]} · ${P.params.episodes} 集 · 进行到${stageText(P)}</div></div><span class="sp"></span>${ic('arrow')}</button></section>`:''}
  </main>`;
}
function stageText(P){return{draft:'草稿',parsing:'解析',parse_failed:'解析',planning:'策划案',outlining:'集纲',interactive:'互动剧本',completed:'导出'}[P.stage]}

// 下拉面板
function closePop(){const p=$('#pop');p.hidden=true;p.innerHTML='';document.querySelectorAll('.chip.open').forEach(c=>c.classList.remove('open'));S.popKey=null}
function placePop(anchor){
  const p=$('#pop');p.hidden=false;const r=anchor.getBoundingClientRect();const pw=p.offsetWidth,ph=p.offsetHeight;
  const x=clamp(r.left,12,innerWidth-pw-12);let y=r.bottom+8;if(y+ph>innerHeight-12)y=Math.max(12,r.top-ph-8);
  p.style.left=x+'px';p.style.top=y+'px';
}
function openChipPop(anchor){
  const k=anchor.dataset.pop;const f=S.form;const p=$('#pop');
  if(S.popKey===k){closePop();return}
  closePop();S.popKey=k;anchor.classList.add('open');
  let h='';
  if(k==='eps')h=`<h5>总集数</h5><div class="opts">${EPS.map(n=>`<button data-v="${n}" class="${f.episodes===n?'on':''}"><span class="ck">${f.episodes===n?'✓':''}</span>${n} 集</button>`).join('')}</div>
    <div class="pfield"><label for="epsCustom">自定义（10–150）</label><input type="number" id="epsCustom" min="10" max="150" value="${f.episodes}"></div>`;
  if(k==='market')h=`<h5>目标市场<span class="sp"></span>影响人名、背景和语言</h5><div class="opts">${MARKETS.map(x=>`<button data-v="${x.k}" class="${f.market===x.k?'on':''}"><span class="ck">${f.market===x.k?'✓':''}</span>${x.name}<small>${x.sub}</small></button>`).join('')}</div>`;
  if(k==='audience')h=`<h5>目标受众</h5><div class="opts">${AUDIENCE.map(x=>`<button data-v="${x}" class="${f.audience===x?'on':''}"><span class="ck">${f.audience===x?'✓':''}</span>${x}</button>`).join('')}</div>`;
  if(k==='genre')h=`<h5>题材类型<span class="sp"></span>最多 3 个</h5><div class="tags">${GENRES.map(g=>`<button data-v="${g}" class="${f.genres.includes(g)?'on':''}">${g}</button>`).join('')}</div>`;
  if(k==='style')h=`<h5>风格元素</h5><div class="tags">${STYLES.map(g=>`<button data-v="${g}" class="${f.styles.includes(g)?'on':''}">${g}</button>`).join('')}</div>`;
  if(k==='setting')h=`<h5>核心设定（选填）</h5><div class="pfield"><label for="sRole">主角身份</label><input id="sRole" placeholder="例：隐藏身份的财团继承人" value="${esc(f.setting.role)}"></div>
    <div class="pfield"><label for="sCheat">金手指</label><input id="sCheat" placeholder="例：重生 / 读心术 / 系统" value="${esc(f.setting.cheat)}"></div>
    <div class="pfield"><label for="sWorld">世界观</label><select id="sWorld">${['','现代都市','古代宫廷','玄幻仙侠','末世废土','民国年代'].map(x=>`<option value="${x}" ${f.setting.world===x?'selected':''}>${x||'不限'}</option>`).join('')}</select></div>
    <div class="pfoot"><button class="btn pri" data-done>完成</button></div>`;
  if(k==='skill'){const all=[...BUILTIN_SKILLS.map(s=>({...s,b:1})),...S.userSkills];
    h=`<h5>挂载 Skill<span class="sp"></span>${f.skills.length}/5</h5><div class="opts">${all.map(s=>`<button data-v="${s.id}" class="${f.skills.includes(s.id)?'on':''}" ${s.status&&s.status!=='active'?'disabled':''}><span class="ck">${f.skills.includes(s.id)?'✓':''}</span>${esc(s.name)}<small>${s.b?esc(s.desc):s.status==='active'?'我上传的':ST_LABEL(s.status)}</small></button>`).join('')}</div>
    <div class="pfoot" style="justify-content:space-between"><label class="btn ghost" for="skillFile">${ic('plus')}上传我的 Skill</label><input type="file" id="skillFile" accept=".md,.txt" hidden><button class="btn pri" data-done>完成</button></div>`}
  p.innerHTML=h;placePop(anchor);
  const keep=()=>{S.keepPop=true;render()};
  p.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;
    if(k==='eps'){f.episodes=+v;render()}
    if(k==='market'){f.market=f.market===v?null:v;if(f.market)f.episodes=MARKETS.find(x=>x.k===v).eps;render()}
    if(k==='audience'){f.audience=f.audience===v?null:v;render()}
    if(k==='genre'){if(f.genres.includes(v))f.genres=f.genres.filter(x=>x!==v);else if(f.genres.length<3)f.genres.push(v);else{toast('题材最多选 3 个');return}keep()}
    if(k==='style'){f.styles=f.styles.includes(v)?f.styles.filter(x=>x!==v):[...f.styles,v];keep()}
    if(k==='skill'){if(f.skills.includes(v))f.skills=f.skills.filter(x=>x!==v);else if(f.skills.length<5)f.skills.push(v);else{toast('每次最多挂载 5 个 Skill');return}keep()}
  });
  const ec=$('#epsCustom');if(ec)ec.onchange=()=>{f.episodes=clamp(+ec.value||80,10,150);render()};
  if(k==='setting'){const u=()=>{f.setting.role=$('#sRole').value.trim();f.setting.cheat=$('#sCheat').value.trim();f.setting.world=$('#sWorld').value};['sRole','sCheat'].forEach(i=>$('#'+i).oninput=u);$('#sWorld').onchange=u}
  const dn=p.querySelector('[data-done]');if(dn)dn.onclick=()=>render();
  const sf=$('#skillFile');if(sf)sf.onchange=()=>{const file=sf.files[0];if(!file)return;const r=new FileReader();r.onload=()=>uploadSkill(file,String(r.result));r.readAsText(file)};
}
function uploadSkill(file,t){
  const f=S.form;const sk={id:'u'+Date.now(),name:file.name.replace(/\.\w+$/,''),desc:'',status:'uploading'};
  S.userSkills.push(sk);log(`[Skill] ${sk.name}: 上传中`);
  const refresh=()=>{if(S.view==='home'){const open=S.popKey==='skill';if(open)S.keepPop=true;render()}};refresh();
  setTimeout(()=>{go('skill',sk,'validating','Skill '+sk.name);refresh();
    setTimeout(()=>{if(t.trim().length<10||t.length>50000){go('skill',sk,'invalid','Skill '+sk.name);toast('这个 Skill 用不了：内容为空或超过 5 万字')}
      else{go('skill',sk,'active','Skill '+sk.name);if(f.skills.length<5)f.skills.push(sk.id);toast(`已添加 Skill「${sk.name}」`)}save();refresh()},800)},500);
}
document.addEventListener('pointerdown',e=>{const p=$('#pop');if(p.hidden)return;if(p.contains(e.target)||e.target.closest('[data-pop],[data-menu]'))return;closePop()});

addEventListener('resize',()=>closePop());

// ============ 项目页 ============
function navIcon(a){
  if(!a)return'';
  if(a.status==='generating')return'<span class="spin" aria-label="生成中"></span>';
  if(a.status==='outdated')return'<span class="dot amber" title="需要更新"></span>';
  if(a.status==='error')return'<span class="dot red" title="生成失败"></span>';
  if(a.status==='locked')return ic('lock');
  return'';
}
function navItem(k,label,a,right=''){return`<a class="${S.sel===k?'on':''} ${a&&a.status==='blocked'?'dim':''}" data-sel="${k}">${label}${right?`<span class="r">${right}</span>`:''}${navIcon(a)}</a>`}
function renderProject(){
  const P=S.project;if(!P){S.view='home';return renderHome()}
  let nav='<nav class="side">';
  if(P.mode!=='original')nav+=navItem('parse',P.mode==='novel'?'小说解析':'爆款拆解',null);
  nav+=navItem('plan','策划案',P.arts.plan);
  if(P.outlineMode){nav+='<h4>集纲</h4>';
    if(P.outlineMode==='all')nav+=navItem('all','全部集纲',P.arts.all,`1–${P.params.episodes}`);
    else segRanges(P).forEach(r=>nav+=navItem(r.k,r.label,P.arts[r.k],`${r.from}–${r.to}`))}
  if(Object.keys(P.ia).length){nav+='<h4>互动剧本</h4>';Object.values(P.ia).forEach(a=>nav+=navItem(a.key,a.label.replace('互动剧本 · ',''),a))}

function genHTML(a,title){const t=a.task||{progress:0};return`<div class="gen" id="gen-${a.key.replace(':','_')}"><div class="row"><span class="spin"></span><b>${title||'正在生成'+a.label}</b><span class="sp"></span><span class="mono sm muted gp">${t.progress}%</span><button class="btn ghost" data-cancel="${a.key}">取消</button></div>
  <div class="bar"><i style="width:${t.progress}%"></i></div><div class="line">${esc(t.line||'准备中…')}</div><div class="skel"><i style="width:92%"></i><i style="width:78%"></i><i style="width:85%"></i><i style="width:60%"></i></div></div>`}
function updateGen(a){const el=document.getElementById('gen-'+a.key.replace(':','_'));if(S.debug)renderDbg();if(!el)return;el.querySelector('.bar i').style.width=a.task.progress+'%';el.querySelector('.gp').textContent=a.task.progress+'%';el.querySelector('.line').textContent=a.task.line||''}
function notes(a){
  if(a.status==='error')return`<div class="note red">${ic('warn')}生成没有完成（${esc(a.task?.err||'网络异常')}），积分未扣除。<span class="sp"></span><button class="btn" data-retry="${a.key}">重新生成</button></div>`;
  if(a.status==='outdated')return`<div class="note amber">${ic('warn')}${esc(a.notice)}<span class="sp"></span><button class="btn" data-retry="${a.key}">重新生成</button><button class="btn ghost" data-ignore="${a.key}">保持不变</button></div>`;

function moreBtn(items){return`<button class="btn sq" data-menu="${esc(JSON.stringify(items))}" aria-label="更多操作">${ic('more')}</button>`}
function lockItem(a){return a.status==='locked'?['unlock:'+a.key,'解除定稿']:['lock:'+a.key,'定稿（防止误改）']}

function renderParse(){
  const P=S.project;

    <section class="sec"><h3>主线</h3><p>${esc(d.mainline)}</p></section>
    <section class="sec"><h3>主要人物</h3><div class="titles">${d.chars.map(x=>`<span>${esc(x)}</span>`).join('')}</div></section>
    <section class="sec"><h3>改编范围</h3><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--fg2)">第 <span class="stepper"><input type="number" id="rFrom" min="1" max="${d.chapters.length}" value="${d.range[0]}" aria-label="起始章"></span> 章到第 <span class="stepper"><input type="number" id="rTo" min="1" max="${d.chapters.length}" value="${d.range[1]}" aria-label="结束章"></span> 章</div>
      <ol style="margin:4px 0 0;padding-left:20px;color:var(--fg2)">${d.chapters.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></section>
    <section class="sec"><h3>改编力度</h3><div><div class="seg">${['忠于原著','适度改编','大幅重构'].map(x=>`<button class="${d.strength===x?'on':''}" data-strength="${x}">${x}</button>`).join('')}</div></div></section></div>`;
  const max=Math.max(...d.beats);
  return`<div class="doc"><div class="dh"><div><h2>爆款拆解</h2><div class="meta">识别出 3 个付费卡点和 4 种钩子手法</div></div>${pending?`<div class="acts"><button class="btn pri" data-act="toPlan">生成对标策划案 ${ic('arrow')}</button></div>`:''}</div>
    <section class="sec"><h3>爽点强度曲线</h3><svg viewBox="0 0 400 130" style="width:100%;height:auto;max-height:200px" role="img" aria-label="每 5 集的爽点强度">${d.beats.map((b,i)=>{const ci=[1,5,10].includes(i);return`<rect x="${i*20+2}" y="${110-b/max*100}" width="16" height="${b/max*100}" rx="2" fill="${ci?'var(--amber)':'var(--accent)'}" opacity="${ci?1:.45}"></rect>`}).join('')}<line x1="0" y1="110" x2="400" y2="110" stroke="var(--line2)"></line><text x="0" y="126" font-size="10" fill="var(--muted)">第 1 集</text><text x="400" y="126" font-size="10" fill="var(--muted)" text-anchor="end">第 100 集</text></svg>

function renderPlan(){

  if(a.status==='error')return`<div class="doc">${notes(a)}</div>`;

  const sec=(k,t,body)=>`<section class="sec"><h3>${t}${ro?'':`<button class="btn ghost sq regen" data-regen="${k}" aria-label="重新生成${t}" title="重新生成这一部分">${ic('refresh')}</button>`}</h3>${body}</section>`;

  return`<div class="doc">
    <div class="dh"><div><h2>${esc(d.title)}${ro?`<span class="lockmark">${ic('lock')}已定稿</span>`:''}</h2><div class="meta">${P.params.genres.join(' · ')} ｜ ${P.params.styles.join(' · ')} ｜ ${m.name} ｜ ${P.params.episodes} 集${d.skills.length?' ｜ Skill：'+d.skills.join('、'):''}</div></div>
      <div class="acts">${moreBtn([lockItem(a),['regenAll','全部重新生成']])}<button class="btn pri" data-act="outlineNext">${P.outlineMode?'查看集纲':'下一步：生成集纲'} ${ic('arrow')}</button></div></div>
    ${notes(a)}
    ${sec('title','剧名',`<div class="titles">${d.titles.map(t=>`<button class="${t===d.title?'on':''}" data-title="${esc(t)}" ${ro?'disabled':''}>${esc(t)}</button>`).join('')}</div><p ${ce} data-field="logline">${esc(d.logline)}</p>`)}

function drawCanvas(){
  const a=getArt(S.sel);const svg=$('#cv');if(!svg||!a||!a.data)return;const d=a.data;
  if(VIEW.key!==a.key)VIEW={x:24,y:24,k:0.85,key:a.key};

  d.nodes.forEach(n=>{const outs=n.type==='choice'?n.options.map(o=>[o.to,o.label]):n.type==='condition'?[...n.rules.map(r=>[r.to,r.flag?'隐藏':r.var+'≥'+r.val]),[n.else,'否则']]:n.type==='ending'?[]:[[n.to,'']];
    outs.forEach(([t,l])=>{const m=by[t];if(!m)return;const x1=n.x+W,y1=n.y+H/2,x2=m.x,y2=m.y+H/2;const back=x2<=x1;
      const p=back?`M${x1},${y1} C${x1+50},${y1} ${x2-50},${y2} ${x2},${y2}`:`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`;

      if(l&&!back)edges+=`<text x="${(x1+x2)/2}" y="${(y1+y2)/2-5}" font-size="10" text-anchor="middle" fill="#8A8E97">${esc(l.slice(0,9))}</text>`})});

      <circle cx="${n.x+14}" cy="${n.y+18}" r="4" fill="${nodeColor(n.type)}"></circle>
      <text x="${n.x+24}" y="${n.y+22}" font-size="10" fill="#8A8E97">EP${n.ep} · ${TYPE_CN[n.type]}${n.status==='edited'?' · 已改':''}</text>
      <text x="${n.x+12}" y="${n.y+42}" font-size="12" fill="#ECEDEF" font-weight="600">${esc(n.title.replace(/^第\d+集 · /,'').replace(/^分支 · /,'').slice(0,11))}</text></g>`}).join('');
  svg.innerHTML=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A4E56"></path></marker></defs><g id="vp" transform="translate(${VIEW.x},${VIEW.y}) scale(${VIEW.k})">${edges}${nodes}</g>`;

  const{total,c1,c2,c3,mode,adjust,auto}=MC;
  const segs=[['一卡','var(--accent)',1,c1,'c1'],['二卡','var(--blue)',c1+1,c2,'c2'],['三卡','var(--violet)',c2+1,c3,'c3']];

  const cardsUI=mode==='cards'?`<div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="lbl" style="margin:0">拖动圆点，设置每个卡点落在第几集</span><span class="sp"></span>
      <span class="sm muted">总集数</span><span class="stepper"><button data-tot="-5" aria-label="减少" ${adjust?'disabled':''}>−</button><input type="number" id="mTotal" value="${total}" ${adjust?'disabled':''} aria-label="总集数"><button data-tot="5" aria-label="增加" ${adjust?'disabled':''}>+</button></span></div>
    <div class="slider"><div class="track" id="track">
      ${segs.map(s=>`<div class="seg-c" style="left:${pct(s[2])}%;width:${pct(s[3])-pct(s[2])}%;background:${s[1]};opacity:.5"></div>`).join('')}
      ${segs.map(s=>`<div class="handle" id="h-${s[4]}" data-h="${s[4]}" role="slider" tabindex="0" aria-label="${s[0]}" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${MC[s[4]]}" style="left:${pct(MC[s[4]])}%"><span class="hl">${s[0]} · ${MC[s[4]]}</span></div>`).join('')}
    </div><div class="ticks"><span>第 1 集</span><span>第 ${total} 集</span></div></div>
    <div class="cardrow">${segs.map(s=>`<div><div class="t"><i class="sw" style="background:${s[1]}"></i>${s[0]}<span class="sp"></span><span class="stepper"><button data-stp="${s[4]}" data-d="-1" aria-label="${s[0]}前移一集">−</button><input type="number" value="${MC[s[4]]}" data-cin="${s[4]}" aria-label="${s[0]}所在集数"><button data-stp="${s[4]}" data-d="1" aria-label="${s[0]}后移一集">+</button></span></div><div class="r" data-rng="${s[4]}">第 ${s[2]}–${s[3]} 集 · ${s[3]-s[2]+1} 集</div></div>`).join('')}</div>
    <div class="sm muted" style="margin-top:8px" id="tail">${c3<total?`第 ${c3+1}–${total} 集是结局段，在三卡之后生成。`:'三卡就是最后一集。'}</div>
    <div class="err" id="cerr"></div></div>`:'';
  $('#modal').innerHTML=`<div class="mask"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><div><h3 id="mt">${adjust?'调整卡点':auto?'策划案写好了，接下来生成集纲':'生成集纲'}</h3><p>${adjust?'已生成的内容会按新卡点重新分段，受影响的段会提示更新。':'可以一次写完全部集数，也可以按付费卡点分段写、逐段精修。'}</p></div><span class="sp"></span><button class="iconbtn" data-m="close" aria-label="关闭">${ic('x')}</button></div>
    <div class="mb">
      ${adjust?'':`<div class="choose"><button class="${mode==='all'?'on':''}" data-m="all"><b>直接生成全部集纲</b><span>一次写完第 1–${total} 集</span></button><button class="${mode==='cards'?'on':''}" data-m="cards"><b>按卡点分段 <span class="badge">推荐</span></b><span>一卡 → 二卡 → 三卡，逐段生成</span></button></div>`}
      ${cardsUI}
    </div>
    <div class="mf"><button class="btn ghost" data-m="close">${auto?'稍后再说':'取消'}</button><button class="btn pri" data-m="go">${adjust?'应用':'开始生成'}</button></div></div></div>`;
  bindModal();
}
function setCard(k,v){
  const g=3,{total}=MC;const lo=k==='c1'?1:MC[k==='c2'?'c1':'c2']+g;const hi=k==='c3'?total:MC[k==='c1'?'c2':'c3']-g;const nv=clamp(Math.round(v),lo,hi);const er=$('#cerr');
  if(nv!==Math.round(v)){const h=$('#h-'+k);if(h){h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake')}if(er)er.textContent=`${{c1:'一卡',c2:'二卡',c3:'三卡'}[k]}只能放在第 ${lo}–${hi} 集（相邻卡点至少隔 3 集）`}else if(er)er.textContent='';
  MC[k]=nv;
}
function refreshSlider(){
  const{total}=MC;const pct=v=>(v-1)/(total-1)*100;const b=[[1,MC.c1],[MC.c1+1,MC.c2],[MC.c2+1,MC.c3]];
  ['c1','c2','c3'].forEach((k,i)=>{const h=$('#h-'+k);h.style.left=pct(MC[k])+'%';h.setAttribute('aria-valuenow',MC[k]);h.querySelector('.hl').textContent=`${['一卡','二卡','三卡'][i]} · ${MC[k]}`;
    const inp=document.querySelector(`[data-cin="${k}"]`);if(inp&&document.activeElement!==inp)inp.value=MC[k];
    const rg=document.querySelector(`[data-rng="${k}"]`);if(rg)rg.textContent=`第 ${b[i][0]}–${b[i][1]} 集 · ${b[i][1]-b[i][0]+1} 集`});
  $('#track').querySelectorAll('.seg-c').forEach((s,i)=>{s.style.left=pct(b[i][0])+'%';s.style.width=(pct(b[i][1])-pct(b[i][0]))+'%'});
  const t=$('#tail');if(t)t.textContent=MC.c3<total?`第 ${MC.c3+1}–${total} 集是结局段，在三卡之后生成。`:'三卡就是最后一集。';
}
function bindModal(){
  const M=$('#modal');
  M.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const v=b.dataset.m;if(v==='close')return closeModal();if(v==='all'||v==='cards'){MC.mode=v;return drawOutlineModal()}applyOutlineModal()});
  const tr=$('#track');if(!tr)return;
  const setTotal=n=>{n=clamp(n,10,150);const r=n/MC.total;MC.total=n;MC.c1=Math.round(MC.c1*r);MC.c2=Math.round(MC.c2*r);MC.c3=Math.round(MC.c3*r);MC.c3=clamp(MC.c3,7,n);MC.c2=clamp(MC.c2,4,MC.c3-3);MC.c1=clamp(MC.c1,1,MC.c2-3);drawOutlineModal()};
  const tot=$('#mTotal');if(tot&&!tot.disabled){tot.onchange=()=>setTotal(+tot.value||80);M.querySelectorAll('[data-tot]').forEach(b=>b.onclick=()=>setTotal(MC.total+(+b.dataset.tot)))}
  M.querySelectorAll('[data-h]').forEach(h=>{const k=h.dataset.h;
    h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);h.onpointermove=ev=>{const r=tr.getBoundingClientRect();setCard(k,1+clamp(ev.clientX-r.left,0,r.width)/r.width*(MC.total-1));refreshSlider()};h.onpointerup=()=>{h.onpointermove=null}};
    h.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setCard(k,MC[k]+(e.key==='ArrowRight'?1:-1));refreshSlider()}}});
  M.querySelectorAll('[data-stp]').forEach(b=>b.onclick=()=>{setCard(b.dataset.stp,MC[b.dataset.stp]+(+b.dataset.d));refreshSlider()});
  M.querySelectorAll('[data-cin]').forEach(i=>i.onchange=()=>{setCard(i.dataset.cin,+i.value);refreshSlider();i.value=MC[i.dataset.cin]});
}
function applyOutlineModal(){
  const P=S.project;const{c1,c2,c3,total,mode,adjust}=MC;
  if(!adjust&&!P.outlineMode){P.params.episodes=total;P.cards={c1,c2,c3};log(`集纲方式：${mode==='all'?'全部':'分卡点'}（一卡 ${c1} / 二卡 ${c2} / 三卡 ${c3}）`);closeModal();startOutline(mode);return}
  if(P.outlineMode==='all'&&mode==='cards'){splitAll({c1,c2,c3});closeModal();save();render();return}
  if(P.outlineMode==='all'){closeModal();return}
  const old=segRanges(P);const nc={c1,c2,c3};const neu=segRanges({...P,cards:nc});
  const changed=neu.filter(r=>{const o=old.find(x=>x.k===r.k);return!o||o.from!==r.from||o.to!==r.to}).map(r=>r.k);
  const locked=old.filter(r=>P.arts[r.k]?.status==='locked'&&changed.includes(r.k));
  if(locked.length){$('#cerr').textContent=`「${locked.map(r=>r.label).join('、')}」已定稿，先解除定稿再调整`;return}
  if(!changed.length){closeModal();return}
  const pool={};old.forEach(r=>(P.arts[r.k]?.data?.eps||[]).forEach(e=>pool[e.no]=e));
  const ctx={...outlineCtx(),cards:nc};P.cards=nc;log(`调整卡点 → ${c1} / ${c2} / ${c3}`);
  const first=neu.findIndex(r=>changed.includes(r.k));
  neu.forEach((r,i)=>{let a=P.arts[r.k];if(!a){const pv=i>0&&P.arts[neu[i-1].k];a=P.arts[r.k]=newArt(r.k,r.label+'集纲','segment',i===0||(pv&&['ready','edited','locked'].includes(pv.status))?'empty':'blocked')}
    if(i<first||!a.data)return;
    const eps=[];for(let n=r.from;n<=r.to;n++){const g=genEpisode(n,ctx);const e=pool[n]?{...pool[n]}:{...g,placeholder:true};e.card=g.card;if(g.card&&!pool[n]?.card)e.hook=g.hook;eps.push(e)}
    a.data={from:r.from,to:r.to,eps};
    if(['ready','edited'].includes(a.status)){go('artifact',a,'outdated',a.label);a.notice=`卡点调整后，这一段变成第 ${r.from}–${r.to} 集${eps.some(e=>e.placeholder)?'，新增的集还需要补写':''}`}
    propagate(r.k)});
  if(c3>=P.params.episodes&&P.arts.end)delete P.arts.end;
  closeModal();save();render();toast('卡点已更新');
}
function splitAll(nc){
  const P=S.project;const all=P.arts.all;P.cards=nc;P.outlineMode='cards';const ctx={...outlineCtx(),cards:nc};
  segRanges(P).forEach(r=>{const a=newArt(r.k,r.label+'集纲','segment',all.data?(all.status==='locked'?'ready':all.status):'empty');
    if(all.data)a.data={from:r.from,to:r.to,eps:all.data.eps.filter(e=>e.no>=r.from&&e.no<=r.to).map(e=>({...e,card:genEpisode(e.no,ctx).card}))};a.versions=all.versions;P.arts[r.k]=a});
  Object.values(P.ia).forEach(x=>{if(x.src==='all')x.src='c1'});
  delete P.arts.all;S.sel='c1';log('全部集纲 → 按卡点拆分（不重新生成）');toast('已按卡点拆分');
}
function mergeToAll(){
  const P=S.project;const segs=segRanges(P);const eps=[];
  segs.forEach(r=>{const a=P.arts[r.k];if(a.data)eps.push(...a.data.eps);else for(let n=r.from;n<=r.to;n++)eps.push({...genEpisode(n,outlineCtx()),placeholder:true})});
  const sts=segs.map(r=>P.arts[r.k].status);const a=newArt('all','全部集纲','outline',sts.every(s=>['ready','edited','locked'].includes(s))?(sts.includes('edited')?'edited':'ready'):'outdated');
  a.data={from:1,to:P.params.episodes,eps};a.versions=1;if(a.status==='outdated')a.notice='还有几段没生成，先用占位补齐了';
  segs.forEach(r=>delete P.arts[r.k]);P.arts.all=a;P.outlineMode='all';S.sel='all';
  Object.values(P.ia).forEach(x=>{if(['c1','c2','c3','end'].includes(x.src))x.src='all'});
  log('卡点段 → 合并为全部集纲');save();render();toast('已合并为全部集纲');
}

function openExport(a){
  if(a.validate.status==='unchecked')validateIA(a,true);
  const vs=a.validate.status;
  const json=JSON.stringify({title:S.project.title,source:a.label,config:a.cfg,variables:a.data.vars,start:a.data.start,nodes:a.data.nodes.map(({x,y,flag,...n})=>n)},null,2);
  const csv=['节点ID,类型,集,标题,下一步'].concat(a.data.nodes.map(n=>[n.id,TYPE_CN[n.type],n.ep,`"${n.title}"`,`"${edgesOf(n).join('|')}"`].join(','))).join('\n');
  let tab='json';
  const draw=ok=>{const bad=vs==='invalid',warn=vs==='warning'&&!ok;
    $('#modal').innerHTML=`<div class="mask"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="et"><div class="mh"><div><h3 id="et">导出互动剧本</h3><p>JSON 给播放器或引擎用，分支表方便编剧和制片核对。</p></div><span class="sp"></span><button class="iconbtn" data-x aria-label="关闭">${ic('x')}</button></div>
      <div class="mb">${bad?`<div class="note red">${ic('warn')}还有 ${a.issues.filter(i=>i.l==='e').length} 处结构问题，修好后才能导出。<span class="sp"></span><button class="btn" data-fix>去修复</button></div>`:
      warn?`<div class="note amber">${ic('warn')}有 ${a.issues.length} 条提醒，不影响导出。<span class="sp"></span><button class="btn" data-ok>仍然导出</button></div>`:
      `<div><div class="seg"><button class="${tab==='json'?'on':''}" data-t="json">互动剧本 JSON</button><button class="${tab==='csv'?'on':''}" data-t="csv">分支表 CSV</button></div></div>
      <textarea id="exportText" readonly aria-label="导出内容" style="width:100%;min-height:320px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg2);color:var(--fg2)">${esc(tab==='json'?json:csv)}</textarea>`}</div>
      <div class="mf"><span class="sm muted" style="margin-right:auto">演示环境不能直接下载，请复制内容</span><button class="btn ghost" data-x>关闭</button>${!bad&&!warn?'<button class="btn pri" data-copy>复制</button>':''}</div></div></div>`;
    const M=$('#modal');M.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
    const o=M.querySelector('[data-ok]');if(o)o.onclick=()=>draw(true);
    const fx=M.querySelector('[data-fix]');if(fx)fx.onclick=()=>{closeModal();S.iaTab='canvas';S.selNode=null;renderMain()};
    M.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw(true)});
    const cp=M.querySelector('[data-copy]');if(cp)cp.onclick=()=>{const t=$('#exportText');navigator.clipboard.writeText(t.value).then(()=>toast('已复制')).catch(()=>{t.select();toast('已选中，按 Ctrl/⌘ + C 复制')});log(`导出 ${a.label}（${tab}）`);advanceStage('completed');save()}};
  draw(false);
}

// ============ 事件 ============
function bind(){
  const A=$('#app');
  A.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
  A.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>stepGo(b.dataset.step));
  if(S.view==='home')bindHome();else{bindMain();A.querySelectorAll('.side [data-sel]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.sel;S.selNode=null;render()})}
}
function stepGo(k){
  const P=S.project;
  if(k==='plan')S.sel=P.arts.plan.status==='empty'&&P.mode!=='original'?'parse':'plan';
  if(k==='outline'){const o=['all','c1','c2','c3','end'].find(x=>P.arts[x]);if(o)S.sel=o;else if(has(P.arts.plan)){openOutlineModal(false);return}else{toast('先完成策划案');return}}
  if(k==='ia'){const i=Object.keys(P.ia)[0];if(i)S.sel='ia:'+i;else{toast('在集纲页点「转互动剧本」就能生成');return}}
  if(k==='done'){const i=Object.values(P.ia).find(has);if(i){S.sel=i.key;render();openExport(i);return}toast('先生成互动剧本');return}
  S.selNode=null;render();
}
function bindHome(){
  const A=$('#app');const f=S.form;
  A.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;render()});
  A.querySelectorAll('[data-pop]').forEach(b=>b.onclick=()=>openChipPop(b));
  A.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>{f.idea=IDEAS[+b.dataset.idea][1];render();const t=$('#mainInput');t.focus();t.setSelectionRange(t.value.length,t.value.length)});
  const t=$('#mainInput');
  t.oninput=()=>{if(S.mode==='original')f.idea=t.value;else if(S.mode==='novel'){f.novelText=t.value;if(!f.novelName&&t.value.trim())f.novelName='粘贴的小说'}else f.benchText=t.value;
    A.querySelector('[data-act=create]').disabled=!canSend();$('#hint').textContent=sendHint()};
  t.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&canSend())act('create')};
  const rf=(id,cb)=>{const el=document.getElementById(id);if(el)el.onchange=()=>{const file=el.files[0];if(!file)return;const r=new FileReader();r.onload=()=>cb(file,String(r.result));r.readAsText(file)}};
  rf('novelFile',(file,txt)=>{f.novelName=file.name.replace(/\.\w+$/,'');f.novelText=txt;render()});
  rf('benchFile',(file,txt)=>{f.benchText=txt;render()});
}
function bindMain(){
  const M=$('#main');if(!M)return;const P=S.project;
  M.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
  M.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>openMenu(b));
  M.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.sel;render()});
  M.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelTask(getArt(b.dataset.cancel)));
  M.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>regen(b.dataset.retry));
  M.querySelectorAll('[data-ignore]').forEach(b=>b.onclick=()=>{const a=getArt(b.dataset.ignore);go('artifact',a,'edited',a.label);a.notice='';save();render()});
  M.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>unlock(b.dataset.unlock));
  M.querySelectorAll('[data-genseg]').forEach(b=>b.onclick=()=>{const r=segRanges(P).find(x=>x.k===b.dataset.genseg);genOutline(P.arts[r.k],r.from,r.to)});
  M.querySelectorAll('[data-genchain]').forEach(b=>b.onclick=()=>{const r=segRanges(P).find(x=>x.k===b.dataset.genchain);genOutline(P.arts[r.k],r.from,r.to,true)});
  if(S.sel==='plan'&&P.arts.plan.data){const a=P.arts.plan,d=a.data;
    M.querySelectorAll('[data-field]').forEach(el=>el.onblur=()=>{const v=el.innerText.trim();if(v!==d[el.dataset.field]){d[el.dataset.field]=v;markEdited(a);render()}});
    M.querySelectorAll('[data-char]').forEach(el=>el.onblur=()=>{const c=d.chars[+el.dataset.char];const v=el.innerText.trim();if(v!==c.d){c.d=v;markEdited(a);render()}});
    M.querySelectorAll('[data-title]').forEach(b=>b.onclick=()=>{d.title=b.dataset.title;P.title=d.title;markEdited(a);render()});
    M.querySelectorAll('[data-regen]').forEach(b=>b.onclick=()=>{const k=b.dataset.regen;if(!cost(2))return;const fr=genPlan(P.params,P);
      if(k==='title')d.titles=[...new Set([...fr.titles.slice(1),...T.titles._])].slice(0,3);else if(k==='chars')d.chars=fr.chars;else d[k]=fr[k];
      S.credits-=2;a.versions++;log(`局部重新生成：${k}`);markEdited(a);render();toast('已重新生成这一部分')})}
  const oa=P.arts[S.sel];if(oa&&oa.data&&oa.data.eps)M.querySelectorAll('[data-ep]').forEach(el=>el.onblur=()=>{const e=oa.data.eps[+el.dataset.ep];const v=el.innerText.trim();if(v!==e[el.dataset.k]){e[el.dataset.k]=v;e.placeholder=false;markEdited(oa);render()}});
  M.querySelectorAll('[data-strength]').forEach(b=>b.onclick=()=>{P.parsed.strength=b.dataset.strength;render()});
  M.querySelectorAll('[data-bdir]').forEach(b=>b.onclick=()=>{P.benchDir=b.dataset.bdir;render()});
  ['rFrom','rTo'].forEach((id,i)=>{const el=document.getElementById(id);if(el)el.onchange=()=>{P.parsed.range[i]=+el.value}});
  if(S.sel.startsWith('ia:')){const a=getArt(S.sel);
    M.querySelectorAll('[data-iatab]').forEach(b=>b.onclick=()=>{S.iaTab=b.dataset.iatab;renderMain()});
    M.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoom(+b.dataset.zoom));
    M.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{S.selNode=b.dataset.goto;S.iaTab='canvas';const n=a.data.nodes.find(x=>x.id===S.selNode);const svg=$('#cv');if(n&&svg){VIEW.x=svg.clientWidth/2-(n.x+75)*VIEW.k;VIEW.y=svg.clientHeight/2-(n.y+28)*VIEW.k}renderMain()});
    if(a&&a.data){bindInspector(a);bindPlay(a)}}
}
function bindInspector(a){
  const n=a.data.nodes.find(x=>x.id===S.selNode);if(!n)return;const M=$('#main');const ch=()=>{iaChanged(a,n);renderMain()};
  const t=$('#nTitle'),x=$('#nText');if(t)t.onchange=()=>{n.title=t.value;ch()};if(x)x.onchange=()=>{n.text=x.value;ch()};
  M.querySelectorAll('[data-nto]').forEach(s=>s.onchange=()=>{n.to=s.value||null;ch()});
  M.querySelectorAll('[data-olabel]').forEach(i=>i.onchange=()=>{n.options[+i.dataset.olabel].label=i.value;ch()});
  M.querySelectorAll('[data-oto]').forEach(s=>s.onchange=()=>{n.options[+s.dataset.oto].to=s.value||null;ch()});
  M.querySelectorAll('[data-oeff]').forEach(i=>i.onchange=()=>{const o=n.options[+i.dataset.oeff];o.effects=o.effects||{};o.effects[i.dataset.var]=+i.value||0;ch()});
  M.querySelectorAll('[data-odel]').forEach(b=>b.onclick=()=>{n.options.splice(+b.dataset.odel,1);ch()});
  M.querySelectorAll('[data-rval]').forEach(i=>i.onchange=()=>{n.rules[+i.dataset.rval].val=+i.value||0;ch()});
}
function bindPlay(a){
  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{const v=b.dataset.play;
    if(v==='restart'){PL=null;return renderMain()}
    if(b.dataset.opt!=null){const n=a.data.nodes.find(x=>x.id===PL.cur);const o=n.options[+b.dataset.opt];Object.entries(o.effects||{}).forEach(([k,val])=>PL.vars[k]=(PL.vars[k]||0)+val);if(o.flag&&!PL.flags.includes(o.flag))PL.flags.push(o.flag)}
    PL.cur=v;PL.steps++;renderMain()});
}
function regen(k){
  const P=S.project;const a=getArt(k);
  if(k==='plan'){if(!cost(10))return;runTask(a,{steps:8,cost:10,lines:['重新理解创意…','调整人物…','重排冲突…','整理策划案…'],produce:()=>genPlan(P.params,P),onDone:x=>{P.title=x.data.title;propagate('plan')}});return}
  if(k.startsWith('ia:')){convertToInteractive(a.src,a.cfg);return}
  const r=k==='all'?{from:1,to:P.params.episodes}:segRanges(P).find(x=>x.k===k);const old=a.data;genOutline(a,r.from,r.to);
  const iv=setInterval(()=>{if(a.status!=='generating'){clearInterval(iv);if(a.data!==old){propagate(k);save();render()}}},200);
}
function act(x){
  const P=S.project;
  switch(x){
    case'home':S.view='home';render();break;
    case'open':S.view='project';render();break;
    case'fine':S.fine=!S.fine;render();break;
    case'sampleNovel':S.form.novelText=SAMPLE_NOVEL;S.form.novelName='重生之千金归来';render();break;
    case'sampleBench':S.form.benchText=SAMPLE_BENCH;render();break;
    case'clearNovel':S.form.novelText='';S.form.novelName='';render();break;
    case'create':if(!canSend())return;Object.values(timers).forEach(clearInterval);PL=null;VIEW.key=null;createProject();break;
    case'reparse':{const o={status:'parse_failed'};go('project',o,'parsing','项目');P.stage='parsing';P.parseState='parsing';render();setTimeout(doParse,900);break}
    case'toPlan':startPlan();break;
    case'outlineNext':if(P.outlineMode){S.sel=P.outlineMode==='all'?'all':'c1';render()}else openOutlineModal(false);break;
    case'toIA':openIAModal(S.sel);break;
    case'showIssues':S.iaTab='canvas';S.selNode=null;renderMain();break;
    case'export':openExport(getArt(S.sel));break;
    case'fit':fit();break;
    case'deselect':S.selNode=null;renderMain();break;
    case'addOpt':{const a=getArt(S.sel);const n=a.data.nodes.find(x=>x.id===S.selNode);n.options.push({label:'新选项',to:null,effects:{}});iaChanged(a,n);renderMain();break}
    case'delNode':{const a=getArt(S.sel);a.data.nodes=a.data.nodes.filter(x=>x.id!==S.selNode);S.selNode=null;iaChanged(a);renderMain();toast('已删除节点');break}
    case'expand':{const a=getArt(S.sel);const n=a.data.nodes.find(x=>x.id===S.selNode);const c=P.arts.plan.data.cast;n.text+=`\n△ 镜头推近，${c.A}的表情一点点僵住。\n${c.L}（低声）：“我早就知道会是这样。”`;iaChanged(a,n);renderMain();toast('已扩写');break}
    case'reset':try{localStorage.removeItem('drama-demo-v2')}catch(e){}Object.values(timers).forEach(clearInterval);S.project=null;S.log=[];S.view='home';S.credits=120;PL=null;closeModal();render();break;
  }
}
load();
if(location.hash==='#debug')S.debug=true;
if(S.project){const fix=a=>{if(a&&a.status==='generating'){a.status=a.data?(a.prev||'ready'):'error';if(a.task){a.task.status='failed';a.task.err='页面刷新，生成中断'}}};Object.values(S.project.arts).forEach(fix);Object.values(S.project.ia||{}).forEach(fix);if(S.project.parseState==='parsing'){S.project.parseState='parse_failed';S.project.parseErr='页面刷新，解析中断'}}
render();
})();
</script>

</body></html>
