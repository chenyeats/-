<title>互动短剧剧本工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 布局：首页=居中创作台；项目=左侧导航 + 中间文档区 + 右侧状态机抽屉。场记板式的冷灰底 + 墨绿主色 + 琥珀色标付费卡点 */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#E8ECEA; --line:#D3DAD7; --fg:#18201E; --muted:#5D6A66;
  --accent:#0E6B5C; --accent-soft:#D7EDE8; --on-accent:#FFFFFF;
  --amber:#B8730A; --amber-soft:#FBEBD0; --red:#B3372F; --red-soft:#F8DEDB; --blue:#2C5FA8; --blue-soft:#DCE6F5;
  --violet:#5B4B9A; --violet-soft:#E6E1F5; --green:#2F7D3A; --green-soft:#DDF0DF;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(20,30,28,.06),0 6px 20px rgba(20,30,28,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211F; --sunk:#0D1311; --line:#2C3835; --fg:#E4ECE9; --muted:#93A39E;
  --accent:#4FC1A9; --accent-soft:#163B33; --on-accent:#08201B;
  --amber:#E6A740; --amber-soft:#3A2B10; --red:#EE7A70; --red-soft:#3D1D1A; --blue:#82AEEA; --blue-soft:#1A2A42;
  --violet:#B3A5EC; --violet-soft:#2A2445; --green:#7CCB86; --green-soft:#1B3320;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211F; --sunk:#0D1311; --line:#2C3835; --fg:#E4ECE9; --muted:#93A39E;
  --accent:#4FC1A9; --accent-soft:#163B33; --on-accent:#08201B;
  --amber:#E6A740; --amber-soft:#3A2B10; --red:#EE7A70; --red-soft:#3D1D1A; --blue:#82AEEA; --blue-soft:#1A2A42;
  --violet:#B3A5EC; --violet-soft:#2A2445; --green:#7CCB86; --green-soft:#1B3320;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* 顶栏 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .slate{width:22px;height:18px;border-radius:3px;background:var(--fg);position:relative;overflow:hidden}
.brand .slate::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(-45deg,var(--fg) 0 4px,var(--surface) 4px 8px)}
.top .crumb{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lg{padding:10px 20px;font-size:15px}

/* 状态药丸 */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-empty{background:var(--sunk);color:var(--muted)}
.st-blocked{background:var(--sunk);color:var(--muted)}
.st-generating,.st-running,.st-queued,.st-parsing,.st-checking,.st-uploading,.st-validating{background:var(--blue-soft);color:var(--blue)}
.st-generating::before,.st-running::before,.st-parsing::before,.st-checking::before{animation:blink 1s infinite}
.st-ready,.st-succeeded,.st-valid,.st-active{background:var(--green-soft);color:var(--green)}
.st-edited{background:var(--accent-soft);color:var(--accent)}
.st-outdated,.st-warning,.st-partial{background:var(--amber-soft);color:var(--amber)}
.st-locked{background:var(--fg);color:var(--bg)}
.st-error,.st-failed,.st-invalid,.st-parse_failed{background:var(--red-soft);color:var(--red)}
.st-cancelled,.st-unchecked,.st-draft,.st-disabled{background:var(--sunk);color:var(--muted)}
.st-planning,.st-outlining,.st-interactive,.st-completed{background:var(--accent-soft);color:var(--accent)}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 首页 */
.home{max-width:920px;margin:0 auto;padding-inline:16px;padding-block:32px 64px;display:grid;gap:20px}
.hero h1{font-size:clamp(24px,4vw,34px);font-weight:800}
.hero p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.modetabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.modetabs button{flex:1;min-width:120px;border:0;background:transparent;padding:14px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.modetabs button small{font-weight:400;font-size:11px}
.modetabs button.on{color:var(--fg);border-bottom-color:var(--accent);background:var(--bg)}
.tag{font-size:10px;padding:0 6px;border-radius:4px;background:var(--amber-soft);color:var(--amber);font-weight:600;margin-left:4px}
.cbody{padding:18px;display:grid;gap:16px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:6px;display:block}
textarea.idea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
select,input[type=number],input[type=text]{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);min-width:0}
.fine{border-top:1px dashed var(--line);padding-top:16px;display:grid;gap:16px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.skill{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;background:var(--surface);text-align:left}
.skill.on{border-color:var(--accent);background:var(--accent-soft)}
.skill b{font-size:13px;display:block}
.skill span{font-size:11px;color:var(--muted)}
.skill .box{width:16px;height:16px;border:1.5px solid var(--line);border-radius:4px;flex:none;margin-top:2px;display:grid;place-items:center;font-size:11px}
.skill.on .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cfoot{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.pipeline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.pipeline b{color:var(--fg);font-weight:600}
.pipeline .hl{color:var(--accent)}
.recent{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;background:var(--bg)}

/* 项目工作台 */
.ws{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 53px)}
.ws.withsm{grid-template-columns:232px minmax(0,1fr) 320px}
.nav{border-right:1px solid var(--line);background:var(--surface);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.nav h4{font-size:11px;color:var(--muted);letter-spacing:.08em;margin:12px 8px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--fg);text-decoration:none;font-size:13px}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-soft);font-weight:600}
.nav a .pill{margin-left:auto}
.nav a .ep{font-size:11px;color:var(--muted)}
.nav a.sub{padding-left:22px}
.main{padding:20px 24px 64px;min-width:0}
.doc{max-width:900px;display:grid;gap:16px}
.dochead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dochead h2{font-size:22px;font-weight:800}
.dochead .sp{flex:1}
.banner{border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner.warn{background:var(--amber-soft);color:var(--amber)}
.banner.info{background:var(--blue-soft);color:var(--blue)}
.banner.err{background:var(--red-soft);color:var(--red)}
.banner .sp{flex:1}
.banner .btn{background:var(--surface);color:var(--fg)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.block h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.block h3 .sp{flex:1}
.block h3 .btn{font-family:var(--f-body);font-weight:400}
[contenteditable]{outline:none;border-radius:4px}
[contenteditable]:hover{background:var(--bg)}
[contenteditable]:focus{background:var(--bg);box-shadow:0 0 0 1px var(--accent)}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.char{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.char b{font-family:var(--f-display);font-size:15px}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);transition:width .2s}
.genbox{display:grid;gap:10px;padding:18px;border:1px solid var(--blue-soft);background:var(--surface);border-radius:10px}
.stream{font-family:var(--f-mono);font-size:12px;color:var(--muted);max-height:120px;overflow:hidden;white-space:pre-wrap}
.empty{padding:40px 20px;text-align:center;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);display:grid;gap:12px;justify-items:center}

/* 集纲 */
.eps{display:grid;gap:8px}
.epcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 12px}
.epcard.card{border-color:var(--amber);background:linear-gradient(90deg,var(--amber-soft),var(--surface) 30%)}
.epcard .no{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--muted);grid-row:span 3}
.epcard .no b{display:block;font-size:20px;color:var(--fg)}
.epcard .t{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.epcard .hook{font-size:12px;color:var(--muted)}
.epcard .hook::before{content:"钩子 ";font-weight:700;color:var(--accent)}
.epcard.card .hook::before{content:"卡点钩子 ";color:var(--amber)}
.epcard.ph{opacity:.6;border-style:dashed}
.cardmark{font-size:10px;font-weight:700;background:var(--amber);color:var(--surface);padding:0 6px;border-radius:4px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;display:grid}
.modal.wide{width:min(880px,100%)}
.mhead{padding:16px 20px 0;display:flex;align-items:center;gap:8px}
.mhead h3{font-size:18px}
.mhead .sp{flex:1}
.mbody{padding:16px 20px;display:grid;gap:14px}
.mfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;cursor:pointer;text-align:left;background:var(--surface);width:100%}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px}
.opt.on .radio{border:5px solid var(--accent)}
.opt b{display:block}
.opt span{font-size:12px;color:var(--muted)}

/* 卡点滑轨 */
.slider{padding:28px 14px 34px;user-select:none;touch-action:none}
.track{position:relative;height:10px;border-radius:5px;background:var(--sunk)}
.track .segc{position:absolute;top:0;bottom:0}
.handle{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--surface);border:3px solid var(--amber);box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:grab;touch-action:none}
.handle:active{cursor:grabbing}
.handle.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.handle .hl{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap;background:var(--amber);color:var(--surface);padding:1px 6px;border-radius:4px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:10px;font-family:var(--f-mono)}
.cardctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cardctl>div{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:4px;justify-items:center}
.cardctl .stp{display:flex;gap:4px;align-items:center}
.cardctl .stp button{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.cardctl input{width:56px;text-align:center}
.segtable{width:100%;border-collapse:collapse;font-size:13px}
.segtable td,.segtable th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.segtable th{font-size:11px;color:var(--muted);font-weight:600}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.errline{color:var(--red);font-size:12px;min-height:18px}

/* 互动剧本 */
.iabar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iawrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.canvas{position:relative;height:560px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px}
.canvas svg{width:100%;height:100%;cursor:grab;display:block}
.canvas svg.drag{cursor:grabbing}
.cvtools{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.legend{position:absolute;left:8px;bottom:8px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;background:var(--surface);padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.side{display:grid;gap:12px;align-content:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.panel h4{margin:0;font-size:13px;display:flex;align-items:center;gap:8px}
.panel h4 .sp{flex:1}
.issue{font-size:12px;padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:6px}
.issue.e{background:var(--red-soft);color:var(--red)}
.issue.w{background:var(--amber-soft);color:var(--amber)}
.field{display:grid;gap:4px}
.field label{font-size:11px;color:var(--muted);font-weight:600}
.field textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:80px;resize:vertical;background:var(--bg)}
.optrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;padding:6px;border:1px solid var(--line);border-radius:6px}
.optrow .r2{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px}
.optrow input[type=number]{width:56px;padding:2px 4px}
.optrow select{max-width:140px;padding:2px 4px;font-size:12px}
.script{display:grid;gap:10px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.sc .h{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sc .choice{margin-top:8px;border-left:3px solid var(--accent);padding-left:10px;display:grid;gap:4px;font-size:13px}
.play{max-width:560px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:20px;display:grid;gap:14px;min-height:420px;align-content:start}
.play .screen{aspect-ratio:9/12;max-width:100%;border-radius:10px;background:linear-gradient(160deg,#2a3431,#0d1312);color:#E8EFEC;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;font-size:15px;line-height:1.7}
.play .screen .ep{font-family:var(--f-mono);font-size:11px;opacity:.7}
.play .vars{display:flex;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px}
.play .vars span{background:rgba(255,255,255,.12);padding:2px 8px;border-radius:4px}
.play .chs{display:grid;gap:8px}
.play .chs button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#E8EFEC;padding:10px;border-radius:8px;text-align:left}
.play .chs button:hover{background:rgba(255,255,255,.18)}
.play .timer{height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.play .timer i{display:block;height:100%;background:#E6A740}

/* 状态机抽屉 */
.sm{border-left:1px solid var(--line);background:var(--surface);padding:14px;display:grid;gap:14px;align-content:start;font-size:12px;max-height:calc(100vh - 53px);overflow:auto;position:sticky;top:53px}
.sm h4{margin:0;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.smtable{width:100%;border-collapse:collapse}
.smtable td{padding:4px 2px;border-bottom:1px solid var(--line);vertical-align:top}
.log{display:grid;gap:4px;font-family:var(--f-mono);font-size:11px}
.log div{padding:3px 6px;border-radius:4px;background:var(--bg);overflow-wrap:anywhere}
.log div.bad{background:var(--red-soft);color:var(--red)}
.smgraph{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.smgraph .pill{opacity:.45}
.smgraph .pill.cur{opacity:1;outline:2px solid currentColor}
.toggle{display:flex;align-items:center;gap:6px;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:1100px){.ws.withsm{grid-template-columns:232px minmax(0,1fr)}.sm{position:fixed;right:0;top:53px;bottom:0;width:min(340px,100%);z-index:30;box-shadow:var(--shadow);max-height:none}.iawrap{grid-template-columns:1fr}}
@media (max-width:760px){
  .ws,.ws.withsm{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .nav h4{display:none}.nav a{white-space:nowrap}.nav a.sub{padding-left:10px}

  if(S.gen==='quick'){startPlan()}else{save();render()}
}
function startPlan(){
  const P=S.project;advanceStage('planning');S.view='project';S.sel='plan';
  runTask(P.arts.plan,{steps:8,label:'策划案',produce:()=>genPlan(P.params,P),onDone:(a)=>{P.title=a.data.title;P.cards=a.data.cards;openOutlineModal(true)}});
}

// 模拟生成任务：queued → running → succeeded / failed / cancelled
const timers={};
function runTask(art,opt){
  if(art.task&&['queued','running'].includes(art.task.status)){toast('正在生成中');return}
  const hadData=!!art.data; art.prev=art.status;
  if(!go('artifact',art,'generating',art.label))return;
  art.task={id:'T'+Math.random().toString(36).slice(2,7),status:'queued',progress:0,steps:opt.steps,lines:[]};
  log(`[生成任务] ${art.label}: 新建 → 排队中`);
  render();
  const willFail=S.failNext;S.failNext=false;
  setTimeout(()=>{
    go('task',art.task,'running',art.label);render();
    let i=0;
    timers[art.key]=setInterval(()=>{
      i++;art.task.progress=Math.round(i/opt.steps*100);
      if(opt.stream)art.task.lines.push(opt.stream(i));
      if(willFail&&i>=Math.ceil(opt.steps*0.6)){
        clearInterval(timers[art.key]);go('task',art.task,'failed',art.label);art.task.err='模型超时（模拟）';
        if(hadData){art.status=art.prev;log(`[产物] ${art.label}: 生成失败，已保留上一版本（${ST_LABEL(art.prev)}）`);toast('生成失败，已保留上一版本')}
        else go('artifact',art,'error',art.label);
        save();render();return}
      if(i>=opt.steps){
        clearInterval(timers[art.key]);
        art.data=opt.produce();art.versions++;
        go('task',art.task,'succeeded',art.label);go('artifact',art,'ready',art.label);
        art.notice='';
        opt.onDone&&opt.onDone(art);afterReady(art);save();render();return}
      updateGenBox(art);
    },opt.speed||180);
  },400);
}
function cancelTask(art){
  if(!art.task||!['queued','running'].includes(art.task.status))return;
  clearInterval(timers[art.key]);go('task',art.task,'cancelled',art.label);
  if(art.data)art.status=art.prev;else go('artifact',art,'empty',art.label);
  log(`[产物] ${art.label}: 已取消，${art.data?'保留上一版本':'回到未生成'}`);save();render();
}
function afterReady(art){
  const P=S.project;
  // 卡点段串行依赖：前一段就绪后解锁下一段
  if(P.outlineMode==='cards'&&['c1','c2','c3'].includes(art.key)){
    const order=segRanges(P).map(r=>r.k);const nx=P.arts[order[order.indexOf(art.key)+1]];
    if(nx&&nx.status==='blocked')go('artifact',nx,'empty',nx.label);
  }
}
function markEdited(art){if(['ready','outdated','edited'].includes(art.status)){go('artifact',art,'edited',art.label);propagate(art.key)}save();renderSM()}
// 上游变更向下游传播
function downstream(key){
  const P=S.project;
  if(key==='plan')return['all','c1','c2','c3','end'].filter(k=>P.arts[k]);
  return Object.keys(P.ia).filter(k=>P.ia[k].src===key).map(k=>'ia:'+k);
}
function getArt(k){const P=S.project;return k.startsWith('ia:')?P.ia[k.slice(3)]:P.arts[k]}
function propagate(key){
  for(const k of downstream(key)){const a=getArt(k);if(!a||!a.data)continue;
    if(a.status==='locked'){a.notice='上游已修改（已定稿，仅提示）';log(`[传播] ${a.label} 已定稿，仅提示`)}
    else if(['ready','edited'].includes(a.status)){go('artifact',a,'outdated',a.label);a.notice='上游已修改，内容可能不一致'}}
}

// ============ 集纲生成 ============
function outlineCtx(){const P=S.project;return{total:P.params.episodes,cards:P.cards,c:P.arts.plan.data.cast}}
function startOutline(mode){
  const P=S.project;advanceStage('outlining');
  if(mode==='all'){
    P.outlineMode='all';P.arts.all=P.arts.all||newArt('all','全部集纲','outline');S.sel='all';
    genOutline(P.arts.all,1,P.params.episodes);
  }else{
    P.outlineMode='cards';
    segRanges(P).forEach((r,i)=>{if(!P.arts[r.k]){P.arts[r.k]=newArt(r.k,r.label+'集纲','segment',i===0?'empty':'blocked');if(i>0)log(`[产物] ${r.label}集纲: 等待前置（${segRanges(P)[i-1].label}）`)}});
    S.sel='c1';genOutline(P.arts.c1,1,P.cards.c1);

}
function genOutline(art,from,to,chain){
  const ctx=outlineCtx();const n=to-from+1;
  runTask(art,{steps:Math.min(n,30),speed:Math.max(60,1800/n),label:art.label,
    stream:i=>{const no=from+Math.floor((i-1)*n/Math.min(n,30));const e=genEpisode(no,ctx);return `第${no}集 ${e.title}…`},
    produce:()=>{const eps=[];for(let k=from;k<=to;k++)eps.push(genEpisode(k,ctx));return{from,to,eps}},
    onDone:()=>{if(chain){const P=S.project;const ord=segRanges(P);const i=ord.findIndex(r=>r.k===art.key);const nx=ord[i+1];if(nx){setTimeout(()=>{const a=P.arts[nx.k];if(['empty'].includes(a.status)){S.sel=nx.k;genOutline(a,nx.from,nx.to,true)}},300)}}}});
}

// ============ 互动剧本生成 ============
function buildInteractive(eps,cfg,P){
  const c=P.arts.plan.data.cast;const nodes=[];let nid=0;const id=()=>'n'+(++nid);
  const cardEps=[P.cards.c1,P.cards.c2,P.cards.c3];
  const pov=cfg.pov==='first';
  const nm=s=>pov?s.replace(new RegExp(c.P,'g'),'你'):s;
  const every=cfg.density==='low'?3:1;const nopt=cfg.density==='high'?3:2;
  let col=0,rowY=0,rowH=0;let prevExits=[];const place=(n,dy=0)=>{n.x=col*190;n.y=rowY+dy;rowH=Math.max(rowH,dy+56)};
  const link=(exits,to)=>exits.forEach(e=>{if(e.opt)e.opt.to=to;else e.node.to=to});
  eps.forEach((e,i)=>{
    if(i>0){rowY+=rowH+44;rowH=0}col=0;
    const sc={id:id(),type:'scene',ep:e.no,title:`第${e.no}集 · ${e.title}`,text:nm(`△ ${e.summary}\n${c.P}：${T.lines[e.no%T.lines.length]}\n△ ${e.hook}`),to:null,status:'ready'};place(sc);
    nodes.push(sc);link(prevExits,sc.id);prevExits=[{node:sc}];col++;
    if(cfg.paywall&&cardEps.includes(e.no)){const pw={id:id(),type:'paywall',ep:e.no,title:`💰 ${e.card||'卡点'} · 付费解锁`,text:'解锁后续剧情与隐藏分支',to:null,status:'ready'};place(pw);nodes.push(pw);link(prevExits,pw.id);prevExits=[{node:pw}];col++}
    const isLast=i===eps.length-1;
    if(!isLast&&(i%every===0)){
      const ch=T.choices[(e.no)%T.choices.length];
      const cn={id:id(),type:'choice',ep:e.no,title:nm(fill(ch.q,c)),text:pov?'你会怎么做？':fill(`${c.P}会怎么做？`,c),options:[],timed:cfg.form==='qte'?8:0,status:'ready'};place(cn);
      nodes.push(cn);link(prevExits,cn.id);col++;prevExits=[];
      ch.o.slice(0,nopt).forEach((o,k)=>{
        const label=nm(fill(o[0],c));
        const eff=cfg.form==='branch'?{}:o[1];
        const br={id:id(),type:'scene',ep:e.no,title:`分支 · ${label}`,text:nm(`△ ${c.P}选择${label}。\n${Object.entries(o[1]).map(([k2,v])=>`${k2}${v>0?'+':''}${v}`).join('，')||'局势暂时平静'}。`),to:null,status:'ready'};place(br,k*70);
        const opt={label,to:br.id,effects:cfg.form==='branch'?{好感:o[1].好感||0}:eff,flag:o[2]||''};
        cn.options.push(opt);nodes.push(br);prevExits.push({node:br});
      });col++;
    }
  });
  // 结局
  const E=cfg.converge==='merge'?1:Math.max(1,Math.min(5,cfg.endings));
  const endDefs=[['好结局',fill('{P}与{L}携手，{A}伏法。',c)],['坏结局',fill('{P}赢了复仇，却失去了{L}。',c)],['隐藏结局',fill('{X}的秘密揭开：一切早有安排。',c)],['事业结局',fill('{P}选择独自登顶。',c)],['真结局',fill('所有误会解开，{P}原谅了过去。',c)]].slice(0,E);
  rowY+=rowH+44;rowH=0;col=0;
  if(E===1){const en={id:id(),type:'ending',ep:eps[eps.length-1].no,title:'结局 · '+endDefs[0][0],text:nm(endDefs[0][1]),endingType:'good',status:'ready'};place(en);nodes.push(en);link(prevExits,en.id)}
  else{
    const cd={id:id(),type:'condition',ep:eps[eps.length-1].no,title:'结局判定',text:'按数值与标记分流',rules:[],else:null,status:'ready'};place(cd);nodes.push(cd);link(prevExits,cd.id);col++;
    const ends=endDefs.map((d,k)=>{const en={id:id(),type:'ending',ep:cd.ep,title:'结局 · '+d[0],text:nm(d[1]),status:'ready'};place(en,k*70);nodes.push(en);return en});
    const ruleDefs=[{var:'好感',op:'>=',val:30},null,{flag:'trust'},{var:'实力',op:'>=',val:30},{var:'好感',op:'>=',val:50}];
    ends.forEach((en,k)=>{if(k===1)return;cd.rules.push({...ruleDefs[k],to:en.id})});
    cd.rules.sort((a,b)=>(b.flag?1:0)-(a.flag?1:0));cd.else=ends[1].id;
  }
  return{nodes,vars:cfg.form==='branch'?['好感']:['好感','实力'],start:nodes[0].id,cfg};
}
function convertToInteractive(srcKey,cfg){
  const P=S.project;const src=P.arts[srcKey];advanceStage('interactive');
  const key=srcKey;const label=`互动剧本 · ${src.label.replace('集纲','')}`;
  if(!P.ia[key])P.ia[key]=Object.assign(newArt('ia:'+key,label,'interactive'),{src:srcKey,validate:{status:'unchecked'}});
  const a=P.ia[key];a.cfg=cfg;S.sel='ia:'+key;S.selNode=null;S.iaTab='canvas';
  const eps=src.data.eps.filter(e=>!e.placeholder);
  runTask(a,{steps:10,speed:150,stream:i=>['解析集纲…','识别关键冲突点…','设计选择点…','分配数值…','生成分支剧情…','收束支线…','生成结局…','布局节点…','整理台词…','完成'][i-1],
    produce:()=>buildInteractive(eps,cfg,P),
    onDone:()=>{if(a.validate.status!=='unchecked')go('validate',a.validate,'unchecked',label);validateIA(a,true)}});
}

// ============ 结构校验 ============
function edgesOf(n){if(n.type==='choice')return n.options.map(o=>o.to);if(n.type==='condition')return[...n.rules.map(r=>r.to),n.else];if(n.type==='ending')return[];return[n.to]}
function validateIA(a,silent){
  const d=a.data;if(!d)return;
  if(a.validate.status!=='unchecked'){go('validate',a.validate,'unchecked',a.label)}
  go('validate',a.validate,'checking',a.label);
  const byId=Object.fromEntries(d.nodes.map(n=>[n.id,n]));const issues=[];
  d.nodes.forEach(n=>{n.flag=''});
  // 1 可达性
  const seen=new Set([d.start]);const q=[d.start];
  while(q.length){const n=byId[q.shift()];if(!n)continue;for(const t of edgesOf(n))if(t&&byId[t]&&!seen.has(t)){seen.add(t);q.push(t)}}
  d.nodes.forEach(n=>{if(!seen.has(n.id)){issues.push({l:'e',id:n.id,m:`孤立节点：「${n.title}」无法从起点到达`});n.flag='orphan'}});
  // 2 死路 & 断链
  d.nodes.forEach(n=>{if(n.type==='ending')return;const es=edgesOf(n);
    if(!es.length||es.some(t=>!t||!byId[t])){issues.push({l:'e',id:n.id,m:`死路：「${n.title}」${!es.length?'没有出口':'有选项或出口未指定目标'}`});n.flag='error'}});
  // 3 选项数
  d.nodes.forEach(n=>{if(n.type==='choice'&&n.options.length<2){issues.push({l:'w',id:n.id,m:`选择点「${n.title}」只有 ${n.options.length} 个选项`});n.flag=n.flag||'warning'}});
  // 4 结局条件可满足
  const maxv={};d.vars.forEach(v=>maxv[v]=0);const flags=new Set();
  d.nodes.forEach(n=>{if(n.type==='choice'&&seen.has(n.id)){d.vars.forEach(v=>{maxv[v]+=Math.max(0,...n.options.map(o=>(o.effects||{})[v]||0))});n.options.forEach(o=>o.flag&&flags.add(o.flag))}});
  d.nodes.forEach(n=>{if(n.type!=='condition')return;n.rules.forEach(r=>{const en=byId[r.to];
    if(r.var&&r.val>maxv[r.var]){issues.push({l:'e',id:r.to,m:`结局不可达：「${en?.title}」要求 ${r.var}≥${r.val}，但全剧最多只能到 ${maxv[r.var]}`});if(en)en.flag='error'}
    if(r.flag&&!flags.has(r.flag)){issues.push({l:'e',id:r.to,m:`结局不可达：「${en?.title}」需要标记「${r.flag}」，但没有任何选项会设置它`});if(en)en.flag='error'}})});
  // 5 无法到达结局（循环无出口）
  const canEnd=new Set(d.nodes.filter(n=>n.type==='ending').map(n=>n.id));let ch=true;
  while(ch){ch=false;d.nodes.forEach(n=>{if(!canEnd.has(n.id)&&edgesOf(n).some(t=>canEnd.has(t))){canEnd.add(n.id);ch=true}})}
  d.nodes.forEach(n=>{if(seen.has(n.id)&&!canEnd.has(n.id)&&!issues.some(i=>i.id===n.id&&i.l==='e')){issues.push({l:'e',id:n.id,m:`「${n.title}」无论怎么选都到不了任何结局（循环或死路）`});n.flag='error'}});
  if(!d.nodes.some(n=>n.type==='ending'))issues.push({l:'e',id:d.start,m:'剧本没有结局节点'});
  a.issues=issues;a.maxv=maxv;
  const to=issues.some(i=>i.l==='e')?'invalid':issues.length?'warning':'valid';
  go('validate',a.validate,to,a.label);
  if(!silent)toast(to==='valid'?'校验通过':to==='warning'?`校验通过，有 ${issues.length} 条警告`:`发现 ${issues.filter(i=>i.l==='e').length} 个错误`);
  save();
}
function iaChanged(a,node){
  if(node)node.status='edited';
  if(['ready','outdated'].includes(a.status))go('artifact',a,'edited',a.label);
  if(a.validate.status!=='unchecked')go('validate',a.validate,'unchecked',a.label);
  validateIA(a,true);
}

    </section></main>`;
}

function navItem(k,label,st,extra=''){return`<a class="${S.sel===k?'on':''} ${extra}" data-sel="${k}">${label}${st?pill(st):''}</a>`}
function renderProject(){
  const P=S.project;if(!P){S.view='home';return renderHome()}
  let nav='<nav class="nav"><h4>前期</h4>';
  if(P.mode!=='original')nav+=navItem('parse',P.mode==='novel'?'小说解析':'爆款拆解',P.parseState==='done'?'ready':P.parseState==='parse_failed'?'parse_failed':'parsing');
  nav+=navItem('plan','策划案',P.arts.plan.status);
  if(P.outlineMode){nav+='<h4>集纲</h4>';
    if(P.outlineMode==='all')nav+=navItem('all','全部集纲 <span class="ep">1–'+P.params.episodes+'</span>',P.arts.all.status);
    else segRanges(P).forEach(r=>{const a=P.arts[r.k];nav+=navItem(r.k,`${a.status==='blocked'?'🔒 ':''}${r.label} <span class="ep mono">${r.from}–${r.to}</span>`,a.status)});}
  if(Object.keys(P.ia).length){nav+='<h4>互动剧本</h4>';Object.values(P.ia).forEach(a=>nav+=navItem(a.key,a.label.replace('互动剧本 · ',''),a.status))}
  nav+='</nav>';
  let main='';const sel=S.sel;
  if(sel==='parse')main=renderParse();
  else if(sel==='plan')main=renderPlan();
  else if(sel.startsWith('ia:'))main=renderIA(getArt(sel));
  else main=renderOutline(P.arts[sel]);
  return `<div class="ws ${S.smOpen?'withsm':''}">${nav}<section class="main" id="main">${main}</section>${S.smOpen?`<aside class="sm" id="sm">${smHTML()}</aside>`:''}</div>`;
}
function genBox(a){const t=a.task;return`<div class="genbox" id="gen-${a.key.replace(':','_')}"><div class="row"><b>${a.label} 生成中</b>${pill(t.status)}<span class="mono small muted gp">${t.progress}%</span><span style="flex:1"></span><button class="btn" data-cancel="${a.key}">取消</button></div>
  <div class="progress"><i style="width:${t.progress}%"></i></div><div class="stream">${esc((t.lines||[]).slice(-5).join('\n'))||'正在准备…'}</div></div>`}
function updateGenBox(a){const el=document.getElementById('gen-'+a.key.replace(':','_'));if(!el)return renderSM();el.querySelector('.progress i').style.width=a.task.progress+'%';el.querySelector('.gp').textContent=a.task.progress+'%';el.querySelector('.stream').textContent=(a.task.lines||[]).slice(-5).join('\n');renderSM()}
function failBox(a){return a.status==='error'?`<div class="banner err"><b>生成失败</b>${esc(a.task?.err||'')}，本次不扣额度。<span class="sp"></span><button class="btn" data-retry="${a.key}">重试</button></div>`:''}
function noticeBox(a){
  if(a.status==='outdated')return`<div class="banner warn"><b>待更新</b>${esc(a.notice||'上游已修改')}<span class="sp"></span><button class="btn" data-retry="${a.key}">重新生成</button><button class="btn" data-ignore="${a.key}">忽略</button></div>`;
  if(a.status==='locked'&&a.notice)return`<div class="banner info">${esc(a.notice)}<span class="sp"></span><button class="btn" data-unlock="${a.key}">解锁</button></div>`;
  return'';
}
function lockBtn(a){return a.status==='locked'?`<button class="btn" data-unlock="${a.key}">🔓 解锁</button>`:`<button class="btn" data-lock="${a.key}" ${['ready','edited','outdated'].includes(a.status)?'':'disabled'}>🔒 定稿</button>`}

function renderParse(){
  const P=S.project;
  if(P.parseState==='parsing')return`<div class="doc"><div class="genbox"><b>正在解析${P.mode==='novel'?'小说':'爆款剧本'}…</b>${pill('parsing')}<div class="progress"><i style="width:60%"></i></div><div class="stream">识别章节 · 抽取人物 · 梳理主线 · 定位名场面</div></div></div>`;
  if(P.parseState==='parse_failed')return`<div class="doc"><div class="banner err"><b>解析失败</b>${esc(P.parseErr)}<span class="sp"></span><button class="btn" data-act="reparse">重新解析</button><button class="btn" data-act="home">返回修改</button></div></div>`;
  const d=P.parsed;
  if(P.mode==='novel')return`<div class="doc"><div class="dochead"><h2>小说解析总览</h2>${pill('ready')}</div>
    <div class="grid2"><div class="block"><h3>基本信息</h3><div>《${esc(P.params.novelName||'未命名')}》 · <span class="mono">${d.words}</span> 字 · <span class="mono">${d.chapters.length}</span> 章</div><div class="small muted" style="margin-top:6px">主线：${esc(d.mainline)}</div></div>
    <div class="block"><h3>主要人物</h3><div class="chips">${d.chars.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div></div>
    <div class="block"><h3>章节（勾选改编范围）</h3><div class="row"><label>从第 <input type="number" id="rFrom" min="1" max="${d.chapters.length}" value="${d.range[0]}" style="width:64px"> 章</label><label>到第 <input type="number" id="rTo" min="1" max="${d.chapters.length}" value="${d.range[1]}" style="width:64px"> 章</label></div>
      <ol class="small" style="margin:8px 0 0;padding-left:20px">${d.chapters.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></div>
    <div class="block"><h3>改编力度</h3><div class="seg">${['忠于原著','适度改编','大幅重构'].map(x=>`<button class="${d.strength===x?'on':''}" data-strength="${x}">${x}</button>`).join('')}</div></div>
    ${P.arts.plan.status==='empty'?`<div><button class="btn primary lg" data-act="toPlan">确认并生成策划案</button></div>`:''}</div>`;
  const max=Math.max(...d.beats);
  return`<div class="doc"><div class="dochead"><h2>爆款拆解</h2>${pill('ready')}</div>
    <div class="block"><h3>爽点强度曲线 <span class="small muted">（按 5 集一组）</span></h3>
      <svg viewBox="0 0 400 120" style="width:100%;height:auto;max-height:180px" role="img" aria-label="爽点强度曲线">${d.beats.map((b,i)=>`<rect x="${i*20+2}" y="${110-b/max*100}" width="16" height="${b/max*100}" rx="2" fill="${[1,5,10].includes(i)?'var(--amber)':'var(--accent)'}" opacity="${[1,5,10].includes(i)?1:.55}"></rect>`).join('')}<line x1="0" y1="110" x2="400" y2="110" stroke="var(--line)"></line></svg>
      <div class="small muted">琥珀色为识别出的卡点：第 ${d.cards.join(' / ')} 集</div></div>
    <div class="block"><h3>钩子手法</h3><ul style="margin:0;padding-left:20px">${d.hooks.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div>
    <div class="block"><h3>改写方向</h3><div class="seg">${['本土化','出海','同构新创'].map(x=>`<button class="${(P.benchDir||'同构新创')===x?'on':''}" data-bdir="${x}">${x}</button>`).join('')}</div>
      <p class="small muted" style="margin:8px 0 0">只借鉴节奏结构，人物与情节原创；生成后会提示与原剧的相似度。</p></div>
    ${P.arts.plan.status==='empty'?`<div><button class="btn primary lg" data-act="toPlan">生成对标策划案</button></div>`:''}</div>`;
}

function renderPlan(){
  const P=S.project;const a=P.arts.plan;
  if(a.status==='generating')return`<div class="doc">${genBox(a)}</div>`;
  if(a.status==='empty')return`<div class="doc"><div class="empty">还没有策划案${P.mode!=='original'?'，请先确认解析结果':''}</div></div>`;
  if(a.status==='error')return`<div class="doc">${failBox(a)}</div>`;
  const d=a.data;const ro=a.status==='locked';const ce=ro?'':'contenteditable="true"';
  const blk=(k,t,body)=>`<div class="block"><h3>${t}<span class="sp"></span>${ro?'':`<button class="btn ghost small" data-regen="${k}">↻ 重新生成</button>`}</h3>${body}</div>`;
  return`<div class="doc">
    <div class="dochead"><div><h2>${esc(d.title)}</h2><div class="small muted">策划案 · v${a.versions} · ${P.params.genres.join('/')} · ${P.params.styles.join('/')} · ${MARKETS.find(x=>x.k===P.params.market).name} · ${P.params.episodes} 集${d.skills.length?' · Skill：'+d.skills.join('、'):''}</div></div>
      <span class="sp"></span>${pill(a.status)}${lockBtn(a)}<button class="btn primary" data-act="outlineModal" ${['ready','edited','locked','outdated'].includes(a.status)?'':'disabled'}>下一步：生成集纲 →</button></div>
    ${noticeBox(a)}
    ${blk('title','剧名候选',`<div class="chips">${d.titles.map(t=>`<button class="chip ${t===d.title?'on':''}" data-title="${esc(t)}" ${ro?'disabled':''}>${esc(t)}</button>`).join('')}</div><p style="margin:10px 0 0" ${ce} data-field="logline">${esc(d.logline)}</p>`)}
    ${blk('synopsis','故事梗概',`<p style="margin:0;white-space:pre-wrap" ${ce} data-field="synopsis">${esc(d.synopsis)}</p>`)}
    ${blk('world','世界观 / 背景',`<p style="margin:0" ${ce} data-field="world">${esc(d.world)}</p>`)}
    ${blk('chars','人物小传',`<div class="chars">${d.chars.map((c,i)=>`<div class="char"><b>${esc(c.n)}</b> <span class="small muted">${esc(c.r)}</span><div class="small" ${ce} data-char="${i}">${esc(c.d)}</div></div>`).join('')}</div>`)}
    ${blk('conflict','核心冲突与爽点',`<p style="margin:0;white-space:pre-wrap" ${ce} data-field="conflict">${esc(d.conflict)}</p>`)}
    ${blk('pacing','节奏与付费建议',`<p style="margin:0" ${ce} data-field="pacing">${esc(d.pacing)}</p><p class="small muted" style="margin:6px 0 0">这里的建议卡点会作为集纲弹窗里滑块的默认值。</p>`)}
    ${blk('ending','结局方向',`<p style="margin:0" ${ce} data-field="ending">${esc(d.ending)}</p>`)}
  </div>`;
}

function renderOutline(a){
  const P=S.project;if(!a)return'';
  const isSeg=a.kind==='segment';const r=isSeg?segRanges(P).find(x=>x.k===a.key):{from:1,to:P.params.episodes,label:'全部'};
  const head=`<div class="dochead"><div><h2>${isSeg?r.label+'集纲':'全部集纲'}</h2><div class="small muted mono">第 ${r.from}–${r.to} 集 · 共 ${r.to-r.from+1} 集${isSeg?` · 卡点：第 ${P.cards[a.key]||P.params.episodes} 集`:''}</div></div><span class="sp"></span>${pill(a.status)}
    <button class="btn" data-act="adjustCards">${P.outlineMode==='cards'?'调整卡点':'切换为分卡点'}</button>
    ${P.outlineMode==='cards'?`<button class="btn" data-act="toAll">合并为全部集纲</button>`:''}
    ${lockBtn(a)}
    <button class="btn primary" data-act="toIA" ${['ready','edited','locked','outdated'].includes(a.status)?'':'disabled'}>⇄ 转互动影视剧本</button></div>`;
  if(a.status==='blocked'){const ord=segRanges(P);const prev=ord[ord.findIndex(x=>x.k===a.key)-1];return`<div class="doc">${head}<div class="empty">🔒 请先完成「${prev.label}」集纲<div class="small">后一段要接着前一段的剧情往下写，所以按顺序生成。</div><button class="btn" data-sel="${prev.k}">去${prev.label}</button></div></div>`}
  if(a.status==='generating')return`<div class="doc">${head}${genBox(a)}</div>`;
  if(a.status==='error')return`<div class="doc">${head}${failBox(a)}</div>`;
  if(a.status==='empty')return`<div class="doc">${head}<div class="empty">这一段还没有生成<div class="row" style="justify-content:center"><button class="btn primary" data-genseg="${a.key}">生成${r.label}集纲</button><button class="btn" data-genchain="${a.key}">从这里依次生成后续全部段</button></div></div></div>`;
  const ro=a.status==='locked';
  return`<div class="doc">${head}${noticeBox(a)}<div class="eps">${a.data.eps.map((e,i)=>`<div class="epcard ${e.card?'card':''} ${e.placeholder?'ph':''}"><div class="no">EP<b>${String(e.no).padStart(2,'0')}</b></div>
    <div class="t"><span ${ro?'':'contenteditable="true"'} data-ep="${i}" data-k="title">${esc(e.title)}</span>${e.card?`<span class="cardmark">💰 ${e.card}</span>`:''}${e.placeholder?'<span class="pill st-outdated">待补生成</span>':''}</div>
    <div ${ro?'':'contenteditable="true"'} data-ep="${i}" data-k="summary">${esc(e.summary)}</div><div class="hook">${esc(e.hook)}</div></div>`).join('')}</div></div>`;
}

function renderIA(a){
  if(!a)return'';
  const head=`<div class="dochead"><div><h2>${esc(a.label)}</h2><div class="small muted">来源：${esc(S.project.arts[a.src]?.label||'')} · ${a.cfg?cfgText(a.cfg):''}</div></div><span class="sp"></span>${pill(a.status)}${a.validate?pill(a.validate.status,'校验·'):''}${lockBtn(a)}</div>`;
  if(a.status==='generating')return`<div class="doc">${head}${genBox(a)}</div>`;
  if(a.status==='error')return`<div class="doc">${head}${failBox(a)}</div>`;
  const d=a.data;const tabs=`<div class="iabar"><div class="seg">${[['canvas','画布'],['script','剧本'],['play','试玩']].map(([k,t])=>`<button class="${S.iaTab===k?'on':''}" data-iatab="${k}">${t}</button>`).join('')}</div>
    <span class="small muted mono">${d.nodes.length} 节点 · ${d.nodes.filter(n=>n.type==='choice').length} 选择点 · ${d.nodes.filter(n=>n.type==='ending').length} 结局</span><span style="flex:1"></span>
    <button class="btn" data-act="validate">校验结构</button><button class="btn primary" data-act="export">导出</button></div>`;
  let body='';
  if(S.iaTab==='canvas')body=`<div class="iawrap"><div class="canvas" id="canvas"><svg id="cv"></svg><div class="cvtools"><button class="btn" data-zoom="1.2">＋</button><button class="btn" data-zoom="0.8">－</button><button class="btn" data-act="fit">适配</button></div>
    <div class="legend">${[['scene','场景','var(--line)'],['choice','选择','var(--accent)'],['condition','条件','var(--violet)'],['paywall','付费','var(--amber)'],['ending','结局','var(--green)']].map(x=>`<span><i class="swatch" style="background:${x[2]}"></i>${x[1]}</span>`).join('')}<span>拖动平移 · 滚轮缩放 · 点击编辑</span></div></div>
    <div class="side">${issuesPanel(a)}${inspector(a)}</div></div>`;
  else if(S.iaTab==='script')body=scriptView(a);
  else body=playView(a);
  return`<div class="doc" style="max-width:none">${head}${noticeBox(a)}${tabs}${body}</div>`;
}
function cfgText(c){return[{branch:'选项分支',value:'数值养成',qte:'限时选择',mix:'混合'}[c.form],{low:'低密度',mid:'中密度',high:'高密度'}[c.density],c.converge==='merge'?'支线回主线':`多结局 ×${c.endings}`,c.paywall?'含付费节点':'',c.pov==='first'?'第一人称':'第三人称'].filter(Boolean).join(' · ')}
function issuesPanel(a){const is=a.issues||[];return`<div class="panel"><h4>结构校验<span class="sp"></span>${pill(a.validate.status)}</h4>
  ${is.length?is.map(i=>`<div class="issue ${i.l}" data-goto="${i.id}">${i.l==='e'?'✕':'!'} ${esc(i.m)}</div>`).join(''):'<div class="small muted">没有问题。可以试着删掉一个节点、改掉选项目标，或把结局门槛调高，看看校验怎么报错。</div>'}
  ${a.maxv?`<div class="small muted mono">数值上限：${Object.entries(a.maxv).map(([k,v])=>k+' '+v).join(' · ')}</div>`:''}</div>`}
function nodeColor(t){return{scene:'var(--line)',choice:'var(--accent)',condition:'var(--violet)',paywall:'var(--amber)',ending:'var(--green)'}[t]}
function inspector(a){
  const d=a.data;const n=d.nodes.find(x=>x.id===S.selNode);const ro=a.status==='locked';
  if(!n)return`<div class="panel"><h4>节点</h4><div class="small muted">点击画布上的节点进行编辑。</div></div>`;
  const opts=d.nodes.map(x=>`<option value="${x.id}">${esc(x.title.slice(0,18))}</option>`).join('');
  const sel=(v,attr)=>`<select ${attr} ${ro?'disabled':''}><option value="">（未指定）</option>${opts.replace(`value="${v}"`,`value="${v}" selected`)}</select>`;
  let extra='';
  if(n.type==='scene'||n.type==='paywall')extra=`<div class="field"><label>下一个节点</label>${sel(n.to,'data-nto')}</div>`;
  if(n.type==='choice')extra=`<div class="field"><label>选项（${n.options.length}）</label>${n.options.map((o,i)=>`<div class="optrow"><input type="text" value="${esc(o.label)}" data-olabel="${i}" ${ro?'disabled':''}><button class="btn ghost danger" data-odel="${i}" ${ro?'disabled':''} aria-label="删除选项">✕</button>
    <div class="r2" style="grid-column:1/-1">→ ${sel(o.to,`data-oto="${i}"`)} ${d.vars.map(v=>`${v}<input type="number" value="${(o.effects||{})[v]||0}" data-oeff="${i}" data-var="${v}" ${ro?'disabled':''}>`).join('')}</div></div>`).join('')}
    <button class="btn" data-act="addOpt" ${ro||n.options.length>=4?'disabled':''}>＋ 添加选项</button>${n.timed?`<div class="small muted">限时 ${n.timed} 秒</div>`:''}</div>`;
  if(n.type==='condition')extra=`<div class="field"><label>分流规则（自上而下匹配）</label>${n.rules.map((r,i)=>`<div class="optrow"><div class="r2">${r.flag?`标记「${r.flag}」`:`${r.var} ≥ <input type="number" value="${r.val}" data-rval="${i}" ${ro?'disabled':''}>`} → ${esc(d.nodes.find(x=>x.id===r.to)?.title||'?')}</div></div>`).join('')}<div class="small muted">其余 → ${esc(d.nodes.find(x=>x.id===n.else)?.title||'?')}</div></div>`;
  return`<div class="panel"><h4><i class="swatch" style="background:${nodeColor(n.type)}"></i>${{scene:'场景',choice:'选择点',condition:'条件',paywall:'付费点',ending:'结局'}[n.type]}<span class="sp"></span>${pill(n.status)}</h4>
    <div class="field"><label for="nTitle">标题</label><input type="text" id="nTitle" value="${esc(n.title)}" ${ro?'disabled':''}></div>
    <div class="field"><label for="nText">内容</label><textarea id="nText" ${ro?'disabled':''}>${esc(n.text)}</textarea></div>
    ${extra}
    <div class="row"><button class="btn" data-act="expand" ${ro||n.type==='condition'?'disabled':''}>✦ AI 扩写</button><button class="btn danger" data-act="delNode" ${ro||n.id===d.start?'disabled':''}>删除节点</button></div></div>`;
}
function scriptView(a){
  const d=a.data;const by=Object.fromEntries(d.nodes.map(n=>[n.id,n]));
  return`<div class="script">${d.nodes.map(n=>{
    let x='';if(n.type==='choice')x=`<div class="choice"><b>${esc(n.text)}</b>${n.options.map(o=>`<div>▸ ${esc(o.label)} → <span class="muted">${esc(by[o.to]?.title||'（未指定）')}</span> <span class="mono small muted">${Object.entries(o.effects||{}).filter(e=>e[1]).map(e=>e[0]+(e[1]>0?'+':'')+e[1]).join(' ')}${o.flag?' 标记:'+o.flag:''}</span></div>`).join('')}</div>`;
    if(n.type==='condition')x=`<div class="choice">${n.rules.map(r=>`<div>若 ${r.flag?'标记 '+r.flag:r.var+' ≥ '+r.val} → ${esc(by[r.to]?.title)}</div>`).join('')}<div>否则 → ${esc(by[n.else]?.title)}</div></div>`;
    return`<div class="sc" style="${n.type==='scene'&&!n.title.startsWith('分支')?'':'margin-left:24px'}"><div class="h">${n.id.toUpperCase()} · ${{scene:'场景',choice:'选择点',condition:'条件',paywall:'付费点',ending:'结局'}[n.type]} · EP${n.ep}</div><b>${esc(n.title)}</b>${n.type!=='choice'?`<div style="white-space:pre-wrap;font-size:13px">${esc(n.text)}</div>`:''}${x}</div>`}).join('')}</div>`;
}
// 试玩
let PL=null;
function playView(a){
  const d=a.data;if(!PL||PL.key!==a.key)PL={key:a.key,cur:d.start,vars:Object.fromEntries(d.vars.map(v=>[v,0])),flags:[],steps:0,unlocked:false};
  const by=Object.fromEntries(d.nodes.map(n=>[n.id,n]));let n=by[PL.cur];
  let guard=0;while(n&&n.type==='condition'&&guard++<10){const r=n.rules.find(r=>r.flag?PL.flags.includes(r.flag):PL.vars[r.var]>=r.val);PL.cur=r?r.to:n.else;n=by[PL.cur]}
  if(!n)return`<div class="play"><div class="screen">剧情在这里断了（目标节点不存在）。先运行结构校验。</div><div class="chs"><button data-play="restart">重新开始</button></div></div>`;
  let ch='';
  if(n.type==='scene')ch=n.to?`<button data-play="${n.to}">继续 ▸</button>`:'<div class="small">（死路：没有下一个节点）</div>';
  if(n.type==='paywall')ch=`<button data-play="${n.to}" data-unlock="1">💰 解锁继续（演示，不扣费）</button>`;
  if(n.type==='choice')ch=n.options.map((o,i)=>`<button data-play="${o.to}" data-opt="${i}">${esc(o.label)}</button>`).join('');
  if(n.type==='ending')ch=`<button data-play="restart">↺ 重新开始，试试别的选择</button>`;
  return`<div class="play"><div class="vars">${Object.entries(PL.vars).map(([k,v])=>`<span>${k} ${v}</span>`).join('')}${PL.flags.map(f=>`<span>标记:${f}</span>`).join('')}<span>第 ${PL.steps} 步</span></div>

    ${n.type==='choice'&&n.timed?'<div class="timer"><i style="width:100%"></i></div>':''}
    <div class="chs">${ch}</div></div>`;
}

// 画布
let VIEW={x:24,y:24,k:0.85,key:null};
function drawCanvas(){
  const a=getArt(S.sel);const svg=$('#cv');if(!svg||!a||!a.data)return;const d=a.data;
  const first=VIEW.key!==a.key;if(first){VIEW={x:24,y:24,k:0.85,key:a.key}}
  const by=Object.fromEntries(d.nodes.map(n=>[n.id,n]));const W=150,H=56;
  let edges='';
  d.nodes.forEach(n=>{const outs=n.type==='choice'?n.options.map(o=>[o.to,o.label]):n.type==='condition'?[...n.rules.map(r=>[r.to,r.flag?r.flag:r.var+'≥'+r.val]),[n.else,'否则']]:n.type==='ending'?[]:[[n.to,'']];
    outs.forEach(([t,l])=>{const m=by[t];if(!m)return;const x1=n.x+W,y1=n.y+H/2,x2=m.x,y2=m.y+H/2;const back=x2<=x1;
      const path=back?`M${x1},${y1} C${x1+50},${y1} ${x2-50},${y2} ${x2},${y2}`:`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`;
      edges+=`<path d="${path}" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#ar)" opacity=".7"></path>`;
      if(l)edges+=`<text x="${(x1+x2)/2}" y="${(y1+y2)/2-4}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(l.slice(0,10))}</text>`})});
  const nodes=d.nodes.map(n=>{const sel=S.selNode===n.id;const stroke=n.flag==='error'?'var(--red)':n.flag==='warning'?'var(--amber)':sel?'var(--fg)':nodeColor(n.type);
    const dash=n.flag==='orphan'?'stroke-dasharray="5 4"':'';
    return`<g data-node="${n.id}" style="cursor:pointer"><rect x="${n.x}" y="${n.y}" width="${W}" height="${H}" rx="${n.type==='choice'||n.type==='condition'?14:6}" fill="var(--surface)" stroke="${stroke}" stroke-width="${sel||n.flag?2.5:1.5}" ${dash}></rect>
      <rect x="${n.x}" y="${n.y}" width="5" height="${H}" rx="2" fill="${nodeColor(n.type)}"></rect>
      <text x="${n.x+12}" y="${n.y+20}" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">EP${n.ep} · ${{scene:'场景',choice:'选择',condition:'条件',paywall:'付费',ending:'结局'}[n.type]}${n.status==='edited'?' ·改':''}</text>
      <text x="${n.x+12}" y="${n.y+40}" font-size="12" fill="var(--fg)" font-weight="600">${esc(n.title.replace(/^第\d+集 · /,'').slice(0,11))}</text></g>`}).join('');
  svg.innerHTML=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path></marker></defs><g id="vp" transform="translate(${VIEW.x},${VIEW.y}) scale(${VIEW.k})">${edges}${nodes}</g>`;
  // 交互：平移 / 缩放 / 选择
  let drag=null;
  svg.onpointerdown=e=>{const g=e.target.closest('[data-node]');if(g){S.selNode=g.dataset.node;renderMainOnly();return}drag={x:e.clientX,y:e.clientY,vx:VIEW.x,vy:VIEW.y};svg.classList.add('drag');svg.setPointerCapture(e.pointerId)};
  svg.onpointermove=e=>{if(!drag)return;VIEW.x=drag.vx+e.clientX-drag.x;VIEW.y=drag.vy+e.clientY-drag.y;$('#vp').setAttribute('transform',`translate(${VIEW.x},${VIEW.y}) scale(${VIEW.k})`)};
  svg.onpointerup=()=>{drag=null;svg.classList.remove('drag')};
  svg.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:0.9,e.offsetX,e.offsetY)};
}
function zoom(f,cx,cy){const svg=$('#cv');if(!svg)return;if(cx==null){cx=svg.clientWidth/2;cy=svg.clientHeight/2}const k=clamp(VIEW.k*f,0.15,2.5);VIEW.x=cx-(cx-VIEW.x)*k/VIEW.k;VIEW.y=cy-(cy-VIEW.y)*k/VIEW.k;VIEW.k=k;$('#vp').setAttribute('transform',`translate(${VIEW.x},${VIEW.y}) scale(${VIEW.k})`)}
function fit(){const a=getArt(S.sel);const svg=$('#cv');if(!a||!svg)return;const xs=a.data.nodes.map(n=>n.x),ys=a.data.nodes.map(n=>n.y);const w=Math.max(...xs)-Math.min(...xs)+200,h=Math.max(...ys)-Math.min(...ys)+120;
  VIEW.k=clamp(Math.min(svg.clientWidth/w,svg.clientHeight/h),0.15,1.2);VIEW.x=20-Math.min(...xs)*VIEW.k;VIEW.y=(svg.clientHeight-(h-60)*VIEW.k)/2-Math.min(...ys)*VIEW.k;drawCanvas()}
function renderMainOnly(){const m=$('#main');if(!m)return render();const a=getArt(S.sel);m.innerHTML=renderIA(a);bindMain();if(S.iaTab==='canvas')drawCanvas();renderSM()}

function setCard(k,v,src){
  const g=3;const{total}=MC;const lo=k==='c1'?1:MC[k==='c2'?'c1':'c2']+g;const hi=k==='c3'?total:MC[k==='c1'?'c2':'c3']-g;

  else{const er=$('#cerr');if(er)er.textContent=''}
  MC[k]=nv;
}
function refreshSlider(){
  const{total}=MC;const pct=v=>((v-1)/(total-1)*100);
  ['c1','c2','c3'].forEach((k,i)=>{const h=$('#h-'+k);h.style.left=pct(MC[k])+'%';h.setAttribute('aria-valuenow',MC[k]);h.querySelector('.hl').textContent=`${['一卡','二卡','三卡'][i]} · ${MC[k]}`;const inp=$('#in-'+k);if(inp&&document.activeElement!==inp)inp.value=MC[k]});

function bindModal(){

  const tot=$('#mTotal');if(tot)tot.onchange=()=>{const n=clamp(+tot.value||80,10,150);const r=n/MC.total;MC.total=n;MC.c1=Math.round(MC.c1*r);MC.c2=Math.round(MC.c2*r);MC.c3=Math.round(MC.c3*r);
    MC.c3=clamp(MC.c3,7,n);MC.c2=clamp(MC.c2,4,MC.c3-3);MC.c1=clamp(MC.c1,1,MC.c2-3);drawOutlineModal()};
  M.querySelectorAll('[data-h]').forEach(h=>{const k=h.dataset.h;
    h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);
      const mv=ev=>{const r=tr.getBoundingClientRect();const v=1+(clamp(ev.clientX-r.left,0,r.width)/r.width)*(MC.total-1);setCard(k,v);refreshSlider()};
      h.onpointermove=mv;h.onpointerup=()=>{h.onpointermove=null;drawOutlineModal();$('#h-'+k)?.focus()}};
    h.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setCard(k,MC[k]+(e.key==='ArrowRight'?1:-1));refreshSlider()}if(e.key==='Enter')drawOutlineModal()}});

function applyOutlineModal(){
  const P=S.project;const{c1,c2,c3,total,mode,adjust}=MC;
  if(mode==='cards'&&!(c1<c2&&c2<c3&&c3<=total)){toast('卡点顺序不合法');return}
  if(!adjust&&!P.outlineMode){P.params.episodes=total;P.cards={c1,c2,c3};log(`集纲方式：${mode==='all'?'直接生成全部':'分卡点'}${mode==='cards'?`（一卡 ${c1} / 二卡 ${c2} / 三卡 ${c3}）`:''}`);closeModal();startOutline(mode);return}
  // 已有集纲后的切换 / 调整
  if(P.outlineMode==='all'&&mode==='cards'){splitAll({c1,c2,c3});closeModal();save();render();return}
  if(P.outlineMode==='all'&&mode==='all'){closeModal();return}
  if(adjust||P.outlineMode==='cards'){
    const old=segRanges(P);const locked=old.filter(r=>P.arts[r.k]?.status==='locked');
    const nc={c1,c2,c3};const tmp={...P,cards:nc};const neu=segRanges(tmp);
    const changed=neu.filter(r=>{const o=old.find(x=>x.k===r.k);return!o||o.from!==r.from||o.to!==r.to}).map(r=>r.k);
    if(locked.some(r=>changed.includes(r.k))){$('#cerr').textContent=`「${locked.map(r=>r.label).join('、')}」已定稿，请先解锁再调整卡点`;return}
    if(!changed.length){closeModal();return}
    // 汇总已有集，重新切分
    const pool={};old.forEach(r=>(P.arts[r.k]?.data?.eps||[]).forEach(e=>pool[e.no]=e));
    const ctx={...outlineCtx(),cards:nc};
    P.cards=nc;log(`调整卡点 → 一卡 ${c1} / 二卡 ${c2} / 三卡 ${c3}`);
    let firstChanged=neu.findIndex(r=>changed.includes(r.k));
    neu.forEach((r,i)=>{let a=P.arts[r.k];if(!a){const pv=i>0&&P.arts[neu[i-1].k];a=P.arts[r.k]=newArt(r.k,r.label+'集纲','segment',i===0||(pv&&['ready','edited','locked'].includes(pv.status))?'empty':'blocked')}
      if(i<firstChanged||!a.data)return;
      const eps=[];for(let n=r.from;n<=r.to;n++){const e=pool[n]?{...pool[n]}:{...genEpisode(n,ctx),placeholder:true};const g=genEpisode(n,ctx);e.card=g.card;if(e.card&&!pool[n]?.card)e.hook=g.hook;eps.push(e)}
      a.data={from:r.from,to:r.to,eps};
      if(['ready','edited'].includes(a.status)){go('artifact',a,'outdated',a.label);a.notice=`卡点已调整，本段范围变为第 ${r.from}–${r.to} 集${eps.some(e=>e.placeholder)?'，有新增集待补生成':''}`}
      propagate(r.k)});
    if(P.cards.c3>=P.params.episodes&&P.arts.end){delete P.arts.end;log('三卡位于最后一集，移除结局段')}
    closeModal();save();render();
  }
}
function splitAll(nc){
  const P=S.project;const all=P.arts.all;P.cards=nc;P.outlineMode='cards';
  segRanges(P).forEach(r=>{const a=newArt(r.k,r.label+'集纲','segment',all.data?all.status==='locked'?'ready':all.status:'empty');
    if(all.data)a.data={from:r.from,to:r.to,eps:all.data.eps.filter(e=>e.no>=r.from&&e.no<=r.to).map(e=>({...e,card:genEpisode(e.no,{...outlineCtx(),cards:nc}).card}))};a.versions=all.versions;P.arts[r.k]=a});
  delete P.arts.all;S.sel='c1';log('全部集纲 → 按卡点切分（不重新生成，状态继承）');
}
function mergeToAll(){
  const P=S.project;const segs=segRanges(P);const eps=[];segs.forEach(r=>{const a=P.arts[r.k];if(a.data)eps.push(...a.data.eps);else for(let n=r.from;n<=r.to;n++)eps.push({...genEpisode(n,outlineCtx()),placeholder:true})});
  const sts=segs.map(r=>P.arts[r.k].status);const a=newArt('all','全部集纲','outline',sts.every(s=>['ready','edited','locked'].includes(s))?(sts.includes('edited')?'edited':'ready'):'outdated');
  a.data={from:1,to:P.params.episodes,eps};a.versions=1;if(a.status==='outdated')a.notice='部分卡点段尚未生成，已用占位补齐';
  segs.forEach(r=>delete P.arts[r.k]);P.arts.all=a;P.outlineMode='all';S.sel='all';
  Object.values(P.ia).forEach(x=>{if(['c1','c2','c3','end'].includes(x.src)){x.src='all'}});
  log('卡点段 → 合并为全部集纲（不重新生成）');save();render();
}

    ${opt('分支密度','density',[['low','低 · 每 3 集一个选择'],['mid','中 · 每集一个'],['high','高 · 每集三选一']])}
    ${opt('分支收束','converge',[['merge','支线回主线（单结局）'],['multi','多结局']])}
    ${c.converge==='multi'?`<div><label class="lbl" for="ends">结局数</label><input type="number" id="ends" min="2" max="5" value="${c.endings}" style="width:70px"></div>`:''}
    ${opt('视角','pov',[['first','第一人称（观众即主角）'],['third','第三人称']])}
    <label class="toggle"><input type="checkbox" id="pw" ${c.paywall?'checked':''}> 把卡点集映射为「付费解锁」节点</label>
    <div class="small muted">已挂载 Skill：${skillNames(P.params.skills).filter(n=>['互动分支设计','台词口语化'].includes(n)).join('、')||'互动分支设计（默认）'}</div></div>
    <div class="mfoot"><button class="btn" data-x>取消</button><button class="btn primary" data-go>开始转换</button></div></div></div>`;
    const M=$('#modal');M.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
    M.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{c[b.dataset.o]=b.dataset.v;draw()});
    const e=$('#ends');if(e)e.onchange=()=>c.endings=clamp(+e.value,2,5);
    $('#pw').onchange=ev=>c.paywall=ev.target.checked;
    M.querySelector('[data-go]').onclick=()=>{closeModal();convertToInteractive(srcKey,{...c})}};
  const opt=(t,k,arr)=>`<div><span class="lbl">${t}</span><div class="seg" style="flex-wrap:wrap">${arr.map(([v,l])=>`<button class="${c[k]===v?'on':''}" data-o="${k}" data-v="${v}">${l}</button>`).join('')}</div></div>`;
  draw();
}
function openExport(a){
  const v=a.validate.status;
  if(v==='unchecked')validateIA(a,true);
  const vs=a.validate.status;
  const json=JSON.stringify({title:S.project.title,source:a.label,config:a.cfg,variables:a.data.vars,start:a.data.start,nodes:a.data.nodes.map(({x,y,flag,...n})=>n)},null,2);
  const csv=['节点ID,类型,集,标题,出口'].concat(a.data.nodes.map(n=>[n.id,n.type,n.ep,`"${n.title}"`,`"${edgesOf(n).join('|')}"`].join(','))).join('\n');
  let tab='json';
  const draw=(confirmed)=>{
    const blocked=vs==='invalid';const warn=vs==='warning'&&!confirmed;
    $('#modal').innerHTML=`<div class="mask"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="et"><div class="mhead"><h3 id="et">导出互动剧本</h3>${pill(vs)}<span class="sp"></span><button class="btn ghost" data-x aria-label="关闭">✕</button></div>
      <div class="mbody">${blocked?`<div class="banner err"><b>无法导出</b>结构校验有 ${a.issues.filter(i=>i.l==='e').length} 个错误，请先在画布里修复。</div>`:
      warn?`<div class="banner warn"><b>有 ${a.issues.length} 条警告</b>可以继续导出，但建议先处理。<span class="sp"></span><button class="btn" data-ok>仍然导出</button></div>`:
      `<div class="seg"><button class="${tab==='json'?'on':''}" data-t="json">互动剧本 JSON</button><button class="${tab==='csv'?'on':''}" data-t="csv">分支表 CSV</button></div>
      <textarea id="exportText" readonly style="width:100%;min-height:320px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg)">${esc(tab==='json'?json:csv)}</textarea>`}</div>
      <div class="mfoot"><span class="small muted" style="margin-right:auto">演示环境不能直接下载文件，请复制内容</span><button class="btn" data-x>关闭</button>${!blocked&&!warn?'<button class="btn primary" data-copy>复制</button>':''}</div></div></div>`;
    const M=$('#modal');M.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);
    const ok=M.querySelector('[data-ok]');if(ok)ok.onclick=()=>draw(true);
    M.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw(true)});
    const cp=M.querySelector('[data-copy]');if(cp)cp.onclick=()=>{const t=$('#exportText');navigator.clipboard.writeText(t.value).then(()=>toast('已复制')).catch(()=>{t.select();toast('已选中，请按 Ctrl/⌘+C 复制')});log(`导出 ${a.label}（${tab.toUpperCase()}）`);advanceStage('completed');save();renderSM()}};
  draw(false);
}

// ============ 事件绑定 ============
function bind(){
  const A=$('#app');
  A.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
  if(S.view==='home')bindHome();else bindMain(),bindNav();
  renderSM();
}
function bindNav(){document.querySelectorAll('.nav [data-sel]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.sel;S.selNode=null;render()})}
function bindHome(){
  const A=$('#app');const f=S.form;
  A.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(S.mode!==b.dataset.mode){S.mode=b.dataset.mode;toast('已切换模式：通用参数已保留');render()}});
  A.querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{S.gen=b.dataset.gen;render()});
  A.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>{f.idea=b.dataset.idea;render()});
  A.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>{const g=b.dataset.genre;if(f.genres.includes(g))f.genres=f.genres.filter(x=>x!==g);else if(f.genres.length<3)f.genres.push(g);else toast('类型最多选 3 个');render()});
  A.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{const g=b.dataset.style;f.styles=f.styles.includes(g)?f.styles.filter(x=>x!==g):[...f.styles,g];render()});
  A.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{const id=b.dataset.skill;if(f.skills.includes(id))f.skills=f.skills.filter(x=>x!==id);else if(f.skills.length<5)f.skills.push(id);else toast('每次最多挂载 5 个 Skill');render()});
  const on=(id,fn,ev='input')=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,fn)};
  on('idea',e=>f.idea=e.target.value);on('novelText',e=>{f.novelText=e.target.value;if(!f.novelName)f.novelName='粘贴的小说'});on('benchText',e=>f.benchText=e.target.value);
  on('market',e=>{f.market=e.target.value;f.episodes=MARKETS.find(x=>x.k===f.market).eps;render()},'change');
  on('episodes',e=>f.episodes=clamp(+e.target.value||80,10,150),'change');on('audience',e=>f.audience=e.target.value,'change');
  const readFile=(id,cb)=>on(id,e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>cb(file,String(r.result));r.readAsText(file)},'change');
  readFile('novelFile',(file,t)=>{f.novelName=file.name.replace(/\.\w+$/,'');f.novelText=t;render()});
  readFile('benchFile',(file,t)=>{f.benchText=t;render()});
  readFile('skillFile',(file,t)=>{
    const sk={id:'u'+Date.now(),name:file.name.replace(/\.\w+$/,''),desc:(t.split('\n').find(l=>l.trim())||'').replace(/^#+\s*/,'').slice(0,30)||'用户上传',scope:'全部',builtin:false,status:'uploading'};
    S.userSkills.push(sk);render();
    setTimeout(()=>{go('skill',sk,'validating','Skill '+sk.name);render();
      setTimeout(()=>{if(t.trim().length<10||t.length>50000){go('skill',sk,'invalid','Skill '+sk.name);toast('Skill 校验失败：内容为空或超过 5 万字')}else{go('skill',sk,'active','Skill '+sk.name);if(f.skills.length<5)f.skills.push(sk.id);toast('Skill 已上传并挂载')}save();render()},800)},500)});
}
function bindMain(){
  const M=$('#main');if(!M)return;const P=S.project;
  M.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
  M.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.sel;render()});
  M.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelTask(getArt(b.dataset.cancel)));
  M.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>regen(b.dataset.retry));
  M.querySelectorAll('[data-ignore]').forEach(b=>b.onclick=()=>{const a=getArt(b.dataset.ignore);go('artifact',a,'edited',a.label);a.notice='';save();render()});
  M.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>{const a=getArt(b.dataset.lock);a.prevLock=a.status;go('artifact',a,'locked',a.label);a.notice='';save();render()});
  M.querySelectorAll('[data-unlock]').forEach(b=>{if(b.closest('.play'))return;b.onclick=()=>{const a=getArt(b.dataset.unlock);const back=a.notice?'outdated':(a.prevLock==='ready'?'ready':'edited');go('artifact',a,back,a.label);if(back!=='outdated')a.notice='';save();render()}});
  M.querySelectorAll('[data-genseg]').forEach(b=>b.onclick=()=>{const r=segRanges(P).find(x=>x.k===b.dataset.genseg);genOutline(P.arts[r.k],r.from,r.to)});
  M.querySelectorAll('[data-genchain]').forEach(b=>b.onclick=()=>{const r=segRanges(P).find(x=>x.k===b.dataset.genchain);genOutline(P.arts[r.k],r.from,r.to,true)});
  // 策划案编辑
  if(S.sel==='plan'&&P.arts.plan.data){const a=P.arts.plan;const d=a.data;
    M.querySelectorAll('[data-field]').forEach(el=>el.onblur=()=>{const v=el.innerText.trim();if(v!==d[el.dataset.field]){d[el.dataset.field]=v;markEdited(a);render()}});
    M.querySelectorAll('[data-char]').forEach(el=>el.onblur=()=>{const c=d.chars[+el.dataset.char];const v=el.innerText.trim();if(v!==c.d){c.d=v;markEdited(a);render()}});
    M.querySelectorAll('[data-title]').forEach(b=>b.onclick=()=>{d.title=b.dataset.title;P.title=d.title;markEdited(a);render()});
    M.querySelectorAll('[data-regen]').forEach(b=>b.onclick=()=>{const k=b.dataset.regen;const fresh=genPlan({...P.params,idea:P.params.idea+' '},P);seed+=31;
      if(k==='title'){d.titles=[...new Set([...fresh.titles.slice(1),...T.titles._])].slice(0,3)}else if(k==='chars'){d.chars=fresh.chars}else d[k]=fresh[k];
      a.versions++;log(`[生成任务] 策划案·${b.parentElement.firstChild.textContent}：局部重新生成 → 成功`);markEdited(a);render();toast('已重新生成该区块')})}
  // 集纲编辑
  const oa=P.arts[S.sel];if(oa&&oa.data&&oa.data.eps){M.querySelectorAll('[data-ep]').forEach(el=>el.onblur=()=>{const e=oa.data.eps[+el.dataset.ep];const v=el.innerText.trim();if(v!==e[el.dataset.k]){e[el.dataset.k]=v;e.placeholder=false;markEdited(oa);render()}})}
  // 解析页
  M.querySelectorAll('[data-strength]').forEach(b=>b.onclick=()=>{P.parsed.strength=b.dataset.strength;render()});
  M.querySelectorAll('[data-bdir]').forEach(b=>b.onclick=()=>{P.benchDir=b.dataset.bdir;render()});
  ['rFrom','rTo'].forEach((id,i)=>{const el=document.getElementById(id);if(el)el.onchange=()=>{P.parsed.range[i]=+el.value}});
  // 互动剧本
  if(S.sel.startsWith('ia:')){const a=getArt(S.sel);
    M.querySelectorAll('[data-iatab]').forEach(b=>b.onclick=()=>{S.iaTab=b.dataset.iatab;renderMainOnly()});
    M.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoom(+b.dataset.zoom));
    M.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{S.selNode=b.dataset.goto;const n=a.data.nodes.find(x=>x.id===S.selNode);const svg=$('#cv');if(n&&svg){VIEW.x=svg.clientWidth/2-(n.x+75)*VIEW.k;VIEW.y=svg.clientHeight/2-(n.y+28)*VIEW.k}renderMainOnly()});
    bindInspector(a);bindPlay(a)}
}
function bindInspector(a){
  const n=a.data?.nodes.find(x=>x.id===S.selNode);if(!n)return;const M=$('#main');
  const t=$('#nTitle'),x=$('#nText');
  if(t)t.onchange=()=>{n.title=t.value;iaChanged(a,n);renderMainOnly()};
  if(x)x.onchange=()=>{n.text=x.value;iaChanged(a,n);renderMainOnly()};
  M.querySelectorAll('[data-nto]').forEach(s=>s.onchange=()=>{n.to=s.value||null;iaChanged(a,n);renderMainOnly()});
  M.querySelectorAll('[data-olabel]').forEach(i=>i.onchange=()=>{n.options[+i.dataset.olabel].label=i.value;iaChanged(a,n);renderMainOnly()});
  M.querySelectorAll('[data-oto]').forEach(s=>s.onchange=()=>{n.options[+s.dataset.oto].to=s.value||null;iaChanged(a,n);renderMainOnly()});
  M.querySelectorAll('[data-oeff]').forEach(i=>i.onchange=()=>{const o=n.options[+i.dataset.oeff];o.effects=o.effects||{};o.effects[i.dataset.var]=+i.value||0;iaChanged(a,n);renderMainOnly()});
  M.querySelectorAll('[data-odel]').forEach(b=>b.onclick=()=>{n.options.splice(+b.dataset.odel,1);iaChanged(a,n);renderMainOnly()});
  M.querySelectorAll('[data-rval]').forEach(i=>i.onchange=()=>{n.rules[+i.dataset.rval].val=+i.value||0;iaChanged(a,n);renderMainOnly()});
}
function bindPlay(a){
  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.play;const d=a.data;
    if(v==='restart'){PL=null;renderMainOnly();return}
    if(b.dataset.opt!=null){const n=d.nodes.find(x=>x.id===PL.cur);const o=n.options[+b.dataset.opt];Object.entries(o.effects||{}).forEach(([k,val])=>PL.vars[k]=(PL.vars[k]||0)+val);if(o.flag&&!PL.flags.includes(o.flag))PL.flags.push(o.flag)}
    PL.cur=v;PL.steps++;renderMainOnly()});
}
function regen(k){
  const P=S.project;const a=getArt(k);
  if(k==='plan'){runTask(a,{steps:8,produce:()=>genPlan(P.params,P),onDone:()=>{propagate('plan')}});return}
  if(k.startsWith('ia:')){convertToInteractive(a.src,a.cfg);return}
  const r=k==='all'?{from:1,to:P.params.episodes}:segRanges(P).find(x=>x.k===k);
  const old=a.data;genOutline(a,r.from,r.to);
  // 重新生成后下游互动剧本过期
  const iv=setInterval(()=>{if(a.status!=='generating'){clearInterval(iv);if(a.data!==old)propagate(k);save();render()}},200);
}
function act(x){
  const P=S.project;
  switch(x){
    case'home':S.view='home';render();break;
    case'open':S.view='project';render();break;
    case'sm':S.smOpen=!S.smOpen;render();break;
    case'sampleNovel':S.form.novelText=SAMPLE_NOVEL;S.form.novelName='重生之千金归来';render();break;
    case'sampleBench':S.form.benchText=SAMPLE_BENCH;render();break;
    case'create':{
      const f=S.form;
      if(S.mode==='original'&&f.idea.trim().length<5){toast('创意太短了，至少写 5 个字');return}
      if(S.mode==='novel'&&!f.novelText.trim()){toast('请先上传或粘贴小说');return}
      if(S.mode==='novel'&&!$('#copyright').checked){toast('请确认你拥有改编权');return}
      if(S.mode==='benchmark'&&!f.benchText.trim()){toast('请先上传或粘贴爆款剧本');return}
      if(!f.genres.length){toast('请至少选择一个类型');return}
      Object.values(timers).forEach(clearInterval);PL=null;createProject();break}
    case'reparse':{const o={status:'parse_failed'};go('project',o,'parsing','项目');P.stage='parsing';P.parseState='parsing';render();setTimeout(doParse,900);break}
    case'toPlan':startPlan();break;
    case'outlineModal':if(P.outlineMode){S.sel=P.outlineMode==='all'?'all':'c1';render();toast('集纲已存在，可在集纲页调整卡点')}else openOutlineModal(false);break;
    case'adjustCards':if(P.outlineMode==='all'){MC={total:P.params.episodes,...(P.cards||defaultCards(P.params.episodes)),mode:'cards',adjust:false};drawOutlineModal()}else openOutlineModal(false,true);break;
    case'toAll':mergeToAll();break;
    case'toIA':openIAModal(S.sel);break;
    case'validate':validateIA(getArt(S.sel));renderMainOnly();break;
    case'export':openExport(getArt(S.sel));break;
    case'fit':fit();break;
    case'addOpt':{const a=getArt(S.sel);const n=a.data.nodes.find(x=>x.id===S.selNode);n.options.push({label:'新选项',to:null,effects:{}});iaChanged(a,n);renderMainOnly();break}
    case'delNode':{const a=getArt(S.sel);const d=a.data;d.nodes=d.nodes.filter(x=>x.id!==S.selNode);log(`删除节点 ${S.selNode}`);S.selNode=null;iaChanged(a);renderMainOnly();break}
    case'expand':{const a=getArt(S.sel);const n=a.data.nodes.find(x=>x.id===S.selNode);const c=P.arts.plan.data.cast;n.text+=`\n△ （扩写）镜头推近，${c.A}的表情一点点僵住。\n${c.L}（低声）：“我早就知道会是这样。”`;iaChanged(a,n);renderMainOnly();toast('已扩写');break}
    case'reset':try{localStorage.removeItem('drama-demo')}catch(e){}Object.values(timers).forEach(clearInterval);S.project=null;S.log=[];S.view='home';PL=null;closeModal();render();break;
  }
}
load();
// 刷新时如果有任务停在生成中，恢复为可重试状态
if(S.project){const fix=a=>{if(a&&a.status==='generating'){a.status=a.data?(a.prev||'ready'):'error';if(a.task)a.task.status='failed',a.task.err='页面刷新，任务中断'}};Object.values(S.project.arts).forEach(fix);Object.values(S.project.ia||{}).forEach(fix);if(S.project.parseState==='parsing'){S.project.parseState='parse_failed';S.project.parseErr='页面刷新，解析中断'}}
render();
})();
</script>
