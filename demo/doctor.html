<!doctype html>
<html lang="zh-CN">
<head>

<title>澜幕 · 剧本医生</title>
<style>
/* 生成页：右上角「剧本医生」入口 + 可视化体检报告（总览 / 逐集 / 问题），正文里同步标注问题 */
:root{color-scheme:dark;--bg:#061320;--bg2:#0A1B2A;--surface:#0D2132;--surface2:#12293C;--hover:#183449;--line:#1B3346;--line2:#27465E;--fg:#E5F0F5;--fg2:#A6BFCC;--muted:#6C8899;--accent:#3FD6C9;--accent-dim:rgba(63,214,201,.14);--on-accent:#032220;--accent2:#4BA3FF;--coral:#FF8E6E;--violet:#9D8CFF;

--s-before:#8A78F0;--s-after:#26A69B;--st-good:#6EDB9A;--st-warn:#F5C36B;--st-bad:#FF6B6B;
--shadow:0 18px 50px rgba(0,0,0,.4);--f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--f-serif:"Noto Serif SC","Songti SC",serif;--f-mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--f-body);overflow:hidden}
button,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}.muted{color:var(--muted)}.sm{font-size:12px}.mono{font-family:var(--f-mono)}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}.btn.ghost{border-color:transparent;background:transparent;color:var(--fg2)}.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--fg2)}.iconbtn:hover{background:var(--hover);color:var(--fg)}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(150deg,var(--accent),var(--accent2));color:var(--on-accent)}.logo svg{width:20px;height:20px;fill:currentColor;stroke:none}
.steps{display:flex;gap:6px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px}

.docbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line2));background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface));font-weight:700}
.docbtn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}.docbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.docbtn svg.i{width:18px;height:18px;color:var(--accent)}.docbtn.on svg.i{color:var(--on-accent)}
.docbtn .score{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:8px;background:var(--bg2);color:var(--fg)}
.docbtn .score i{width:8px;height:8px;border-radius:50%}
.docbtn .score.stale{color:var(--st-warn)}
.ws{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;min-height:0;transition:grid-template-columns .25s}
.ws.wide{grid-template-columns:200px minmax(0,1fr) 560px}
.tree{border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--fg2)}
.tree h4{font-size:11px;color:var(--muted);font-weight:500;margin:14px 10px 4px}.tree a{padding:7px 10px;border-radius:8px;display:flex;gap:8px}.tree a.on{background:var(--surface2);color:var(--fg)}
.tree a .r{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.main{overflow:auto;position:relative}
.doc{max-width:860px;margin:0 auto;padding:20px 32px 40vh;display:grid;gap:14px}
.dh{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}.dh h2{margin:0;font-size:24px;font-weight:900}.dh .meta{font-size:12px;color:var(--muted)}.dh .acts{margin-left:auto;display:flex;gap:8px}
.jump{position:sticky;top:0;z-index:4;display:flex;gap:4px;padding:8px 0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}
.jump button{position:relative;min-width:36px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:11px;color:var(--fg2)}
.jump button i{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:14px;height:3px;border-radius:2px}
.ep{display:grid;gap:8px;padding:6px 0 14px;border-radius:12px;transition:background .3s}
.ep>header{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.ep>header .no{font-family:var(--f-mono);color:var(--accent);font-size:13px}.ep>header b{font-family:var(--f-serif);font-size:18px}
.eps{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:var(--f-mono);padding:1px 7px;border-radius:6px;background:var(--surface2);margin-left:auto}
.eps i{width:7px;height:7px;border-radius:50%}
.cardtag{font-size:11px;font-weight:700;color:var(--coral);border:1px solid var(--coral);padding:0 6px;border-radius:5px}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:4px;font-size:13.5px}
.scene .hd{font-family:var(--f-mono);font-size:12px;font-weight:600}
.ln{color:var(--fg2);border-radius:4px;transition:background .3s}.ln.dlg b{color:var(--fg)}.ln .par{color:var(--muted)}.ln.hook{color:var(--coral);font-weight:600}.ln.act::before{content:"△ ";color:var(--muted)}
.ln.mk{cursor:pointer;text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:4px}
.ln.mk.bad{text-decoration-color:var(--st-bad)}.ln.mk.warn{text-decoration-color:var(--st-warn)}
.ln .num{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:700;margin-left:6px;vertical-align:2px;color:#062033}
.ln.mk.bad .num{background:var(--st-bad)}.ln.mk.warn .num{background:var(--st-warn)}
.ln.focus{background:color-mix(in srgb,var(--accent) 18%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 50%,transparent)}
.ln.fixed{background:color-mix(in srgb,var(--s-after) 18%,transparent)}
.ep.scan{background:color-mix(in srgb,var(--accent) 7%,transparent)}
/* 右侧：AI 助手 / 剧本医生 */
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--bg2) 70%,transparent)}
.side>header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.side>header b{font-size:15px}
.scope{display:flex;align-items:center;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
.scope button{border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--fg2)}.scope button.on{border-color:var(--accent);color:var(--fg);background:var(--accent-dim)}.scope button:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:2px;padding:8px 14px 0}.tabs button{padding:6px 12px;border-radius:8px 8px 0 0;color:var(--fg2);font-weight:500}.tabs button.on{background:var(--surface);color:var(--fg);font-weight:700}
.body{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:grid;gap:12px;align-content:start;background:var(--surface);margin:0 0 0;border-top:1px solid var(--line)}
.foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg2);display:grid;gap:8px}
.card h4{margin:0;font-size:13px;display:flex;align-items:center;gap:6px}.card h4 .sm{font-weight:400}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--line2) 0)}
.ring::after{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--bg2)}
.ring div{position:relative;z-index:1;text-align:center;line-height:1.1}.ring b{font-size:34px;font-family:var(--f-mono)}.ring small{display:block;font-size:11px;color:var(--muted)}
.grade{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;padding:2px 8px;border-radius:8px;background:var(--surface2)}
.delta{font-family:var(--f-mono);font-size:12px}
.st{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:0 6px;border-radius:5px;white-space:nowrap}
.st.good{color:var(--st-good);background:color-mix(in srgb,var(--st-good) 12%,transparent)}.st.warn{color:var(--st-warn);background:color-mix(in srgb,var(--st-warn) 12%,transparent)}.st.bad{color:var(--st-bad);background:color-mix(in srgb,var(--st-bad) 12%,transparent)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--fg2);flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:84px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:12px}
.bar .tr{display:grid;gap:2px}.bar .tr div{height:8px;border-radius:0 4px 4px 0;background:var(--s-after);position:relative}
.bar .tr div.b{background:var(--s-before)}
.bar .v{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-family:var(--f-mono);color:var(--fg)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.heat{display:grid;gap:2px}.heat .row{display:grid;grid-template-columns:84px repeat(9,minmax(0,1fr));gap:2px;align-items:center}
.heat .lbl{font-size:11px;color:var(--fg2)}.heat .colh{font-size:10px;color:var(--muted);text-align:center;font-family:var(--f-mono)}
.heat .cell{height:26px;border-radius:4px;font-size:10px;font-family:var(--f-mono);color:#062033;font-weight:700;display:grid;place-items:center;outline:2px solid transparent;outline-offset:1px}
.heat .cell:hover,.heat .cell.sel{outline-color:var(--fg)}
.heat .cell.good{background:color-mix(in srgb,var(--st-good) 55%,var(--bg2))}.heat .cell.warn{background:var(--st-warn)}.heat .cell.bad{background:var(--st-bad)}
.heat .colh.card{color:var(--coral);font-weight:700}
.iss{display:grid;gap:8px}
.iss h5{margin:4px 0 0;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.it{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;background:var(--bg2)}
.it.focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-dim)}.it.done{opacity:.6}
.it .t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.it .loc{font-size:11px;font-family:var(--f-mono);color:var(--muted)}
.it q{display:block;font-size:12px;color:var(--fg2);border-left:2px solid var(--line2);padding-left:8px}
.it q::before,.it q::after{content:''}
.it .sg{font-size:12px;color:var(--fg2)}.it .sg b{color:var(--accent);font-weight:500}
.it .acts{display:flex;gap:6px;align-items:center}
.it .diff{display:grid;gap:4px;font-size:12px;background:var(--surface);border-radius:8px;padding:8px}.it .diff .o{color:var(--muted);text-decoration:line-through}.it .diff .n{background:color-mix(in srgb,var(--s-after) 20%,transparent);border-radius:4px;padding:2px 6px}
.scan{display:grid;gap:10px;place-items:center;padding:40px 10px;text-align:center}
.pulse{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--accent-dim);color:var(--accent);animation:pl 1.4s ease-in-out infinite}.pulse svg.i{width:40px;height:40px}
@keyframes pl{50%{box-shadow:0 0 0 14px rgba(63,214,201,0)}0%{box-shadow:0 0 0 0 rgba(63,214,201,.4)}}
.prog{width:100%;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.asst{padding:14px;display:grid;gap:10px;font-size:13px;color:var(--fg2)}.asst .bub{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tt{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;max-width:240px;line-height:1.5}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:90}
.switch2{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);cursor:pointer}
@media (max-width:1100px){.ws{grid-template-columns:150px minmax(0,1fr) 320px}.ws.wide{grid-template-columns:0 minmax(0,1fr) 480px}.ws.wide .tree{display:none}.steps{display:none}}
@media (max-width:760px){body{overflow:auto}.ws,.ws.wide{grid-template-columns:1fr}.tree{display:none}.side{position:fixed;inset:56px 0 0 0;z-index:30;background:var(--bg)}.side.hide{display:none}.doc{padding:16px 16px 40vh}}
</style>

<div class="app"><header class="top" id="top"></header>
<div class="ws" id="ws"><nav class="tree"><a>策划案</a><h4>集纲</h4><a>一卡<span class="r">1–9</span></a><a>二卡<span class="r">10–26</span></a><a>三卡<span class="r">27–45</span></a><a>结局段<span class="r">46–60</span></a><h4>剧本</h4><a class="on">短剧 · 一卡<span class="r">1–9</span></a></nav>

<script>

const EP=[['订婚宴','{A}当众指认{P}偷了传家玉佩，满堂哗然。','{L}看着{P}，没有替她说话。'],['被逐出门','{X}当众宣布与{P}断绝关系，{P}雨夜离开林家。','一辆黑色轿车停在了{P}面前。'],['神秘来电','{P}接到陌生来电：「大小姐，三年之约到了。」','电话那头报出一个让她发抖的名字。'],['三年后','{P}以海外集团代表的身份回到江城。','她摘下墨镜，台下有人认出了她。'],['旧宅','{P}回到林家老宅，翻看母亲的旧物。','相册夹层里有一张旧照片。'],['日常','{P}和助理讨论接下来半年的计划。','助理欲言又止。'],['当众打脸','发布会上{A}抄袭的设计被{P}当众拆穿。','{A}咬着牙说：你等着。'],['身份线索','{L}查到{P}这三年的行踪。','{L}拨通了一个三年没打过的电话。'],['马甲将掉','慈善晚宴上{P}的身份即将揭晓。','门被推开的瞬间，所有人都愣住了。']];

const eps=EP.map((e,k)=>{const no=k+1;const card=no===9?'一卡':'';return{no,title:e[0],card,scenes:[0,1].map(i=>{const a=L[(no+i)%8],b=L[(no+i+1)%8],c=L[(no*3+i)%8];
  const lines=[{t:'act',x:i?'宾客们窃窃私语，目光齐刷刷落在林晚身上。':fill(e[1])},{t:'dlg',w:fill(a[0]),p:a[1],x:fill(a[2])},{t:'dlg',w:fill(b[0]),p:b[1],x:fill(b[2])}];if(no%3!==2)lines.push({t:'dlg',w:fill(c[0]),p:c[1],x:fill(c[2])});

const DIMS=[['oral','台词口语化','台词用短句，一句只说一件事，超过 24 字就该拆。'],['turn','每场有转折','每场戏至少一个情绪或信息反转。'],['hook','结尾钩子','每集最后一句必须是钩子，卡点集用最强的那个。'],['shoot','动作可拍','动作只写镜头拍得到的。'],['clash','对白交锋','冲突戏要有来有回。'],['quote','口播金句','每集留 1–2 句能剪成切片的话。']];
const STRONG=/(枪|血|死|倒|只有|最后|竟|DNA|亲生|名字|愣住|消失)/;
function scoreEp(e){const ls=e.scenes.flatMap(s=>s.lines),dl=ls.filter(l=>l.t==='dlg'),hook=ls.find(l=>l.t==='hook');

  el.querySelectorAll('[data-jumpep]').forEach(b=>b.onclick=()=>scrollEp(+b.dataset.jumpep));
  const sv=$('#curve');if(sv){const xh=sv.querySelector('#xh');sv.querySelectorAll('[data-ci]').forEach(rc=>{const i=+rc.dataset.ci;const p=S.rep.per[i],q=S.prev&&S.prev.per[i];
    rc.onmousemove=e=>{const cx=+rc.getAttribute('x')+ +rc.getAttribute('width')/2;xh.setAttribute('x1',cx);xh.setAttribute('x2',cx);xh.setAttribute('visibility','visible');tt.hidden=false;tt.textContent=`第 ${p.no} 集「${eps[i].title}」${q?`修改前 ${q.total} → 修改后 ${p.total}`:`${p.total} 分`}${eps[i].card?' · 一卡付费卡点':''}`;tt.style.left=(e.clientX+12)+'px';tt.style.top=(e.clientY+12)+'px'};
    rc.onmouseleave=()=>{xh.setAttribute('visibility','hidden');tt.hidden=true};rc.onclick=()=>scrollEp(p.no)})}
  el.querySelectorAll('[data-on]').forEach(c=>c.onchange=()=>{S.rep.iss.find(x=>x.id===c.dataset.on).on=c.checked;drawSide()});
  el.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>openIssue(b.dataset.loc));
  el.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{S.preview=b.dataset.prev;S.focus=b.dataset.prev;drawSide();drawDoc()});
  el.querySelectorAll('[data-unprev]').forEach(b=>b.onclick=()=>{S.preview=null;drawSide()});
  el.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>{applyFix([S.rep.iss.find(x=>x.id===b.dataset.apply)]);})}
function openIssue(id){const x=S.rep.iss.find(i=>i.id===id);if(!x)return;S.side='doctor';S.tab='iss';S.focus=id;drawAll();scrollLine(`ln-${x.no}-${x.si}-${x.li}`);const it=document.getElementById('it-'+id);if(it)it.scrollIntoView({block:'nearest'})}
function applyFix(list){list.forEach(x=>{const l=eps[x.no-1].scenes[x.si].lines[x.li];l.x=x.fix(l.x);x.done=true;FIXED.add(x.no+'-'+x.k)});S.preview=null;S.ver++;S.stale=true;drawAll();toast(`已改 ${list.length} 处，正文里改过的地方有底色。点「重新体检」看分数变化`)}
function runCheck(){S.scanning=1;S.focus=null;drawAll();const iv=setInterval(()=>{S.scanning++;if(S.scanning>9){clearInterval(iv);S.scanning=0;if(S.rep)S.prev=S.rep;S.rep=check();S.stale=false;S.tab='overview';drawAll();$('#main').scrollTo({top:0});toast(S.prev?`重新体检完成：${S.prev.total} → ${S.rep.total}`:`体检完成：${S.rep.total} 分`);return}drawSide();drawDoc();scrollEp(S.scanning)},520)}
function bind(root){root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act))}
function act(k){
  if(k==='doctor'){if(S.side==='doctor'){S.side='asst';drawAll();return}S.side='doctor';drawAll();if(!S.rep)runCheck()}
  if(k==='asst'){S.side='asst';drawAll()}
  if(k==='recheck')runCheck();
  if(k==='bulk'){const list=S.rep.iss.filter(x=>x.on&&!x.done);applyFix(list);setTimeout(runCheck,900)}
  if(k==='export'){const r=S.rep;const t=`剧本医生体检报告 · 短剧剧本 · 一卡（v${S.ver}）\n综合 ${r.total} 分\n`+DIMS.map(([k,n])=>`${n} ${r.dim[k]}`).join(' / ')+'\n\n'+r.iss.map(x=>`${x.n}. ${x.loc} ${x.dim} ${x.v} 分：${x.why}。建议：${x.tip}`).join('\n');navigator.clipboard&&navigator.clipboard.writeText(t).catch(()=>{});toast('报告已复制（正式版可导出 PDF）')}}
function drawAll(){drawTop();drawDoc();drawSide()}
drawAll();
})();
</script>
